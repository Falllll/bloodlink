deptrac:
  paths:
    - ./app/Modules
    - ./app/Shared
    - ./app/Models

  layers:
    - name: Framework
      collectors:
        - type: classNameRegex
          value: /^Illuminate\\.*/
        - type: classNameRegex
          value: /^Symfony\\.*/
        - type: classNameRegex
          value: /^Spatie\\.*/

    - name: Shared
      collectors:
        - type: directory
          value: app/Shared/.*

    - name: Models
      collectors:
        - type: directory
          value: app/Models/.*

    - name: EvtIdentity
      collectors:
        - type: directory
          value: app/Modules/Identity/Domain/Events/.*
    - name: DomIdentity
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Identity/Domain/.*
          must_not:
            - type: directory
              value: app/Modules/Identity/Domain/Events/.*
    - name: ModIdentity
      collectors:
        - type: directory
          value: app/Modules/Identity/(Application|Http|Infrastructure|Database|Tests)/.*

    - name: EvtDonor
      collectors:
        - type: directory
          value: app/Modules/Donor/Domain/Events/.*
    - name: DomDonor
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Donor/Domain/.*
          must_not:
            - type: directory
              value: app/Modules/Donor/Domain/Events/.*
    - name: ModDonor
      collectors:
        - type: directory
          value: app/Modules/Donor/(Application|Http|Infrastructure|Database|Tests)/.*

    - name: EvtInventory
      collectors:
        - type: directory
          value: app/Modules/Inventory/Domain/Events/.*
    - name: DomInventory
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Inventory/Domain/.*
          must_not:
            - type: directory
              value: app/Modules/Inventory/Domain/Events/.*
    - name: ModInventory
      collectors:
        - type: directory
          value: app/Modules/Inventory/(Application|Http|Infrastructure|Database|Tests)/.*

    - name: EvtRequest
      collectors:
        - type: directory
          value: app/Modules/Request/Domain/Events/.*
    - name: DomRequest
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Request/Domain/.*
          must_not:
            - type: directory
              value: app/Modules/Request/Domain/Events/.*
    - name: ModRequest
      collectors:
        - type: directory
          value: app/Modules/Request/(Application|Http|Infrastructure|Database|Tests)/.*

    - name: EvtNotification
      collectors:
        - type: directory
          value: app/Modules/Notification/Domain/Events/.*
    - name: DomNotification
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Notification/Domain/.*
          must_not:
            - type: directory
              value: app/Modules/Notification/Domain/Events/.*
    - name: ModNotification
      collectors:
        - type: directory
          value: app/Modules/Notification/(Application|Http|Infrastructure|Database|Tests)/.*

  ruleset:
    Shared: [Framework]
    Models: [Framework, Shared, DomIdentity]

    ModIdentity:     [Framework, Shared, Models, DomIdentity, EvtIdentity, EvtDonor, EvtInventory, EvtRequest, EvtNotification]
    ModDonor:        [Framework, Shared, Models, DomDonor, EvtIdentity, EvtDonor, EvtInventory, EvtRequest, EvtNotification]
    ModInventory:    [Framework, Shared, Models, DomInventory, EvtIdentity, EvtDonor, EvtInventory, EvtRequest, EvtNotification]
    ModRequest:      [Framework, Shared, Models, DomRequest, EvtIdentity, EvtDonor, EvtInventory, EvtRequest, EvtNotification]
    ModNotification: [Framework, Shared, Models, DomNotification, EvtIdentity, EvtDonor, EvtInventory, EvtRequest, EvtNotification]

    DomIdentity: ~
    DomDonor: ~
    DomInventory: ~
    DomRequest: ~
    DomNotification: ~

    EvtIdentity: ~
    EvtDonor: ~
    EvtInventory: ~
    EvtRequest: ~
    EvtNotification: ~
