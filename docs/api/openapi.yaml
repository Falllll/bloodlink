openapi: 3.0.3
info:
  title: BloodLink API
  version: 1.0.0
  description: |
    API headless untuk sistem manajemen bank darah BloodLink. Setiap respons
    error mengikuti amplop `Error` di bawah, dengan `error.code` sebagai
    satu-satunya nilai yang boleh dipakai klien untuk bercabang logika.
    `error.message` hanya untuk keperluan baca manusia (log, debugging) dan
    isinya bisa berubah kapan saja tanpa dianggap breaking change.
    Setiap endpoint daftar tersaring otomatis ke fasilitas pemegang token, dan
    akses lintas fasilitas dibalas `FORBIDDEN` 403 — kecuali endpoint master
    data `/facilities`, yang menampilkan seluruh fasilitas ke semua pengguna
    terautentikasi dan membatasi hanya operasi tulis lewat role `admin`.
servers:
  - url: http://localhost:8000/api/v1
    description: Local
  - url: http://localhost:8000
    description: Local (health check, di luar prefix /api/v1)
paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Endpoint di luar prefix /api/v1. Menandakan proses aplikasi hidup.
      servers:
        - url: http://localhost:8000
          description: Local (health check, di luar prefix /api/v1)
      responses:
        '200':
          description: Aplikasi hidup.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                required: [status]
  /health/ready:
    get:
      summary: Readiness probe
      description: >-
        Endpoint di luar prefix /api/v1. Memeriksa database, redis, dan
        heartbeat worker. Mengembalikan 503 saat salah satu pemeriksaan gagal
        (degraded), bukan hanya saat semuanya gagal.
      servers:
        - url: http://localhost:8000
          description: Local (health check, di luar prefix /api/v1)
      responses:
        '200':
          description: Semua pemeriksaan lolos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
        '503':
          description: Satu atau lebih pemeriksaan gagal (degraded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
  /auth/register:
    post:
      summary: Registrasi donor baru
      description: Membuat user baru dengan role `donor` dan langsung menerbitkan token akses.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
              required: [name, email, password, password_confirmation]
      responses:
        '200':
          description: Registrasi berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthToken'
                  meta:
                    type: object
                required: [data, meta]
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/login:
    post:
      summary: Login
      description: Menukar email dan password dengan token akses. Dibatasi 5 percobaan per menit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Login berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthToken'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      summary: Logout
      description: Mencabut hanya token yang dipakai request ini, bukan seluruh token milik user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Logout berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /me/donor:
    get:
      summary: Profil donor milik akun yang login
      description: >-
        Donor diselesaikan dari token, bukan dari parameter path. Akun yang
        belum tertaut ke baris donor aktif (termasuk baris yang sudah digabung
        lewat merge) dibalas 404 `DONOR_ACCOUNT_NOT_LINKED`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil donor milik akun ini.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DonorProfile'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/donor/donations:
    get:
      summary: Riwayat donasi milik akun yang login
      description: >-
        Hanya donasi milik donor yang tertaut ke token ini, terbaru lebih dulu
        (`completed_at` desc, lalu `id` desc sebagai tie-breaker). 20 baris per
        halaman. Akun yang belum tertaut dibalas 404 `DONOR_ACCOUNT_NOT_LINKED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Riwayat donasi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Donation'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/donor/appointments:
    get:
      summary: Janji temu milik akun yang login
      description: >-
        Hanya janji temu milik donor yang tertaut ke token ini, termasuk walk-in
        yang dicatat petugas. Terbaru lebih dulu menurut waktu janji temu:
        `scheduled_for`, atau `arrived_at` untuk walk-in yang tidak punya
        `scheduled_for` (desc, lalu `id` desc sebagai tie-breaker). 20 baris per
        halaman. Akun yang belum tertaut dibalas 404 `DONOR_ACCOUNT_NOT_LINKED`,
        bukan daftar kosong.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Janji temu donor ini.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Donor memesan janji temunya sendiri
      description: >-
        Berbeda dari jalur petugas, `scheduled_for` WAJIB di sini dan harus di
        masa depan: walk-in (`arrived`) adalah pernyataan petugas, bukan donor.
        Fasilitas diambil dari pendaftaran donor (`registered_facility_id`),
        tidak bisa dipilih. Key di luar `scheduled_for` dan `note` ditolak 422
        `not_allowed`. Satu donor hanya boleh punya satu janji temu terbuka;
        pesanan kedua dibalas 409 `APPOINTMENT_TRANSITION_REJECTED` -- batalkan
        yang lama lebih dulu untuk menjadwal ulang. Akun yang belum tertaut
        dibalas 404 `DONOR_ACCOUNT_NOT_LINKED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduled_for:
                  type: string
                  format: date-time
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
              required: [scheduled_for]
      responses:
        '201':
          description: Janji temu tercatat berstatus `booked`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Appointment'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/donor/appointments/{appointment}/status:
    patch:
      summary: Donor membatalkan janji temunya sendiri
      description: >-
        Satu-satunya status yang boleh dikirim donor adalah `cancelled`; status
        lain (`arrived`, `screened`, `completed`, `no_show`) adalah pernyataan
        petugas dan ditolak 422. Janji temu dicari di antara milik donor ini
        saja, jadi janji temu donor lain dibalas 404 -- bukan 403. Pembatalan
        tetap mengikuti graf transisi; dari status terminal ditolak 409.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: appointment
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID janji temu (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [cancelled]
              required: [status]
      responses:
        '200':
          description: Janji temu dibatalkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Appointment'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /audit-logs:
    get:
      summary: Daftar audit log
      description: >-
        Read-only. Pembaca tanpa fasilitas (operator global) melihat seluruh
        baris; pembaca ber-fasilitas hanya melihat baris dengan
        `actor_facility_id` miliknya sendiri. Hanya method `GET` yang ada
        untuk path ini.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - in: query
          name: occurred_from
          required: false
          schema:
            type: string
            format: date-time
          description: Batas bawah `occurred_at`, inklusif.
        - in: query
          name: occurred_to
          required: false
          schema:
            type: string
            format: date-time
          description: Batas atas `occurred_at`, inklusif. Harus >= `occurred_from`.
        - in: query
          name: filter[auditable_type]
          required: false
          schema:
            type: string
          description: Filter persamaan pada `auditable_type`.
        - in: query
          name: filter[auditable_id]
          required: false
          schema:
            type: integer
          description: Filter persamaan pada `auditable_id`.
        - in: query
          name: filter[action]
          required: false
          schema:
            type: string
            enum: [created, updated, deleted]
          description: Filter persamaan pada `action`.
        - in: query
          name: filter[actor_id]
          required: false
          schema:
            type: integer
          description: Filter persamaan pada `actor_id`.
        - in: query
          name: filter[actor_facility_id]
          required: false
          schema:
            type: integer
          description: Filter persamaan pada `actor_facility_id`.
        - in: query
          name: filter[trace_id]
          required: false
          schema:
            type: string
            format: uuid
          description: Filter persamaan pada `trace_id`.
      responses:
        '200':
          description: Daftar baris audit log yang boleh dilihat pemegang token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /eligibility/self-check:
    post:
      summary: Cek kelayakan donor mandiri (anonim)
      description: >-
        Endpoint publik, tanpa token dan tanpa Idempotency-Key. Tidak
        menerima identitas (nik/phone ditolak) dan tidak menulis baris
        apa pun -- stateless. Deferral donor terdaftar tidak ikut
        dipertimbangkan (pemanggil anonim), jadi respons selalu memuat
        `is_provisional: true`. Dibatasi 20 permintaan per menit per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date_of_birth:
                  type: string
                  format: date
                sex:
                  type: string
                  enum: [male, female]
                weight_kg:
                  type: number
                  format: double
                  minimum: 20
                  maximum: 300
                  nullable: true
                last_donation_date:
                  type: string
                  format: date
                  nullable: true
                planned_volume_ml:
                  type: integer
                  enum: [350, 450]
                  nullable: true
              required: [date_of_birth, sex]
      responses:
        '200':
          description: Hasil pemeriksaan kelayakan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EligibilitySelfCheck'
                  meta:
                    type: object
                required: [data, meta]
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /facilities:
    get:
      summary: Daftar fasilitas
      description: Master data seluruh fasilitas, tidak tersaring ke fasilitas pemegang token.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Daftar fasilitas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Facility'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      summary: Daftarkan fasilitas baru
      description: Hanya role `admin`. `code` di-uppercase otomatis dan wajib unik.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityWrite'
      responses:
        '201':
          description: Fasilitas dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Facility'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /facilities/{facility}:
    get:
      summary: Detail fasilitas
      description: >-
        Admin bisa melihat fasilitas mana pun; peran lain hanya fasilitas
        aktif atau fasilitas miliknya sendiri.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: Detail fasilitas berikut koordinat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FacilityWithCoordinates'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Perbarui fasilitas
      description: Hanya role `admin`. Semua field opsional; hanya yang dikirim yang diperbarui.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityWrite'
      responses:
        '200':
          description: Fasilitas diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Facility'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /facilities/{facility}/deactivate:
    patch:
      summary: Nonaktifkan fasilitas
      description: Mengubah `is_active` menjadi `false`. Baris tidak dihapus.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Fasilitas dinonaktifkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Facility'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /donors/merge:
    post:
      summary: Gabungkan dua baris donor duplikat
      description: >-
        Hanya role `admin`. Baris `source_id` ditandai `merged_into_id` ke
        `target_id` dan tetap ada; `target_id` mewarisi `last_donation_date`
        terbaru, `donation_count` gabungan, seluruh baris `deferrals` milik
        sumber dipindahkan ke target, serta NIK/email dari sumber kalau
        miliknya masih kosong.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_id:
                  type: string
                  format: uuid
                  description: Public ID baris donor yang akan ditandai sebagai duplikat.
                target_id:
                  type: string
                  format: uuid
                  description: Public ID baris donor kanonik yang akan mewarisi data sumber.
              required: [source_id, target_id]
      responses:
        '200':
          description: Kedua donor berhasil digabungkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Public ID donor kanonik (target).
                      merged_id:
                        type: string
                        format: uuid
                        description: Public ID donor sumber, sekarang menunjuk ke id lewat merged_into_id.
                    required: [id, merged_id]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /donors/{donor}/consents:
    post:
      summary: Rekam consent donor
      description: >-
        Admin global, admin fasilitas donor tersebut, atau staf fasilitas
        donor tersebut. Consent aktif sebelumnya (kalau ada) otomatis
        dicabut sebelum baris baru dibuat.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: donor
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID donor (`public_id`). ID numerik internal tidak pernah keluar ke API.
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purposes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [donation, health_screening, contact_for_urgent_request, data_retention]
              required: [purposes]
      responses:
        '201':
          description: Consent tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Public ID baris consent.
                      purposes:
                        type: array
                        items:
                          type: string
                          enum: [donation, health_screening, contact_for_urgent_request, data_retention]
                      granted_at:
                        type: string
                        format: date-time
                    required: [id, purposes, granted_at]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /donors/{donor}:
    get:
      summary: Detail profil donor
      description: Admin global, admin fasilitas donor tersebut, atau staf fasilitas donor tersebut.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: donor
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID donor (`public_id`). ID numerik internal tidak pernah keluar ke API.
      responses:
        '200':
          description: Detail profil donor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DonorProfile'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Perbarui profil donor
      description: >-
        Admin global, admin fasilitas donor tersebut, atau staf fasilitas
        donor tersebut. Semua field opsional; hanya yang dikirim yang
        diperbarui. NIK hanya boleh diisi sekali saat masih kosong --
        mengubah NIK yang sudah terisi ditolak 422 (`nik_not_changeable`).
        `date_of_birth` dan `sex` sengaja tidak bisa diubah lewat endpoint
        ini.
