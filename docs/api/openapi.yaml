        appointment_id:
          type: string
          format: uuid
          description: Public ID janji temu (`public_id`).
        screening_id:
          type: string
          format: uuid
          nullable: true
          description: Public ID skrining (`public_id`).
        volume_ml:
          type: integer
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
      required:
        - id
        - donor_id
        - appointment_id
        - screening_id
        - volume_ml
        - started_at
        - completed_at
        - note
    StorageLocation:
      type: object
      description: >-
        Alat penyimpanan yang nyata milik satu fasilitas. `id` numerik internal
        dan `facility_id` tidak pernah keluar ke API.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [refrigerator, freezer, deep_freezer, platelet_agitator, ambient_shelf]
        purpose:
          type: string
          enum: [untested, reactive, indeterminate, release_ready, general]
