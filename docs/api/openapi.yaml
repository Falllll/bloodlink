      summary: Ketersediaan slot appointment
      description: >-
        Slot mendatang dari pola fasilitas, dengan offset zona waktu EKSPLISIT
        di setiap `starts_at`/`ends_at` (mis. `2026-11-02T08:00:00+07:00`).
        Kirim `starts_at` apa adanya sebagai `scheduled_for` saat memesan.
        `from` adalah tanggal LOKAL fasilitas. Tanggal tutup dan slot yang sudah
        lewat tidak muncul. `schedule_configured: false` = fasilitas belum punya
        pola: tidak ada slot, dan pemesanan di sana belum dibatasi kapasitas --
        klien jangan mengarang grid.
