  /blood-requests:
    get:
      summary: Daftar permintaan darah
      description: >-
        Tersaring otomatis ke fasilitas pemegang token; operator global
        melihat seluruhnya. Butuh `request.view`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [needed_by, -needed_by, created_at, -created_at]
        - in: query
          name: filter[status]
          required: false
          schema:
            type: string
            enum: [open, partially_fulfilled, fulfilled, cancelled, expired]
        - in: query
          name: filter[urgency]
          required: false
          schema:
            type: string
            enum: [routine, urgent, emergency]
        - in: query
          name: filter[blood_group]
          required: false
          schema:
            type: string
            enum: [A, B, AB, O]
        - in: query
          name: filter[component]
          required: false
          schema:
            type: string
            enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
      responses:
        '200':
          description: Daftar permintaan darah.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BloodRequest'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      summary: Ajukan permintaan darah
      description: >-
        Mencatat apa yang diminta rumah sakit; selalu lahir berstatus `open`
        dan selalu milik fasilitas pemegang token -- `facility_id` maupun
        `status` di body ditolak 422 `not_allowed`. Operator global tanpa
        fasilitas ditolak 403. Permintaan TIDAK diperiksa kompatibilitas
        maupun ketersediaan stoknya: kombinasi yang mustahil dipenuhi tetap
        tercatat. `needed_by` wajib dan harus di masa depan. Batas `quantity`
        1..20 adalah kewarasan instrumen, bukan aturan medis.
        `patient_reference` adalah rujukan internal rumah sakit, bukan
        identitas pasien. Butuh `request.create`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patient_reference:
                  type: string
                  maxLength: 64
                component:
                  type: string
                  enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
                blood_group:
                  type: string
                  enum: [A, B, AB, O]
                rh_factor:
                  type: string
                  enum: [positive, negative]
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 20
                urgency:
                  type: string
                  enum: [routine, urgent, emergency]
                needed_by:
                  type: string
                  format: date-time
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
              required: [patient_reference, component, blood_group, rh_factor, quantity, urgency, needed_by]
      responses:
        '201':
          description: Permintaan tercatat berstatus `open`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodRequest'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-requests/urgent:
    post:
      summary: Buat permintaan darurat dan pindai stok terdekat
      description: >-
        Membuat permintaan seperti `POST /blood-requests` (aturan validasi
        identik), tetapi `urgency` hanya `urgent` atau `emergency`. Dalam
        panggilan yang sama, stok fasilitas dalam radius operasional
        (`config/matching.php`, default 30 km) dipindai lebih dulu -- sebelum
        donor dipanggil. Pindaian mengembalikan AGREGAT per fasilitas saja:
        tidak ada identitas kantong, nomor unit, atau kedaluwarsa per kantong;
        detail unit hanya lewat alur transfer stok. Pencocokan memakai gerbang
        kompatibilitas ABO/RhD (bukan kesamaan golongan); hanya unit
        `released`, belum kedaluwarsa sebelum `needed_by`, dan tanpa transfer
        terbuka yang dihitung. Fasilitas peminta selalu pertama (jarak 0).
        Tidak mengalokasikan apa pun. Pindaian yang tidak bisa dijalankan
        tidak pernah menggagalkan permintaan -- lihat `nearby_stock_status`.
        Butuh `request.create` dan fasilitas.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patient_reference:
                  type: string
                  maxLength: 64
                component:
                  type: string
                  enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
                blood_group:
                  type: string
                  enum: [A, B, AB, O]
                rh_factor:
                  type: string
                  enum: [positive, negative]
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 20
                urgency:
                  type: string
                  enum: [urgent, emergency]
                needed_by:
                  type: string
                  format: date-time
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
              required: [patient_reference, component, blood_group, rh_factor, quantity, urgency, needed_by]
      responses:
        '201':
          description: Permintaan dibuat; hasil pindaian disertakan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      request:
                        $ref: '#/components/schemas/BloodRequest'
                      nearby_stock_status:
                        type: string
                        enum: [scanned, no_requester_location, no_sourced_rule]
                        description: >-
                          `no_requester_location`: fasilitas peminta belum punya
                          koordinat. `no_sourced_rule`: komponen tanpa aturan
                          kompatibilitas bersumber (trombosit). Keduanya berarti
                          daftar kosong BUKAN "tidak ada stok".
                      nearby_stock:
                        type: array
                        items:
                          $ref: '#/components/schemas/NearbyStockEntry'
                    required: [request, nearby_stock_status, nearby_stock]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: >-
            Limiter `urgent-requests`: dua bucket per jam, per petugas dan per
            fasilitas (angka operasional di `config/security.php`). Amplop error
            standar dengan `error.code` `TOO_MANY_REQUESTS`.
          headers:
            Retry-After:
              description: Detik sampai boleh mencoba lagi.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /blood-requests/{bloodRequest}/cancel:
    parameters:
      - in: path
        name: bloodRequest
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID permintaan (`public_id`).
    post:
      summary: Batalkan satu permintaan darah
      description: >-
        Saga pembatalan dalam SATU transaksi: setiap alokasi aktif yang
        unitnya belum `issued` dilepas beserta reservasinya
        (`release_reason` = `request_cancelled`), unitnya kembali `released`
        -- atau `expired` bila kantongnya kedaluwarsa selama tertahan -- dan
        permintaan berpindah ke `cancelled`. Unit yang sudah `issued` tidak
        ditarik; alokasinya tetap aktif sebagai riwayat. Gagal di tengah
        berarti tidak ada yang berubah. Sekali jalan: permintaan yang sudah
        `cancelled`/`expired` ditolak 409 `BLOOD_REQUEST_NOT_ALLOCATABLE`.
        Butuh `request.create` atau `request.approve` di fasilitas peminta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 255
              required: [reason]
      responses:
        '200':
          description: Permintaan dibatalkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodRequest'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-requests/{bloodRequest}/donor-candidates:
    parameters:
      - in: path
        name: bloodRequest
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID permintaan (`public_id`).
    get:
      summary: Pratinjau kandidat donor pada satu anak tangga radius
      description: >-
        Donor di sekitar fasilitas peminta yang golongannya kompatibel
        (gerbang ABO/RhD, arah donor -> pasien), terurut murni menurut jarak
        -- tanpa skor. Donor yang tidak layak TETAP dikembalikan dengan
        `is_eligible` false dan kodenya; donor tanpa kanal (device token aktif
        atau email) dikembalikan dengan `is_reachable` false. Paling banyak
        `max_recipients_per_campaign` baris. TIDAK pernah memuat nama,
        telepon, email, alamat, atau golongan donor. Berbeda dari
        `/candidates` (kandidat UNIT). Tidak menulis apa pun. Butuh
        `request.approve` di fasilitas peminta.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: radius_meters
          required: true
          schema:
            type: integer
            enum: [5000, 15000, 30000]
          description: Salah satu anak tangga `matching.staged_radii_meters`; nilai lain 422.
      responses:
        '200':
          description: Kandidat donor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      blood_request_id:
                        type: string
                        format: uuid
                      radius_meters:
                        type: integer
                      candidates:
                        type: array
                        items:
                          $ref: '#/components/schemas/DonorCandidate'
                    required: [blood_request_id, radius_meters, candidates]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-requests/{bloodRequest}/campaign:
    parameters:
      - in: path
        name: bloodRequest
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID permintaan (`public_id`).
    post:
      summary: Mulai kampanye panggilan donor berjenjang
      description: >-
        Dimulai oleh MANUSIA; penjadwal hanya memajukan dan menutup. Tahap
        pertama (radius terkecil `matching.staged_radii_meters`) langsung
        dihubungi: hanya donor yang layak DAN bisa dihubungi yang dicatat.
        Paling banyak satu kampanye aktif per permintaan. Permintaan yang
        tidak `open`/`partially_fulfilled` ditolak 409 `CAMPAIGN_REJECTED`.
        Butuh `request.approve` di fasilitas peminta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
