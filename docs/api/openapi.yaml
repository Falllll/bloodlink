openapi: 3.0.3
info:
  title: BloodLink API
  version: 1.0.0
  description: |
    API headless untuk sistem manajemen bank darah BloodLink. Setiap respons
    error mengikuti amplop `Error` di bawah, dengan `error.code` sebagai
    satu-satunya nilai yang boleh dipakai klien untuk bercabang logika.
    `error.message` hanya untuk keperluan baca manusia (log, debugging) dan
    isinya bisa berubah kapan saja tanpa dianggap breaking change.
    Setiap endpoint daftar tersaring otomatis ke fasilitas pemegang token, dan
    akses lintas fasilitas dibalas `FORBIDDEN` 403 — kecuali endpoint master
    data `/facilities`, yang menampilkan seluruh fasilitas ke semua pengguna
    terautentikasi dan membatasi hanya operasi tulis lewat role `admin`.
servers:
  - url: http://localhost:8000/api/v1
    description: Local
  - url: http://localhost:8000
    description: Local (health check, di luar prefix /api/v1)
paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Endpoint di luar prefix /api/v1. Menandakan proses aplikasi hidup.
      servers:
        - url: http://localhost:8000
          description: Local (health check, di luar prefix /api/v1)
      responses:
        '200':
          description: Aplikasi hidup.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                required: [status]
  /health/ready:
    get:
      summary: Readiness probe
      description: >-
        Endpoint di luar prefix /api/v1. Memeriksa database, redis, dan
        heartbeat worker. Mengembalikan 503 saat salah satu pemeriksaan gagal
        (degraded), bukan hanya saat semuanya gagal.
      servers:
        - url: http://localhost:8000
          description: Local (health check, di luar prefix /api/v1)
      responses:
        '200':
          description: Semua pemeriksaan lolos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
        '503':
          description: Satu atau lebih pemeriksaan gagal (degraded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
  /auth/register:
    post:
      summary: Registrasi donor baru
      description: Membuat user baru dengan role `donor` dan langsung menerbitkan token akses.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
              required: [name, email, password, password_confirmation]
      responses:
        '200':
          description: Registrasi berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthToken'
                  meta:
                    type: object
                required: [data, meta]
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/login:
    post:
      summary: Login
      description: Menukar email dan password dengan token akses. Dibatasi 5 percobaan per menit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Login berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthToken'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      summary: Logout
      description: Mencabut hanya token yang dipakai request ini, bukan seluruh token milik user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Logout berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/forgot-password:
    post:
      summary: Minta tautan reset password
      description: >-
        Selalu 202 dengan badan yang sama, untuk email yang terdaftar maupun
        tidak -- dan dengan kerja yang sama, karena pencarian akun dan pengiriman
        email dikerjakan antrean, bukan request ini. Tautan dikirim lewat email
        saja, berlaku `PASSWORD_RESET_TTL_MINUTES` menit dan sekali pakai.
        Dibatasi per IP (limiter `auth`) dan per alamat email (3/jam bawaan);
        bucket per email tidak bergantung pada ada-tidaknya akun.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
              required: [email]
      responses:
        '202':
          description: Diterima. Tidak menyatakan apakah akun ada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/reset-password:
    post:
      summary: Atur password baru dengan token dari email
      description: >-
        Menukar token reset dengan password baru. Berhasil = SEMUA token akses
        akun ini dicabut dan seluruh device token push-nya dicabut; pengguna
        masuk lagi lewat login. Token tidak dikenal, kedaluwarsa, sudah dipakai,
        atau milik akun nonaktif dibalas jawaban yang sama:
        422 `PASSWORD_RESET_TOKEN_INVALID`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
              required: [token, password, password_confirmation]
      responses:
        '200':
          description: Password diganti; semua sesi dicabut.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '422':
          description: Validasi gagal, atau token tidak bisa dipakai (`PASSWORD_RESET_TOKEN_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/change-password:
    post:
      summary: Ganti password (pengguna yang sedang masuk)
      description: >-
        Wajib menyertakan password lama. Password baru harus berbeda dari yang
        lama. Sesi lain milik akun ini dicabut; sesi yang dipakai request ini
        tetap hidup.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
              required: [current_password, password, password_confirmation]
      responses:
        '200':
          description: Password diganti; sesi lain dicabut.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/donor:
    get:
      summary: Profil donor milik akun yang login
      description: >-
        Donor diselesaikan dari token, bukan dari parameter path. Akun yang
        belum tertaut ke baris donor aktif (termasuk baris yang sudah digabung
        lewat merge) dibalas 404 `DONOR_ACCOUNT_NOT_LINKED`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil donor milik akun ini.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DonorProfile'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/donor/donations:
    get:
      summary: Riwayat donasi milik akun yang login
      description: >-
        Hanya donasi milik donor yang tertaut ke token ini, terbaru lebih dulu
        (`completed_at` desc, lalu `id` desc sebagai tie-breaker). 20 baris per
        halaman. Akun yang belum tertaut dibalas 404 `DONOR_ACCOUNT_NOT_LINKED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Riwayat donasi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Donation'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/donor/eligibility:
    get:
      summary: Kelayakan donor milik akun yang login (berbasis riwayat)
      description: >-
        Yang ini memperhitungkan deferral aktif dan flag administratif dari
        database, sedangkan `POST /eligibility/self-check` tidak -- karena itu
        `is_provisional: false` di sini. Bentuk payload sama dengan self-check.
        Donor diselesaikan dari token; akun yang belum tertaut ke baris donor
        dibalas 404 `DONOR_ACCOUNT_NOT_LINKED`. Data kesehatan: jangan disimpan
        ke cache disk di klien.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Keputusan kelayakan donor ini.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DonorEligibility'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/donor/appointments:
    get:
      summary: Janji temu milik akun yang login
      description: >-
        Hanya janji temu milik donor yang tertaut ke token ini, termasuk walk-in
        yang dicatat petugas. Terbaru lebih dulu menurut waktu janji temu:
        `scheduled_for`, atau `arrived_at` untuk walk-in yang tidak punya
        `scheduled_for` (desc, lalu `id` desc sebagai tie-breaker). 20 baris per
        halaman. Akun yang belum tertaut dibalas 404 `DONOR_ACCOUNT_NOT_LINKED`,
        bukan daftar kosong.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Janji temu donor ini.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Donor memesan janji temunya sendiri
      description: >-
        Berbeda dari jalur petugas, `scheduled_for` WAJIB di sini dan harus di
        masa depan: walk-in (`arrived`) adalah pernyataan petugas, bukan donor.
        Fasilitas diambil dari pendaftaran donor (`registered_facility_id`),
        tidak bisa dipilih. Key di luar `scheduled_for` dan `note` ditolak 422
        `not_allowed`. Satu donor hanya boleh punya satu janji temu terbuka;
        pesanan kedua dibalas 409 `APPOINTMENT_TRANSITION_REJECTED` -- batalkan
        yang lama lebih dulu untuk menjadwal ulang. Akun yang belum tertaut
        dibalas 404 `DONOR_ACCOUNT_NOT_LINKED`. Bila fasilitas punya pola
        jadwal (lihat `/facilities/{facility}/appointment-slots`),
        `scheduled_for` harus tepat awal sebuah slot: bukan slot / tanggal
        tutup dibalas 422 `APPOINTMENT_SLOT_UNAVAILABLE`, slot penuh 409
        `APPOINTMENT_SLOT_UNAVAILABLE`. `scheduled_for` dibaca sebagai instan
        (offset dihormati) dan disimpan dalam UTC.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduled_for:
                  type: string
                  format: date-time
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
              required: [scheduled_for]
      responses:
        '201':
          description: Janji temu tercatat berstatus `booked`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Appointment'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/donor/appointments/{appointment}/status:
    patch:
      summary: Donor membatalkan janji temunya sendiri
      description: >-
        Satu-satunya status yang boleh dikirim donor adalah `cancelled`; status
        lain (`arrived`, `screened`, `completed`, `no_show`) adalah pernyataan
        petugas dan ditolak 422. Janji temu dicari di antara milik donor ini
        saja, jadi janji temu donor lain dibalas 404 -- bukan 403. Pembatalan
        tetap mengikuti graf transisi; dari status terminal ditolak 409.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: appointment
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID janji temu (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [cancelled]
              required: [status]
      responses:
        '200':
          description: Janji temu dibatalkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Appointment'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /audit-logs:
    get:
      summary: Daftar audit log
      description: >-
        Read-only. Pembaca tanpa fasilitas (operator global) melihat seluruh
        baris; pembaca ber-fasilitas hanya melihat baris dengan
        `actor_facility_id` miliknya sendiri. Hanya method `GET` yang ada
        untuk path ini.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - in: query
          name: occurred_from
          required: false
          schema:
            type: string
            format: date-time
          description: Batas bawah `occurred_at`, inklusif.
        - in: query
          name: occurred_to
          required: false
          schema:
            type: string
            format: date-time
          description: Batas atas `occurred_at`, inklusif. Harus >= `occurred_from`.
        - in: query
          name: filter[auditable_type]
          required: false
          schema:
            type: string
          description: Filter persamaan pada `auditable_type`.
        - in: query
          name: filter[auditable_id]
          required: false
          schema:
            type: integer
          description: Filter persamaan pada `auditable_id`.
        - in: query
          name: filter[action]
          required: false
          schema:
            type: string
            enum: [created, updated, deleted]
          description: Filter persamaan pada `action`.
        - in: query
          name: filter[actor_id]
          required: false
          schema:
            type: integer
          description: Filter persamaan pada `actor_id`.
        - in: query
          name: filter[actor_facility_id]
          required: false
          schema:
            type: integer
          description: Filter persamaan pada `actor_facility_id`.
        - in: query
          name: filter[trace_id]
          required: false
          schema:
            type: string
            format: uuid
          description: Filter persamaan pada `trace_id`.
      responses:
        '200':
          description: Daftar baris audit log yang boleh dilihat pemegang token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /reports/wastage:
    get:
      summary: Wastage rate periodik
      description: >-
        Dihitung dari riwayat transisi (`blood_batch_events`), bukan dari status
        unit saat ini. Pembilang = transisi ke `discarded` atau `expired`;
        penyebut = transisi `testing` -> `released`. Satu kantong bisa muncul di
        dua bucket (dirilis di satu periode, kedaluwarsa di periode lain) --
        disengaja untuk rasio periodik. Penyebut 0 menghasilkan `ratio: null`.
        Butuh izin `report.view`. Pembaca ber-fasilitas hanya menghitung
        fasilitasnya sendiri; operator global menghitung seluruh fasilitas.
        Tidak memuat ambang mutu apa pun: angka "baik" vs "buruk" adalah aturan
        medis dan belum ada di Rujukan Pedoman Medis.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportGranularity'
      responses:
        '200':
          description: Satu baris per bucket, berurutan, bucket kosong berisi nol.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WastageBucket'
                  meta:
                    $ref: '#/components/schemas/ReportMeta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /reports/stock-trend:
    get:
      summary: Arus transisi stok per periode
      description: >-
        Jumlah transisi KE tiap status per bucket, dari `blood_batch_events`.
        Ini arus, bukan level stok: transfer antarfasilitas memindah unit tanpa
        transisi status, sehingga level per fasilitas tidak bisa direkonstruksi
        jujur dari riwayat. Level stok saat ini ada di `GET /blood-batches`.
        Butuh izin `report.view`. Pembaca ber-fasilitas hanya menghitung
        fasilitasnya sendiri; operator global menghitung seluruh fasilitas.
        Tidak memuat ambang mutu apa pun: angka "baik" vs "buruk" adalah aturan
        medis dan belum ada di Rujukan Pedoman Medis.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportGranularity'
      responses:
        '200':
          description: Satu baris per bucket, berurutan, bucket kosong berisi nol.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockTrendBucket'
                  meta:
                    $ref: '#/components/schemas/ReportMeta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /reports/crossmatch-transfusion:
    get:
      summary: Rasio crossmatch-ke-transfusi (C:T)
      description: >-
        Pembilang = SEMUA crossmatch yang dikerjakan (`performed_at`), apa pun
        hasilnya; penyebut = transfusi yang dimulai (`started_at`). Scope
        fasilitas = fasilitas PEMINTA (`blood_requests.facility_id`), bukan
        pemilik kantong. Penyebut 0 menghasilkan `ratio: null`.
        Butuh izin `report.view`. Pembaca ber-fasilitas hanya menghitung
        fasilitasnya sendiri; operator global menghitung seluruh fasilitas.
        Tidak memuat ambang mutu apa pun: angka "baik" vs "buruk" adalah aturan
        medis dan belum ada di Rujukan Pedoman Medis.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportGranularity'
      responses:
        '200':
          description: Satu baris per bucket, berurutan, bucket kosong berisi nol.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CrossmatchTransfusionBucket'
                  meta:
                    $ref: '#/components/schemas/ReportMeta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/devices:
    post:
      summary: Daftarkan token push perangkat ini
      description: >-
        Token unik secara GLOBAL. Token yang sudah terdaftar milik pengguna
        lain DIPINDAHKAN ke pengguna yang sedang masuk (perangkat berpindah
        tangan); milik sendiri diperbarui `last_seen_at`-nya dan diaktifkan
        lagi bila pernah dicabut. Tidak pernah membuat baris kedua. Token
        tidak pernah dikembalikan di respons. Tidak menuntut fasilitas --
        donor pun bisa mendaftar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  maxLength: 512
                platform:
                  type: string
                  enum: [android, ios, web]
              required: [token, platform]
      responses:
        '201':
          description: Token terdaftar (baru, diperbarui, atau dipindahkan).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceToken'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/devices/{deviceToken}:
    parameters:
      - in: path
        name: deviceToken
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID token perangkat (`id` dari respons pendaftaran).
    delete:
      summary: Cabut token push perangkat ini
      description: >-
        Menulis `revoked_at`, tidak menghapus baris. Idempoten. Hanya token
        milik pengguna yang sedang masuk; token milik orang lain dibalas 404,
        sama dengan token yang tidak ada.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token dicabut.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceToken'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/notifications:
    get:
      summary: Riwayat notifikasi pengguna yang sedang masuk
      description: >-
        Satu item per KEJADIAN, bukan per kanal: email dan push dari kabar yang
        sama ada di `deliveries` satu item. Tanpa isi pesan -- klien merender
        teks dari katalog lokal menurut `template_code`. Tanpa kode maupun
        detail kegagalan. `outcome` membedakan "terlewat" (`delivered`: minimal
        satu kanal terkirim) dari "tidak pernah sampai" (`failed`). Terbaru
        dulu; paginasi kursor, default 25, maksimum 100.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sort
          schema:
            type: string
            enum: [dispatched_at, -dispatched_at]
            default: -dispatched_at
      responses:
        '200':
          description: Satu halaman riwayat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationHistoryItem'
                  links:
                    type: object
                  meta:
                    type: object
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/notification-preferences:
    get:
      summary: Preferensi notifikasi pengguna yang sedang masuk
      description: >-
        Per KATEGORI, bukan per template. Default ikut-serta (keputusan sadar:
        orang yang mendaftar di aplikasi donor darah sudah menyatakan niat).
        Hanya kategori yang boleh ditolak yang tampil; keamanan akun dan
        operasional fasilitas selalu dikirim. Tidak menuntut fasilitas.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preferensi semua kategori yang boleh ditolak.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationPreferences'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /me/notification-preferences/{category}:
    parameters:
      - in: path
        name: category
        required: true
        schema:
          type: string
          enum: [emergency_call, appointment_reminder, donation_status, general]
        description: Kategori lain (termasuk yang wajib) dibalas 404.
    patch:
      summary: Tolak atau kembali terima satu kategori
      description: >-
        Pesan kategori yang ditolak tetap tercatat sebagai pengiriman berstatus
        `suppressed`, tidak dikirim. Menolak `emergency_call` berarti KELUAR
        dari daftar panggilan donor darurat (kandidat menjadi
        `is_reachable: false`) dan wajib disertai
        `acknowledge_leaving_call_list: true`; tanpanya 422 dengan rule
        `accepted` -- tanda bagi klien untuk menampilkan konfirmasi. Menolak
        dua kali tidak memajukan `opted_out_at`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                acknowledge_leaving_call_list:
                  type: boolean
                  description: Wajib `true` saat `enabled` false untuk `emergency_call`.
              required: [enabled]
      responses:
        '200':
          description: Preferensi semua kategori sesudah perubahan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationPreferences'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/campaign-invitations:
    get:
      summary: Undangan kampanye milik donor yang sedang masuk
      description: 50 terbaru. Tanpa data pasien apa pun. Tidak menuntut fasilitas.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Undangan donor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignInvitation'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /me/campaign-invitations/{contact}/respond:
    parameters:
      - in: path
        name: contact
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID undangan.
    post:
      summary: Jawab satu undangan kampanye
      description: >-
        Sekali jawab: jawaban kedua 409. Undangan milik orang lain 404 (bukan
        403). Kampanye yang sudah berhenti 409. Menerima berarti bersedia
        datang -- TIDAK mengalokasikan atau membuat unit apa pun.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                response:
                  type: string
                  enum: [accepted, declined]
              required: [response]
      responses:
        '200':
          description: Jawaban tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CampaignInvitation'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /eligibility/self-check:
    post:
      summary: Cek kelayakan donor mandiri (anonim)
      description: >-
        Endpoint publik, tanpa token dan tanpa Idempotency-Key. Tidak
        menerima identitas (nik/phone ditolak) dan tidak menulis baris
        apa pun -- stateless. Deferral donor terdaftar tidak ikut
        dipertimbangkan (pemanggil anonim), jadi respons selalu memuat
        `is_provisional: true`. Dibatasi 20 permintaan per menit per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date_of_birth:
                  type: string
                  format: date
                sex:
                  type: string
                  enum: [male, female]
                weight_kg:
                  type: number
                  format: double
                  minimum: 20
                  maximum: 300
                  nullable: true
                last_donation_date:
                  type: string
                  format: date
                  nullable: true
                planned_volume_ml:
                  type: integer
                  enum: [350, 450]
                  nullable: true
              required: [date_of_birth, sex]
      responses:
        '200':
          description: Hasil pemeriksaan kelayakan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EligibilitySelfCheck'
                  meta:
                    type: object
                required: [data, meta]
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users:
    get:
      summary: Daftar akun staf
      description: >-
        Akun staf = akun yang terikat satu fasilitas. Akun donor dan operator
        global tidak pernah muncul di sini. Operator global melihat staf semua
        fasilitas; admin fasilitas hanya stafnya sendiri. Butuh `user.manage`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Daftar akun staf.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffAccount'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Buat akun staf
      description: >-
        Tanpa password sama sekali -- tidak diterima di body, tidak pernah
        dikembalikan, tidak pernah dikirim. Pemilik akun menerima undangan email
        berisi tautan sekali pakai untuk menetapkan passwordnya sendiri (token
        yang sama dengan reset password, ditukar lewat `POST /auth/reset-password`).
        Peran hanya `hospital_staff` atau `admin`, ditulis di fasilitas tujuan.
        Admin fasilitas hanya boleh membuat akun di fasilitasnya sendiri.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/StaffAssignment'
                - type: object
                  properties:
                    name:
                      type: string
                      maxLength: 255
                    email:
                      type: string
                      format: email
                      maxLength: 255
                  required: [name, email]
      responses:
        '201':
          description: Akun dibuat dan undangan diantrekan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StaffAccount'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /users/{user}:
    parameters:
      - $ref: '#/components/parameters/StaffUser'
    get:
      summary: Detail akun staf
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Akun staf.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StaffAccount'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{user}/assignment:
    parameters:
      - $ref: '#/components/parameters/StaffUser'
    put:
      summary: Atur peran dan fasilitas akun staf
      description: >-
        Satu peran per akun, di fasilitas akun itu. Pindah fasilitas membersihkan
        peran di fasilitas lama. Setiap perubahan mencabut SEMUA token akses akun
        itu dan dicatat di audit log sebagai `role_assigned`; permintaan yang tidak
        mengubah apa pun tidak mencabut apa pun. Admin fasilitas tidak bisa
        memindahkan staf keluar dari fasilitasnya. Tidak ada yang boleh mengubah
        akunnya sendiri (403).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAssignment'
      responses:
        '200':
          description: Penugasan diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StaffAccount'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /users/{user}/deactivate:
    parameters:
      - $ref: '#/components/parameters/StaffUser'
    patch:
      summary: Nonaktifkan akun staf
      description: >-
        Menonaktifkan, tidak menghapus: akunnya tetap tertelusur lewat
        `audit_logs.actor_id`. Semua token akses dan device token push akun itu
        dicabut. Tidak ada yang boleh menonaktifkan akunnya sendiri (403).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Akun dinonaktifkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StaffAccount'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{user}/activate:
    parameters:
      - $ref: '#/components/parameters/StaffUser'
    post:
      summary: Aktifkan kembali akun staf
      description: Tanpa sesi apa pun; pemiliknya masuk lewat login seperti biasa.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Akun aktif kembali.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StaffAccount'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /facilities:
    get:
      summary: Daftar fasilitas
      description: >-
        Master data seluruh fasilitas, tidak tersaring ke fasilitas pemegang token.
        Setiap baris memuat latitude/longitude (null bila fasilitas belum punya lokasi),
        diambil dengan satu query untuk seluruh halaman.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Daftar fasilitas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FacilityWithCoordinates'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      summary: Daftarkan fasilitas baru
      description: Hanya role `admin`. `code` di-uppercase otomatis dan wajib unik.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityWrite'
      responses:
        '201':
          description: Fasilitas dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Facility'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /facilities/{facility}:
    get:
      summary: Detail fasilitas
      description: >-
        Admin bisa melihat fasilitas mana pun; peran lain hanya fasilitas
        aktif atau fasilitas miliknya sendiri.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: Detail fasilitas berikut koordinat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FacilityWithCoordinates'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Perbarui fasilitas
      description: Hanya role `admin`. Semua field opsional; hanya yang dikirim yang diperbarui.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityWrite'
      responses:
        '200':
          description: Fasilitas diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Facility'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /facilities/{facility}/verify:
    parameters:
      - in: path
        name: facility
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID fasilitas.
    post:
      summary: Verifikasi fasilitas
      description: >-
        "Boleh ikut sistem" -- terpisah dari `is_active` ("sedang beroperasi").
        Hanya operator global (admin tanpa fasilitas) dengan `facility.manage`;
        admin yang terikat satu fasilitas ditolak 403. Sekali jalan: verifikasi
        ulang dibalas 409. `verified_at` dan verifikatornya diisi server.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        '200':
          description: Fasilitas terverifikasi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Facility'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /facilities/{facility}/activate:
    parameters:
      - in: path
        name: facility
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID fasilitas.
    post:
      summary: Aktifkan kembali fasilitas
      description: >-
        Pasangan `deactivate`: menyetel `is_active` = true. Tidak menyentuh
        verifikasi. Aturan izinnya sama dengan menonaktifkan.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Fasilitas aktif kembali.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Facility'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /facilities/{facility}/appointment-schedule:
    parameters:
      - $ref: '#/components/parameters/FacilityId'
    get:
      summary: Pola jadwal appointment fasilitas
      description: >-
        Pola MINGGUAN dalam jam dinding lokal `timezone` fasilitas, plus tanggal
        tutup yang akan datang. Slot konkret dihitung dari pola ini, tidak
        disimpan per hari.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pola jadwal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentSchedule'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Ganti seluruh pola jadwal appointment fasilitas
      description: >-
        Mengganti pola secara atomik. Jam adalah jam dinding LOKAL di `timezone`
        (WIB/WITA/WIT). Jendela pada hari yang sama tidak boleh tumpang-tindih
        (dijaga EXCLUDE di database) dan panjangnya harus kelipatan durasi slot.
        Appointment yang sudah ada tidak pernah divalidasi ulang -- pola hanya
        berlaku untuk pemesanan baru. Daftar kosong = fasilitas kembali tanpa
        pembatasan kapasitas. Butuh izin ubah fasilitas (admin fasilitas itu atau
        operator global).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  type: string
                  enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
                windows:
                  type: array
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AppointmentScheduleWindow'
              required: [timezone, windows]
      responses:
        '200':
          description: Pola tersimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentSchedule'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
