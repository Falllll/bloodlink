      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Transfer berpindah status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StockTransfer'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /stock-transfers/{stockTransfer}/cancel:
    parameters:
      - in: path
        name: stockTransfer
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID transfer (`public_id`). Transfer yang tidak menyentuh fasilitas pemegang token dibalas 404.
    post:
      summary: Batalkan transfer yang belum dikirim
      description: >-
        Fasilitas asal maupun tujuan, dengan `inventory.create`. Hanya dari
        `requested` atau `approved`; transfer yang sudah `shipped` tidak bisa
        dibatalkan (409).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Transfer berpindah status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StockTransfer'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /blood-requests:
    get:
      summary: Daftar permintaan darah
      description: >-
        Tersaring otomatis ke fasilitas pemegang token; operator global
        melihat seluruhnya. Butuh `request.view`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [needed_by, -needed_by, created_at, -created_at]
        - in: query
          name: filter[status]
          required: false
          schema:
            type: string
            enum: [open, partially_fulfilled, fulfilled, cancelled, expired]
        - in: query
          name: filter[urgency]
          required: false
          schema:
            type: string
            enum: [routine, urgent, emergency]
        - in: query
          name: filter[blood_group]
          required: false
          schema:
            type: string
            enum: [A, B, AB, O]
        - in: query
          name: filter[component]
          required: false
          schema:
            type: string
            enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
      responses:
        '200':
          description: Daftar permintaan darah.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BloodRequest'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      summary: Ajukan permintaan darah
      description: >-
        Mencatat apa yang diminta rumah sakit; selalu lahir berstatus `open`
        dan selalu milik fasilitas pemegang token -- `facility_id` maupun
        `status` di body ditolak 422 `not_allowed`. Operator global tanpa
        fasilitas ditolak 403. Permintaan TIDAK diperiksa kompatibilitas
        maupun ketersediaan stoknya: kombinasi yang mustahil dipenuhi tetap
        tercatat. `needed_by` wajib dan harus di masa depan. Batas `quantity`
        1..20 adalah kewarasan instrumen, bukan aturan medis.
        `patient_reference` adalah rujukan internal rumah sakit, bukan
        identitas pasien. Butuh `request.create`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patient_reference:
                  type: string
                  maxLength: 64
                component:
                  type: string
                  enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
                blood_group:
                  type: string
                  enum: [A, B, AB, O]
                rh_factor:
                  type: string
                  enum: [positive, negative]
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 20
                urgency:
                  type: string
                  enum: [routine, urgent, emergency]
                needed_by:
                  type: string
                  format: date-time
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
              required: [patient_reference, component, blood_group, rh_factor, quantity, urgency, needed_by]
      responses:
        '201':
          description: Permintaan tercatat berstatus `open`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodRequest'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-requests/{bloodRequest}/cancel:
    parameters:
      - in: path
        name: bloodRequest
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID permintaan (`public_id`).
    post:
      summary: Batalkan satu permintaan darah
      description: >-
        Saga pembatalan dalam SATU transaksi: setiap alokasi aktif yang
        unitnya belum `issued` dilepas beserta reservasinya
        (`release_reason` = `request_cancelled`), unitnya kembali `released`
        -- atau `expired` bila kantongnya kedaluwarsa selama tertahan -- dan
        permintaan berpindah ke `cancelled`. Unit yang sudah `issued` tidak
        ditarik; alokasinya tetap aktif sebagai riwayat. Gagal di tengah
        berarti tidak ada yang berubah. Sekali jalan: permintaan yang sudah
        `cancelled`/`expired` ditolak 409 `BLOOD_REQUEST_NOT_ALLOCATABLE`.
        Butuh `request.create` atau `request.approve` di fasilitas peminta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 255
              required: [reason]
      responses:
        '200':
          description: Permintaan dibatalkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodRequest'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-requests/{bloodRequest}/candidates:
    parameters:
      - in: path
        name: bloodRequest
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID permintaan (`public_id`).
    get:
      summary: Kandidat unit FEFO untuk satu permintaan
      description: >-
        Unit `released` di fasilitas peminta, berkomponen sama, yang lolos
        gerbang kompatibilitas ABO/RhD, terurut kedaluwarsa paling dekat lebih
        dulu (lalu `id`). Dikecualikan: unit tanpa `expires_at` (masa simpan
        belum ditentukan), unit yang kedaluwarsa sebelum `needed_by`, unit yang
        sudah punya alokasi aktif, dan unit yang punya transfer antar fasilitas
        terbuka. Permintaan trombosit selalu nol kandidat (gerbang
        `unsupported`). Paling banyak sebanyak sisa kuantitas. Tidak menulis
        apa pun. Butuh `inventory.release` di fasilitas peminta.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Kandidat terurut FEFO.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      blood_request_id:
                        type: string
                        format: uuid
                      remaining:
                        type: integer
                      candidates:
                        type: array
                        items:
                          type: object
                          properties:
                            unit_id:
                              type: string
                              format: uuid
                            blood_group:
                              type: string
                              enum: [A, B, AB, O]
                            rh_factor:
                              type: string
                              enum: [positive, negative]
                            expires_at:
                              type: string
                              format: date-time
                    required: [blood_request_id, remaining, candidates]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /blood-requests/{bloodRequest}/allocations:
    parameters:
      - in: path
        name: bloodRequest
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID permintaan (`public_id`).
    post:
      summary: Alokasikan unit FEFO ke permintaan
      description: >-
        Mengalokasikan kandidat FEFO (lihat `.../candidates`) sebanyak sisa
        kuantitas, atau paling banyak `max`. Permintaan yang sudah penuh
        menghasilkan nol alokasi, bukan error. Status permintaan naik ke
        `partially_fulfilled`/`fulfilled`. Status UNIT tidak berubah -- tetap
        `released`. Satu unit hanya bisa punya satu alokasi aktif (partial
        unique index); unit yang direbut alokasi lain di tengah jalan
        dilewati. Permintaan `cancelled`/`expired` ditolak 409
        `BLOOD_REQUEST_NOT_ALLOCATABLE`. Butuh `inventory.release`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                max:
                  type: integer
                  minimum: 1
                  maximum: 20
                  nullable: true
      responses:
        '201':
          description: Alokasi yang dibuat (bisa kosong).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      blood_request:
                        $ref: '#/components/schemas/BloodRequest'
                      allocations:
                        type: array
                        items:
                          $ref: '#/components/schemas/BloodRequestAllocation'
                    required: [blood_request, allocations]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /allocations/{allocation}:
    parameters:
      - in: path
        name: allocation
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID alokasi (`public_id`).
    delete:
      summary: Lepaskan satu alokasi
      description: >-
        Membebaskan unit untuk dialokasikan lagi dan menurunkan status
        permintaan kembali (`fulfilled` -> `partially_fulfilled` -> `open`).
        Reservasi yang masih menempel dilepas lebih dulu, dalam transaksi yang
        sama, sehingga unitnya kembali `released`.
        Idempoten: alokasi yang sudah dilepas dikembalikan apa adanya, alasan
        pertama dipertahankan. DELETE tidak memakai `Idempotency-Key`.
        Butuh `inventory.release` di fasilitas peminta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 255
              required: [reason]
      responses:
        '200':
          description: Alokasi dilepas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodRequestAllocation'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-requests/{bloodRequest}/reservations:
    parameters:
      - in: path
        name: bloodRequest
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID permintaan (`public_id`).
    post:
      summary: Pesan unit yang sudah dialokasikan
      description: >-
        Setiap alokasi aktif yang belum dipesan: unitnya pindah `released` ->
        `reserved` dan alokasinya mendapat `reserved_at` serta
        `reservation_expires_at`, dalam SATU transaksi -- satu unit gagal,
        semuanya batal. Baris unit dikunci (`SELECT ... FOR UPDATE`) dalam
        urutan id yang stabil. Unit yang sudah dipesan ditolak oleh graf
        status (409 `BLOOD_BATCH_TRANSITION_REJECTED`); permintaan tanpa
        alokasi yang bisa dipesan juga 409. Jendela default 48 jam adalah
        pilihan operasional, bukan angka medis; `window_hours` maksimal 168
        (kewarasan instrumen). Reservasi yang lewat batas dilepas otomatis tiap
        jam. Butuh `inventory.release`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                window_hours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  nullable: true
      responses:
        '201':
          description: Alokasi yang baru dipesan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BloodRequestAllocation'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /allocations/{allocation}/reservation:
    parameters:
      - in: path
        name: allocation
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID alokasi (`public_id`).
    delete:
      summary: Lepas reservasi satu alokasi
      description: >-
        Unit `reserved` kembali `released`; alokasinya TETAP hidup (gunakan
        `DELETE /allocations/{allocation}` untuk melepas alokasinya, yang juga
        melepas reservasinya lebih dulu). Unit yang sudah keluar stok
        (`issued`, `discarded`, `expired`) tidak dipaksa kembali -- hanya kolom
        reservasinya yang dikosongkan. Idempoten. DELETE tidak memakai
        `Idempotency-Key`. Butuh `inventory.release`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 255
              required: [reason]
      responses:
        '200':
          description: Reservasi dilepas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodRequestAllocation'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /allocations/{allocation}/crossmatches:
    parameters:
      - in: path
        name: allocation
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID alokasi (`public_id`).
    post:
      summary: Catat satu hasil crossmatch
      description: >-
        Append-only: crossmatch ulang MENAMBAH baris, tidak menimpa; yang
        berlaku untuk penerbitan adalah hasil terbaru. Pencatatan tidak
        mengubah status unit maupun alokasi apa pun, KECUALI hasil
        `incompatible`: alokasinya langsung dilepas
        (`release_reason` = `crossmatch_incompatible`), unitnya kembali ke
        stok, dan status permintaan diturunkan -- dalam transaksi yang sama.
        `inconclusive` tidak melepas apa pun. `method` hanya jejak audit
        (teks bebas), tidak pernah dipakai memutuskan. Hasil `incompatible` dan
        `inconclusive` wajib membawa `note`. Alokasi yang sudah dilepas ditolak
        409 `CROSSMATCH_REJECTED`. Butuh `inventory.release` di fasilitas
        peminta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result:
                  type: string
                  enum: [compatible, incompatible, inconclusive]
                method:
                  type: string
                  maxLength: 120
                  nullable: true
                note:
                  type: string
                  maxLength: 2000
                  nullable: true
                  description: Wajib bila `result` bukan `compatible`.
              required: [result]
      responses:
        '201':
          description: Hasil crossmatch tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Crossmatch'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /allocations/{allocation}/issue:
    parameters:
      - in: path
        name: allocation
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID alokasi (`public_id`).
    post:
      summary: Terbitkan unit yang lolos crossmatch
      description: >-
        SATU-SATUNYA jalur ke status `issued`; perpindahan status biasa
        (`PATCH /blood-batches/{id}/status`) menolak `issued`. Syaratnya:
        alokasi masih aktif, unit berstatus `reserved`, dan crossmatch TERBARU
        bernilai `compatible` -- hasil compatible lama yang disusul hasil lain
        tidak berlaku. Penolakan dibalas 409 `CROSSMATCH_REJECTED`; unit tetap
        `reserved` dan alokasinya tetap aktif. Reservasinya dikosongkan saat
        terbit supaya timeout reservasi tidak menyentuhnya. Butuh
        `inventory.release` di fasilitas peminta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Unit diterbitkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      allocation:
                        $ref: '#/components/schemas/BloodRequestAllocation'
                      unit_status:
                        type: string
                        enum: [issued]
                      crossmatches:
                        type: array
                        items:
                          $ref: '#/components/schemas/Crossmatch'
                    required: [allocation, unit_status, crossmatches]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /allocations/{allocation}/transfusion:
    parameters:
      - in: path
        name: allocation
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID alokasi (`public_id`).
    post:
      summary: Catat transfusi satu unit yang sudah diterbitkan
      description: >-
        Hemovigilans: mencatat bahwa kantong benar-benar masuk ke pasien.
        Hanya unit berstatus `issued`; selain itu 409 `TRANSFUSION_REJECTED`.
        Satu alokasi, satu transfusi -- pencatatan kedua juga 409. Status unit
        TIDAK berubah (`issued` terminal). `completed_at` null berarti
        transfusi masih berjalan, dan volume hanya boleh diisi bila sudah
        selesai. Butuh `inventory.release` di fasilitas peminta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                started_at:
                  type: string
                  format: date-time
                completed_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Tidak boleh sebelum `started_at` (juga CHECK di database).
                volume_transfused_ml:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: Hanya bersama `completed_at`.
                note:
                  type: string
                  maxLength: 2000
                  nullable: true
              required: [started_at]
      responses:
        '201':
          description: Transfusi tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Transfusion'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /transfusions/{transfusion}:
    parameters:
      - in: path
        name: transfusion
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID transfusi (`public_id`).
    get:
      summary: Satu transfusi beserta laporan reaksinya
      description: >-
        Reaksi diurutkan menurut `observed_at` (waktu kejadian), bukan waktu
        laporan. Butuh `inventory.release` di fasilitas peminta.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transfusi dan reaksinya.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Transfusion'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /transfusions/{transfusion}/reactions:
    parameters:
      - in: path
        name: transfusion
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID transfusi (`public_id`).
    post:
      summary: Laporkan reaksi pasca-transfusi
      description: >-
        Pengamatan, bukan tindakan: tidak ada status unit maupun permintaan
        yang berubah. Satu transfusi boleh punya banyak laporan (segera dan
        tertunda). Tidak ada derajat keparahan dan tidak ada identitas pasien
        -- disengaja. `reaction_type_code` opsional dan hanya menerima jenis
        terkutip dari master data; tanpanya laporan tetap sah sebagai
        naratif. Memancarkan event domain `TransfusionReactionReported`.
        Butuh `inventory.release` di fasilitas peminta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                observed_at:
                  type: string
                  format: date-time
                  description: Kapan reaksi terjadi, bukan kapan dilaporkan. Tidak boleh di masa depan.
                reaction_type_code:
                  type: string
                  nullable: true
                description:
                  type: string
                  maxLength: 5000
              required: [observed_at, description]
      responses:
        '201':
          description: Reaksi tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TransfusionReaction'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /compatibility:
    get:
      summary: Donor yang lolos gerbang kompatibilitas ABO/RhD untuk satu penerima
      description: >-
        Pemeriksaan DATA, bukan crossmatch laboratorium. Aturannya data
        ter-seed ber-provenans (WHO Module 3 §6.3 Figure 14 & 15; Rujukan
        Pedoman Medis §12). Sel darah merah (`whole_blood`,
        `packed_red_cells`) memeriksa ABO dan RhD; plasma
        (`fresh_frozen_plasma`, `cryoprecipitate`) memeriksa ABO arah
        KEBALIKAN dan tidak memeriksa RhD (`donor_rh` null). Trombosit dibalas
        `unsupported`: WHO tidak memberi matriksnya. Pasangan tanpa aturan
        berarti tidak boleh. `provenance` `derived` menandai keputusan yang
        bergantung pada aturan tanpa kutipan WHO (penerima RhD-positif dengan
        donor RhD-negatif). Butuh `request.view`.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: component
          required: true
          schema:
            type: string
            enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
        - in: query
          name: recipient_group
          required: true
          schema:
            type: string
            enum: [A, B, AB, O]
        - in: query
          name: recipient_rh
          required: true
          schema:
            type: string
            enum: [positive, negative]
      responses:
        '200':
          description: Daftar donor yang boleh, atau `unsupported`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      component:
                        type: string
                      direction:
                        type: string
                        enum: [red_cells, plasma]
                        description: Tidak ada saat `unsupported`.
                      outcome:
                        type: string
                        enum: [compatible, incompatible, unsupported]
                      detail:
                        type: string
                        description: Hanya saat `unsupported`.
                      compatible_donors:
                        type: array
                        items:
                          type: object
                          properties:
                            donor_group:
                              type: string
                              enum: [A, B, AB, O]
                            donor_rh:
                              type: string
                              enum: [positive, negative]
                              nullable: true
                              description: Null untuk plasma -- RhD tidak diperiksa.
                            provenance:
                              type: string
                              enum: [cited, derived]
                            source_references:
                              type: array
                              items:
                                type: string
                          required: [donor_group, donor_rh, provenance, source_references]
                    required: [component, outcome, compatible_donors]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /donors:
    get:
      summary: Daftar donor (staf)
      description: >-
        Butuh izin `donor.view` (peran donor ditolak 403). Tersaring otomatis
        ke fasilitas registrasi donor pemegang token; operator global melihat
        seluruhnya. Baris nisan hasil merge tidak ikut. Baris berbentuk ringkas
        (`DonorListItem`) tanpa kontak maupun data kesehatan. `search` mencari
        nama yang mirip lewat pg_trgm dengan ambang yang sama dengan deduplikasi
        identitas. `deferral_status` dihitung dari deferral yang belum dicabut
        dan belum berakhir; permanen mengalahkan temporer.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - in: query
          name: search
          required: false
          schema:
            type: string
            maxLength: 255
          description: Nama donor (pencocokan kemiripan, bukan awalan).
        - in: query
          name: filter[blood_group]
          required: false
          schema:
            type: string
            enum: [A, B, AB, O]
        - in: query
          name: filter[rh_factor]
          required: false
          schema:
            type: string
            enum: [positive, negative]
        - in: query
          name: filter[sex]
          required: false
          schema:
            type: string
            enum: [male, female]
        - in: query
          name: filter[city]
          required: false
          schema:
            type: string
        - in: query
          name: filter[deferral_status]
          required: false
          schema:
            type: string
            enum: [none, temporary, permanent]
      responses:
        '200':
          description: Daftar donor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DonorListItem'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /deferral-reasons:
    get:
      summary: Master data alasan deferral yang aktif
      description: Read-only, tanpa paginasi. Dipakai form penempatan deferral.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Alasan deferral yang aktif.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeferralReason'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /donors/{donor}/deferrals:
    get:
      summary: Riwayat deferral seorang donor
      description: >-
        Butuh izin `donor.view` dan fasilitas yang sama dengan donor. Memuat
        deferral yang sudah dicabut atau berakhir; `filter[active]` menyaring
        ke yang masih menahan (`true`) atau yang tidak lagi (`false`).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: donor
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID donor (`public_id`).
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - in: query
          name: filter[active]
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Riwayat deferral.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deferral'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      summary: Tempatkan deferral (tindakan petugas)
      description: >-
        Butuh izin `donor.update` dan fasilitas yang sama dengan donor. Jenis,
        durasi, dan `ends_at` diturunkan dari alasan (master data), tidak
        dikirim klien; sumbernya tercatat `manual`. Kode alasan yang tidak ada
        ditolak 422; kode yang dinonaktifkan ditolak 409
        `DONOR_DEFERRAL_CONFLICT`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: donor
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID donor (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code:
                  type: string
                anchor_at:
                  type: string
                  format: date-time
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
              required: [reason_code, anchor_at]
      responses:
        '201':
          description: Deferral tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Deferral'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /deferrals/{deferral}/lift:
    patch:
      summary: Cabut deferral
      description: >-
        Butuh izin `donor.update` dan fasilitas yang sama dengan donor.
        Deferral permanen tidak bisa dicabut (409
        `DONOR_PERMANENT_DEFERRAL_NOT_LIFTABLE`); deferral yang sudah dicabut
        ditolak 409 `DONOR_DEFERRAL_ALREADY_LIFTED`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: deferral
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID deferral (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
              required: [reason]
      responses:
        '200':
          description: Deferral dicabut.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Deferral'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Token Sanctum, dikirim lewat header `Authorization: Bearer <token>`.'
  parameters:
    Cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: Cursor buram dari `meta.next_cursor` atau `meta.prev_cursor` halaman sebelumnya.
    PerPage:
      in: query
      name: per_page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Jumlah item per halaman. Nilai di luar rentang di-clamp, bukan ditolak.
    Sort:
      in: query
      name: sort
      required: false
      schema:
        type: string
      description: >-
        Nama kolom untuk mengurutkan hasil. Awali dengan `-` untuk urutan
        descending, mis. `-created_at`. Hanya kolom di allowlist endpoint yang
        diterima; kolom lain menghasilkan `VALIDATION_FAILED`.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        format: uuid
      description: >-
        Wajib untuk setiap POST/PUT/PATCH. Request dengan key yang sama dan
        body yang sama akan me-replay respons pertama; key yang sama dengan
        body berbeda ditolak dengan `IDEMPOTENCY_KEY_REUSED`.
    FacilityId:
      in: path
      name: facility
      required: true
      schema:
        type: string
        format: uuid
      description: 'Public ID fasilitas (`public_id`). ID numerik internal tidak pernah keluar ke API.'
    RequestId:
      in: header
      name: X-Request-Id
      required: false
      schema:
        type: string
        maxLength: 64
      description: >-
        ID korelasi request pilihan klien. Kalau tidak dikirim, server
        membuatnya sendiri dan mengembalikannya di header respons serta di
        `error.trace_id`.
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - INTERNAL_ERROR
        - METHOD_NOT_ALLOWED
        - TOO_MANY_REQUESTS
        - HTTP_ERROR
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - REQUEST_IN_PROGRESS
        - DONOR_DUPLICATE_NIK
        - DONOR_DUPLICATE_PHONE
        - DONOR_MERGE_CONFLICT
        - DONOR_DEFERRAL_CONFLICT
        - DONOR_DEFERRAL_ALREADY_LIFTED
        - DONOR_ACCOUNT_NOT_LINKED
        - DONOR_PERMANENT_DEFERRAL_NOT_LIFTABLE
        - APPOINTMENT_TRANSITION_REJECTED
        - BLOOD_BATCH_TRANSITION_REJECTED
        - BATCH_EXPIRY_UNDETERMINABLE
        - UNIT_NUMBER_ALLOCATION_FAILED
        - INVENTORY_SEPARATION_REJECTED
        - LAB_TEST_NOT_IN_PANEL
        - LAB_RESULT_DUPLICATE
        - LAB_RESULT_REJECTED
        - INVENTORY_RELEASE_REJECTED
        - BLOOD_REQUEST_NOT_ALLOCATABLE
        - CROSSMATCH_REJECTED
        - TRANSFUSION_REJECTED
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: object
              description: >
                Per field, daftar aturan yang gagal. Kosong ({}) untuk error non-validasi.
                Klien memetakan `rule` + `params` ke kalimat lokalnya sendiri; backend
                tidak pernah mengirim kalimat siap tampil.
              additionalProperties:
                type: array
                items:
                  type: object
                  required: [rule, params]
                  properties:
                    rule:
                      type: string
                      description: Nama aturan Laravel dalam snake_case, atau kunci khusus aplikasi (not_allowed, invalid_sort, unsupported_filter).
                      example: min
                    params:
                      description: >
                        Objek bernama untuk aturan yang dipetakan, larik posisional untuk sisanya.
                        Nilai leaf selalu string; `values` (in, not_in, mimes) dan `keys` (unsupported_filter) berupa list string.
                      example: { min: "8" }
            trace_id:
              type: string
              format: uuid
          required: [code, message, details, trace_id]
      required: [error]
    PaginationMeta:
      type: object
      properties:
        per_page:
          type: integer
        next_cursor:
          type: string
          nullable: true
        prev_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
      required: [per_page, next_cursor, prev_cursor, has_more]
    PaginationLinks:
      type: object
      properties:
        next:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
      required: [next, prev]
    AuthToken:
      type: object
      properties:
        token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
            role:
              type: string
          required: [id, name, email, role]
      required: [token, token_type, user]
    Facility:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [hospital, blood_bank, donation_unit, mobile_unit]
        address:
          type: string
        city:
          type: string
        province:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        is_active:
          type: boolean
      required: [id, code, name, type, address, city, province, phone, email, is_active]
    FacilityWithCoordinates:
      allOf:
        - $ref: '#/components/schemas/Facility'
        - type: object
          properties:
            latitude:
              type: number
              format: double
              nullable: true
            longitude:
              type: number
              format: double
              nullable: true
    FacilityWrite:
      type: object
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9-]{3,32}$'
          description: Otomatis di-uppercase sebelum divalidasi.
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [hospital, blood_bank, donation_unit, mobile_unit]
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        province:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Wajib untuk tipe `hospital` dan `blood_bank`.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Wajib untuk tipe `hospital` dan `blood_bank`.
      required: [code, name, type, address, city, province, phone]
    AuditLogEntry:
      type: object
      description: >-
        `changes` sudah ter-redaksi saat ditulis ([REDACTED] untuk kunci
        sensitif); kolom terenkripsi (mis. phone/email/address donor) tidak
        pernah muncul di sini sama sekali. Pembaca non-global hanya menerima
        barisnya sendiri (`actor_facility_id` miliknya).
      properties:
        id:
          type: string
          description: ID numerik internal, diekspos sebagai string opaque (audit_logs tidak punya public_id).
        auditable_type:
          type: string
        auditable_id:
          type: integer
        action:
          type: string
          enum: [created, updated, deleted]
        actor_id:
          type: integer
          nullable: true
        actor_facility_id:
          type: integer
          nullable: true
        changes:
          type: object
          properties:
            before:
              type: object
            after:
              type: object
        trace_id:
          type: string
          format: uuid
          nullable: true
        ip:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
      required: [id, auditable_type, auditable_id, action, actor_id, actor_facility_id, changes, trace_id, ip, occurred_at]
    DonorProfile:
      type: object
      description: >-
        `id` numerik internal, `nik`, `nik_hash`, dan `phone_hash` tidak
        pernah keluar ke API. NIK yang sudah terisi dilaporkan lewat
        `has_nik`, bukan nilainya sendiri.
      properties:
        id:
          type: string
          format: uuid
          description: Public ID donor (`public_id`).
        donor_number:
          type: string
        full_name:
          type: string
        date_of_birth:
          type: string
          format: date
        sex:
          type: string
          enum: [male, female]
        blood_group:
          type: string
          enum: [A, B, AB, O]
          nullable: true
        rh_factor:
          type: string
          enum: [positive, negative]
          nullable: true
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        address:
          type: string
        city:
          type: string
        weight_kg:
          type: number
          format: double
          nullable: true
        last_donation_date:
          type: string
          format: date
          nullable: true
        donation_count:
          type: integer
        has_nik:
          type: boolean
      required:
        - id
        - donor_number
        - full_name
        - date_of_birth
        - sex
        - blood_group
        - rh_factor
        - phone
        - email
        - address
        - city
        - weight_kg
        - last_donation_date
        - donation_count
        - has_nik
    EligibilitySelfCheck:
      type: object
      description: >-
        `outcome` bertiga-nilai, jangan diperas jadi boolean.
        `is_provisional` selalu true karena pemanggil anonim tidak punya
        deferral tersimpan untuk dipertimbangkan.
      properties:
        outcome:
          type: string
          enum: [eligible, not_eligible, undetermined]
        is_provisional:
          type: boolean
          enum: [true]
        retry_after_date:
          type: string
          format: date
          nullable: true
        findings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                  - AGE_BELOW_MINIMUM
                  - AGE_ABOVE_MAXIMUM
                  - DONATION_INTERVAL_NOT_MET
                  - BODY_WEIGHT_BELOW_MINIMUM
                  - ACTIVE_DEFERRAL
                  - DATA_MISSING
              outcome:
                type: string
                enum: [eligible, not_eligible, undetermined]
              retry_after_date:
                type: string
                format: date
                nullable: true
              detail:
                type: string
                nullable: true
            required: [code, outcome, retry_after_date, detail]
      required: [outcome, is_provisional, retry_after_date, findings]
    DonorScreening:
      type: object
      description: >-
        `id` numerik internal tidak pernah keluar ke API. `haemoglobin_g_dl`
        dan `temperature_c` selalu desimal (mis. 12.5, 37.6) -- penyimpanan
        internalnya integer dalam sepersepuluh satuan, tapi itu detail
        implementasi yang tidak pernah bocor ke kontrak ini.
      properties:
        id:
          type: string
          format: uuid
        haemoglobin_g_dl:
          type: number
          format: double
        systolic_mmhg:
          type: integer
        diastolic_mmhg:
          type: integer
        pulse_bpm:
          type: integer
        temperature_c:
          type: number
          format: double
        weight_kg:
          type: number
          format: double
        planned_volume_ml:
          type: integer
        passed:
          type: boolean
        findings:
          type: array
          items:
            type: string
            enum:
              - HAEMOGLOBIN_BELOW_MINIMUM
              - PULSE_OUT_OF_RANGE
              - TEMPERATURE_TOO_HIGH
              - BLOOD_PRESSURE_OUT_OF_RANGE
              - BODY_WEIGHT_BELOW_MINIMUM
        screened_at:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
      required:
        - id
        - haemoglobin_g_dl
        - systolic_mmhg
        - diastolic_mmhg
        - pulse_bpm
        - temperature_c
        - weight_kg
        - planned_volume_ml
        - passed
        - findings
        - screened_at
        - note
    Appointment:
      type: object
      description: >-
        `id` numerik internal tidak pernah keluar ke API. `scheduled_for`
        `null` berarti walk-in. Kolom waktu transisi (`arrived_at` dst.)
        hanya terisi begitu status itu benar-benar tercapai.
      properties:
        id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
          description: Public ID donor (`public_id`).
        scheduled_for:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [booked, arrived, screened, completed, no_show, cancelled]
        arrived_at:
          type: string
          format: date-time
          nullable: true
        screened_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        no_show_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
      required:
        - id
        - donor_id
        - scheduled_for
        - status
        - arrived_at
        - screened_at
        - completed_at
        - no_show_at
        - cancelled_at
        - note
    Donation:
      type: object
      description: >-
        `id` numerik internal tidak pernah keluar ke API. `screening_id`
        `null` kalau janji temu tidak punya skrining yang tertaut.
      properties:
        id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
          description: Public ID donor (`public_id`).
        appointment_id:
          type: string
          format: uuid
          description: Public ID janji temu (`public_id`).
        screening_id:
          type: string
          format: uuid
          nullable: true
          description: Public ID skrining (`public_id`).
        volume_ml:
          type: integer
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
      required:
        - id
        - donor_id
        - appointment_id
        - screening_id
        - volume_ml
        - started_at
        - completed_at
        - note
    StorageLocation:
      type: object
      description: >-
        Alat penyimpanan yang nyata milik satu fasilitas. `id` numerik internal
        dan `facility_id` tidak pernah keluar ke API.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [refrigerator, freezer, deep_freezer, platelet_agitator, ambient_shelf]
        purpose:
          type: string
          enum: [untested, reactive, indeterminate, release_ready, general]
          description: Empat kategori pemisahan fisik unit, plus `general`.
        temp_min_celsius:
          type: number
        temp_max_celsius:
          type: number
        is_active:
          type: boolean
      required: [id, code, label, kind, purpose, temp_min_celsius, temp_max_celsius, is_active]
    StorageTemperatureReading:
      type: object
      properties:
        storage_location_id:
          type: string
          format: uuid
          description: Public ID lokasi (`public_id`).
        reading_celsius:
          type: number
          description: Satu desimal.
        is_out_of_range:
          type: boolean
          description: Penilaian tersimpan terhadap band yang berlaku saat dicatat.
        source:
          type: string
          enum: [manual, device]
        note:
          type: string
          nullable: true
        recorded_at:
          type: string
          format: date-time
      required: [storage_location_id, reading_celsius, is_out_of_range, source, note, recorded_at]
    StockTransfer:
      type: object
      description: >-
        Perpindahan satu unit antar fasilitas. Selama transfer terbuka unit
        tetap `released` dan tetap milik fasilitas asal; baris transfer inilah
        yang menahannya dari alokasi ganda. `id` numerik internal dan pengguna
        yang meminta/memutuskan tidak pernah keluar ke API.
      properties:
        id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
          description: Public ID unit (`public_id`).
        from_facility_id:
          type: string
          format: uuid
          description: Fasilitas asal (pemilik unit).
        to_facility_id:
          type: string
          format: uuid
          description: Fasilitas tujuan (peminta).
        status:
          type: string
          enum: [requested, approved, rejected, shipped, received, cancelled]
        reason:
          type: string
          nullable: true
        decision_note:
          type: string
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        rejected_at:
          type: string
          format: date-time
          nullable: true
        shipped_at:
          type: string
          format: date-time
          nullable: true
        received_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
      required: [id, unit_id, from_facility_id, to_facility_id, status, reason, decision_note, approved_at, rejected_at, shipped_at, received_at, cancelled_at]
    BloodRequest:
      type: object
      description: >-
        Apa yang DIMINTA satu fasilitas, bukan apa yang dialokasikan untuknya.
        `id` numerik internal dan pengguna peminta tidak pernah keluar ke API.
      properties:
        id:
          type: string
          format: uuid
        facility_id:
          type: string
          format: uuid
          description: Fasilitas peminta (`public_id`).
        patient_reference:
          type: string
          description: Rujukan internal rumah sakit, bukan identitas pasien.
        component:
          type: string
          enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
        blood_group:
          type: string
          enum: [A, B, AB, O]
        rh_factor:
          type: string
          enum: [positive, negative]
        quantity:
          type: integer
        urgency:
          type: string
          enum: [routine, urgent, emergency]
        status:
          type: string
          enum: [open, partially_fulfilled, fulfilled, cancelled, expired]
          description: >-
            `partially_fulfilled`/`fulfilled` mengikuti jumlah alokasi aktif;
            `cancelled` dan `expired` terminal.
        needed_by:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        cancel_reason:
          type: string
          nullable: true
          description: Terisi bersama `cancelled_at`, atau keduanya null.
      required: [id, facility_id, patient_reference, component, blood_group, rh_factor, quantity, urgency, status, needed_by, note, cancelled_at, cancel_reason]
    BloodRequestAllocation:
      type: object
      description: >-
        Satu unit yang dialokasikan untuk satu permintaan. Aktif selama
        `released_at` null. `id` numerik internal dan pengguna yang
        mengalokasikan tidak pernah keluar ke API.
      properties:
        id:
          type: string
          format: uuid
        blood_request_id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        allocated_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
          nullable: true
        release_reason:
          type: string
          nullable: true
        reserved_at:
          type: string
          format: date-time
          nullable: true
          description: Terisi selama unitnya dipesan untuk permintaan ini.
        reservation_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Selalu terisi bersama `reserved_at`, dan kosong bersamanya.
        reservation_release_reason:
          type: string
          nullable: true
          description: Alasan reservasi terakhir dilepas (mis. `reservation timeout`).
      required: [id, blood_request_id, unit_id, allocated_at, released_at, release_reason, reserved_at, reservation_expires_at, reservation_release_reason]
    Crossmatch:
      type: object
      description: >-
        Satu hasil uji silang antara sampel pasien dan satu kantong. Append-only.
        `inconclusive` berarti periksa ulang, bukan tarik unit. `id` numerik
        internal dan petugas pemeriksa tidak pernah keluar ke API.
      properties:
        id:
          type: string
          format: uuid
        allocation_id:
          type: string
          format: uuid
        result:
          type: string
          enum: [compatible, incompatible, inconclusive]
        method:
          type: string
          nullable: true
          description: Teks bebas untuk jejak audit; tidak dipakai memutuskan.
        note:
          type: string
          nullable: true
        performed_at:
          type: string
          format: date-time
      required: [id, allocation_id, result, method, note, performed_at]
    Transfusion:
      type: object
      description: >-
        Satu kantong yang ditransfusikan. Satu-ke-satu dengan alokasi. `id`
        numerik internal dan petugas pencatat tidak pernah keluar ke API.
      properties:
        id:
          type: string
          format: uuid
        allocation_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        volume_transfused_ml:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/TransfusionReaction'
      required: [id, allocation_id, started_at, completed_at, volume_transfused_ml, note, reactions]
    TransfusionReaction:
      type: object
      description: >-
        Satu laporan reaksi pasca-transfusi. Tanpa derajat keparahan dan tanpa
        identitas pasien, disengaja. Pelapor tidak pernah keluar ke API.
      properties:
        id:
          type: string
          format: uuid
        transfusion_id:
          type: string
          format: uuid
        reaction_type_code:
          type: string
          nullable: true
        observed_at:
          type: string
          format: date-time
        reported_at:
          type: string
          format: date-time
        description:
          type: string
      required: [id, transfusion_id, reaction_type_code, observed_at, reported_at, description]
    BloodBatch:
      type: object
      description: >-
        `id` numerik internal tidak pernah keluar ke API. `expires_at` selalu
        berasal dari `storage_profile`; keduanya `null` untuk unit yang belum
        punya profil (mis. unit dari donasi yang baru dikarantina).
      properties:
        id:
          type: string
          format: uuid
        batch_number:
          type: string
        facility_id:
          type: string
          format: uuid
          description: Public ID fasilitas pemilik.
        donor_id:
          type: string
          format: uuid
          nullable: true
        component:
          type: string
          enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
        blood_group:
          type: string
          enum: [A, B, AB, O]
          nullable: true
        rh_factor:
          type: string
          enum: [positive, negative]
          nullable: true
        volume_ml:
          type: integer
        status:
          type: string
          enum: [quarantined, testing, released, reserved, issued, discarded, expired, separated]
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Public ID unit induk untuk komponen turunan (look-back); null untuk unit asal.
        collected_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Kapan unit dilepas dari karantina lewat gerbang rilis. `null` sampai
            unit dirilis; tetap terisi setelah unit pindah ke `reserved`/`issued`.
        expires_at:
          type: string
          format: date-time
          nullable: true
        storage_profile:
          type: object
          nullable: true
          properties:
            storage_temp_min_celsius:
              type: number
            storage_temp_max_celsius:
              type: number
            shelf_life_value:
              type: integer
            shelf_life_unit:
              type: string
              enum: [hours, days, months]
        discard_reason:
          type: string
          nullable: true
      required:
        - id
        - batch_number
        - facility_id
        - component
        - volume_ml
        - status
        - collected_at
    TtiTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        test_code:
          type: string
          enum: [hiv_1_2, hbsag, hcv, syphilis, malaria, chagas, htlv]
        is_confirmatory:
          type: boolean
        result:
          type: string
          enum: [non_reactive, reactive, indeterminate]
        tested_at:
          type: string
          format: date-time
      required: [id, test_code, is_confirmatory, result, tested_at]
    AboRhDetermination:
      type: object
      properties:
        id:
          type: string
          format: uuid
        blood_group:
          type: string
          enum: [A, B, AB, O]
        rh_factor:
          type: string
          enum: [positive, negative]
        determined_at:
          type: string
          format: date-time
      required: [id, blood_group, rh_factor, determined_at]
    DonorListItem:
      type: object
      description: >-
        Bentuk ringkas untuk tabel daftar donor. Sengaja tanpa phone, email,
        address, weight_kg, nik, maupun id numerik.
      properties:
        id:
          type: string
          format: uuid
        donor_number:
          type: string
        full_name:
          type: string
        sex:
          type: string
          enum: [male, female]
        blood_group:
          type: string
          enum: [A, B, AB, O]
          nullable: true
        rh_factor:
          type: string
          enum: [positive, negative]
          nullable: true
        city:
          type: string
        last_donation_date:
          type: string
          format: date
          nullable: true
        donation_count:
          type: integer
        deferral_status:
          type: string
          enum: [none, temporary, permanent]
      required: [id, donor_number, full_name, sex, city, donation_count, deferral_status]
    Deferral:
      type: object
      properties:
        id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
        reason_code:
          type: string
        reason_label:
          type: string
        type:
          type: string
          enum: [temporary, permanent]
        source:
          type: string
          enum: [manual, screening, tti_result]
        anchor_at:
          type: string
          format: date-time
        duration_value:
          type: integer
          nullable: true
        duration_unit:
          type: string
          enum: [hours, days, months, years]
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
        is_active:
          type: boolean
        lifted_at:
          type: string
          format: date-time
          nullable: true
        lift_note:
          type: string
          nullable: true
      required: [id, donor_id, reason_code, type, source, anchor_at, is_active]
    DeferralReason:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [temporary, permanent]
        default_duration_value:
          type: integer
          nullable: true
        default_duration_unit:
          type: string
          enum: [hours, days, months, years]
          nullable: true
        source_reference:
          type: string
      required: [code, label, type, source_reference]
    ReadinessReport:
      type: object
      properties:
        status:
          type: string
          enum: [ready, degraded]
        checks:
          type: object
          properties:
            database:
              type: boolean
            redis:
              type: boolean
            worker:
              type: boolean
          required: [database, redis, worker]
      required: [status, checks]
  responses:
    ValidationFailed:
      description: Validasi input gagal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Token tidak ada atau tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Token valid tapi tidak berhak atas resource ini.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request bertabrakan dengan state yang sedang berjalan (mis. Idempotency-Key yang sama masih diproses).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit terlampaui.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Kesalahan tak terduga di server. `details` selalu kosong di sini agar tidak membocorkan internal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
