                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /dashboard/campaigns:
    get:
      summary: Dashboard respons donor fasilitas
      description: >-
        Satu entri per kampanye AKTIF milik fasilitas pemegang token, berbentuk
        sama persis dengan `GET /blood-requests/{bloodRequest}/campaign`
        (`ended_at` dan `end_reason` selalu null di sini). Agregat saja, tanpa
        identitas donor. Kampanye yang sudah berakhir tetap terbaca lewat
        endpoint per permintaan. Pengguna tanpa fasilitas menerima daftar
        kosong dengan `meta.reason: no_facility`. Setiap jawaban donor
        disiarkan sebagai `campaign.donor-responded` di channel privat
        `facility.{facilityPublicId}` dengan payload `campaign_id`,
        `blood_request_id`, dan `response` saja; klien lalu membaca ulang
        endpoint ini. `accepted` berarti bersedia datang, BUKAN stok darah.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Kampanye aktif fasilitas, terbaru dulu.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DonorCampaign'
                  meta:
                    type: object
                    properties:
                      scope:
                        type: string
                        enum: [facility]
                      reason:
                        type: string
                        enum: [no_facility]
                    required: [scope]
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /blood-requests/{bloodRequest}/candidates:
    parameters:
      - in: path
        name: bloodRequest
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID permintaan (`public_id`).
    get:
      summary: Kandidat unit FEFO untuk satu permintaan
      description: >-
        Unit `released` di fasilitas peminta, berkomponen sama, yang lolos
        gerbang kompatibilitas ABO/RhD, terurut kedaluwarsa paling dekat lebih
        dulu (lalu `id`). Dikecualikan: unit tanpa `expires_at` (masa simpan
        belum ditentukan), unit yang kedaluwarsa sebelum `needed_by`, unit yang
        sudah punya alokasi aktif, dan unit yang punya transfer antar fasilitas
        terbuka. Permintaan trombosit selalu nol kandidat (gerbang
        `unsupported`). Paling banyak sebanyak sisa kuantitas. Tidak menulis
        apa pun. Butuh `inventory.release` di fasilitas peminta.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Kandidat terurut FEFO.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      blood_request_id:
                        type: string
                        format: uuid
                      remaining:
                        type: integer
                      candidates:
                        type: array
                        items:
                          type: object
                          properties:
                            unit_id:
                              type: string
                              format: uuid
                            blood_group:
                              type: string
                              enum: [A, B, AB, O]
                            rh_factor:
                              type: string
                              enum: [positive, negative]
                            expires_at:
                              type: string
                              format: date-time
                    required: [blood_request_id, remaining, candidates]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /blood-requests/{bloodRequest}/allocations:
    parameters:
      - in: path
        name: bloodRequest
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID permintaan (`public_id`).
    post:
      summary: Alokasikan unit FEFO ke permintaan
      description: >-
        Mengalokasikan kandidat FEFO (lihat `.../candidates`) sebanyak sisa
        kuantitas, atau paling banyak `max`. Permintaan yang sudah penuh
        menghasilkan nol alokasi, bukan error. Status permintaan naik ke
        `partially_fulfilled`/`fulfilled`. Status UNIT tidak berubah -- tetap
        `released`. Satu unit hanya bisa punya satu alokasi aktif (partial
        unique index); unit yang direbut alokasi lain di tengah jalan
        dilewati. Permintaan `cancelled`/`expired` ditolak 409
        `BLOOD_REQUEST_NOT_ALLOCATABLE`. Butuh `inventory.release`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                max:
                  type: integer
                  minimum: 1
                  maximum: 20
                  nullable: true
      responses:
        '201':
          description: Alokasi yang dibuat (bisa kosong).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      blood_request:
                        $ref: '#/components/schemas/BloodRequest'
                      allocations:
                        type: array
                        items:
                          $ref: '#/components/schemas/BloodRequestAllocation'
                    required: [blood_request, allocations]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /allocations/{allocation}:
    parameters:
      - in: path
        name: allocation
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID alokasi (`public_id`).
    delete:
      summary: Lepaskan satu alokasi
      description: >-
        Membebaskan unit untuk dialokasikan lagi dan menurunkan status
        permintaan kembali (`fulfilled` -> `partially_fulfilled` -> `open`).
        Reservasi yang masih menempel dilepas lebih dulu, dalam transaksi yang
        sama, sehingga unitnya kembali `released`.
        Idempoten: alokasi yang sudah dilepas dikembalikan apa adanya, alasan
        pertama dipertahankan. DELETE tidak memakai `Idempotency-Key`.
        Butuh `inventory.release` di fasilitas peminta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 255
              required: [reason]
      responses:
        '200':
          description: Alokasi dilepas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodRequestAllocation'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-requests/{bloodRequest}/reservations:
    parameters:
      - in: path
        name: bloodRequest
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID permintaan (`public_id`).
    post:
      summary: Pesan unit yang sudah dialokasikan
      description: >-
        Setiap alokasi aktif yang belum dipesan: unitnya pindah `released` ->
        `reserved` dan alokasinya mendapat `reserved_at` serta
        `reservation_expires_at`, dalam SATU transaksi -- satu unit gagal,
        semuanya batal. Baris unit dikunci (`SELECT ... FOR UPDATE`) dalam
        urutan id yang stabil. Unit yang sudah dipesan ditolak oleh graf
        status (409 `BLOOD_BATCH_TRANSITION_REJECTED`); permintaan tanpa
        alokasi yang bisa dipesan juga 409. Jendela default 48 jam adalah
        pilihan operasional, bukan angka medis; `window_hours` maksimal 168
        (kewarasan instrumen). Reservasi yang lewat batas dilepas otomatis tiap
        jam. Butuh `inventory.release`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                window_hours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  nullable: true
      responses:
        '201':
          description: Alokasi yang baru dipesan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BloodRequestAllocation'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /allocations/{allocation}/reservation:
    parameters:
      - in: path
        name: allocation
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID alokasi (`public_id`).
    delete:
      summary: Lepas reservasi satu alokasi
      description: >-
        Unit `reserved` kembali `released`; alokasinya TETAP hidup (gunakan
        `DELETE /allocations/{allocation}` untuk melepas alokasinya, yang juga
        melepas reservasinya lebih dulu). Unit yang sudah keluar stok
        (`issued`, `discarded`, `expired`) tidak dipaksa kembali -- hanya kolom
        reservasinya yang dikosongkan. Idempoten. DELETE tidak memakai
        `Idempotency-Key`. Butuh `inventory.release`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 255
              required: [reason]
      responses:
        '200':
          description: Reservasi dilepas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodRequestAllocation'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /allocations/{allocation}/crossmatches:
    parameters:
      - in: path
        name: allocation
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID alokasi (`public_id`).
    post:
      summary: Catat satu hasil crossmatch
      description: >-
        Append-only: crossmatch ulang MENAMBAH baris, tidak menimpa; yang
        berlaku untuk penerbitan adalah hasil terbaru. Pencatatan tidak
        mengubah status unit maupun alokasi apa pun, KECUALI hasil
        `incompatible`: alokasinya langsung dilepas
        (`release_reason` = `crossmatch_incompatible`), unitnya kembali ke
        stok, dan status permintaan diturunkan -- dalam transaksi yang sama.
        `inconclusive` tidak melepas apa pun. `method` hanya jejak audit
        (teks bebas), tidak pernah dipakai memutuskan. Hasil `incompatible` dan
        `inconclusive` wajib membawa `note`. Alokasi yang sudah dilepas ditolak
        409 `CROSSMATCH_REJECTED`. Butuh `inventory.release` di fasilitas
        peminta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result:
                  type: string
                  enum: [compatible, incompatible, inconclusive]
                method:
                  type: string
                  maxLength: 120
                  nullable: true
                note:
                  type: string
                  maxLength: 2000
                  nullable: true
                  description: Wajib bila `result` bukan `compatible`.
              required: [result]
      responses:
        '201':
          description: Hasil crossmatch tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Crossmatch'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /allocations/{allocation}/issue:
    parameters:
      - in: path
        name: allocation
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID alokasi (`public_id`).
    post:
      summary: Terbitkan unit yang lolos crossmatch
      description: >-
        SATU-SATUNYA jalur ke status `issued`; perpindahan status biasa
        (`PATCH /blood-batches/{id}/status`) menolak `issued`. Syaratnya:
        alokasi masih aktif, unit berstatus `reserved`, dan crossmatch TERBARU
        bernilai `compatible` -- hasil compatible lama yang disusul hasil lain
        tidak berlaku. Penolakan dibalas 409 `CROSSMATCH_REJECTED`; unit tetap
        `reserved` dan alokasinya tetap aktif. Reservasinya dikosongkan saat
        terbit supaya timeout reservasi tidak menyentuhnya. Butuh
        `inventory.release` di fasilitas peminta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Unit diterbitkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      allocation:
                        $ref: '#/components/schemas/BloodRequestAllocation'
                      unit_status:
                        type: string
                        enum: [issued]
                      crossmatches:
                        type: array
                        items:
                          $ref: '#/components/schemas/Crossmatch'
                    required: [allocation, unit_status, crossmatches]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /allocations/{allocation}/transfusion:
    parameters:
      - in: path
        name: allocation
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID alokasi (`public_id`).
    post:
      summary: Catat transfusi satu unit yang sudah diterbitkan
      description: >-
        Hemovigilans: mencatat bahwa kantong benar-benar masuk ke pasien.
        Hanya unit berstatus `issued`; selain itu 409 `TRANSFUSION_REJECTED`.
        Satu alokasi, satu transfusi -- pencatatan kedua juga 409. Status unit
        TIDAK berubah (`issued` terminal). `completed_at` null berarti
        transfusi masih berjalan, dan volume hanya boleh diisi bila sudah
        selesai. Butuh `inventory.release` di fasilitas peminta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                started_at:
                  type: string
                  format: date-time
                completed_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Tidak boleh sebelum `started_at` (juga CHECK di database).
                volume_transfused_ml:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: Hanya bersama `completed_at`.
                note:
                  type: string
                  maxLength: 2000
                  nullable: true
              required: [started_at]
      responses:
        '201':
          description: Transfusi tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Transfusion'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /transfusions/{transfusion}:
    parameters:
      - in: path
        name: transfusion
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID transfusi (`public_id`).
    get:
      summary: Satu transfusi beserta laporan reaksinya
      description: >-
        Reaksi diurutkan menurut `observed_at` (waktu kejadian), bukan waktu
        laporan. Butuh `inventory.release` di fasilitas peminta.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transfusi dan reaksinya.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Transfusion'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /transfusions/{transfusion}/reactions:
    parameters:
      - in: path
        name: transfusion
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID transfusi (`public_id`).
    post:
      summary: Laporkan reaksi pasca-transfusi
      description: >-
        Pengamatan, bukan tindakan: tidak ada status unit maupun permintaan
        yang berubah. Satu transfusi boleh punya banyak laporan (segera dan
        tertunda). Tidak ada derajat keparahan dan tidak ada identitas pasien
        -- disengaja. `reaction_type_code` opsional dan hanya menerima jenis
        terkutip dari master data; tanpanya laporan tetap sah sebagai
        naratif. Memancarkan event domain `TransfusionReactionReported`.
        Butuh `inventory.release` di fasilitas peminta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                observed_at:
                  type: string
                  format: date-time
                  description: Kapan reaksi terjadi, bukan kapan dilaporkan. Tidak boleh di masa depan.
                reaction_type_code:
                  type: string
                  nullable: true
                description:
                  type: string
                  maxLength: 5000
              required: [observed_at, description]
      responses:
        '201':
          description: Reaksi tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TransfusionReaction'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /compatibility:
    get:
      summary: Donor yang lolos gerbang kompatibilitas ABO/RhD untuk satu penerima
      description: >-
        Pemeriksaan DATA, bukan crossmatch laboratorium. Aturannya data
        ter-seed ber-provenans (WHO Module 3 §6.3 Figure 14 & 15; Rujukan
        Pedoman Medis §12). Sel darah merah (`whole_blood`,
        `packed_red_cells`) memeriksa ABO dan RhD; plasma
        (`fresh_frozen_plasma`, `cryoprecipitate`) memeriksa ABO arah
        KEBALIKAN dan tidak memeriksa RhD (`donor_rh` null). Trombosit dibalas
        `unsupported`: WHO tidak memberi matriksnya. Pasangan tanpa aturan
        berarti tidak boleh. `provenance` `derived` menandai keputusan yang
        bergantung pada aturan tanpa kutipan WHO (penerima RhD-positif dengan
        donor RhD-negatif). Butuh `request.view`.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: component
          required: true
          schema:
            type: string
            enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
        - in: query
          name: recipient_group
          required: true
          schema:
            type: string
            enum: [A, B, AB, O]
        - in: query
          name: recipient_rh
          required: true
          schema:
            type: string
            enum: [positive, negative]
      responses:
        '200':
          description: Daftar donor yang boleh, atau `unsupported`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      component:
                        type: string
                      direction:
                        type: string
                        enum: [red_cells, plasma]
                        description: Tidak ada saat `unsupported`.
                      outcome:
                        type: string
                        enum: [compatible, incompatible, unsupported]
                      detail:
                        type: string
                        description: Hanya saat `unsupported`.
                      compatible_donors:
                        type: array
                        items:
                          type: object
                          properties:
                            donor_group:
                              type: string
                              enum: [A, B, AB, O]
                            donor_rh:
                              type: string
                              enum: [positive, negative]
                              nullable: true
                              description: Null untuk plasma -- RhD tidak diperiksa.
                            provenance:
                              type: string
                              enum: [cited, derived]
                            source_references:
                              type: array
                              items:
                                type: string
                          required: [donor_group, donor_rh, provenance, source_references]
                    required: [component, outcome, compatible_donors]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /donors:
    get:
      summary: Daftar donor (staf)
      description: >-
        Butuh izin `donor.view` (peran donor ditolak 403). Tersaring otomatis
        ke fasilitas registrasi donor pemegang token; operator global melihat
        seluruhnya. Baris nisan hasil merge tidak ikut. Baris berbentuk ringkas
        (`DonorListItem`) tanpa kontak maupun data kesehatan. `search` mencari
        nama yang mirip lewat pg_trgm dengan ambang yang sama dengan deduplikasi
        identitas. `deferral_status` dihitung dari deferral yang belum dicabut
        dan belum berakhir; permanen mengalahkan temporer.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - in: query
          name: search
          required: false
          schema:
            type: string
            maxLength: 255
          description: Nama donor (pencocokan kemiripan, bukan awalan).
        - in: query
          name: filter[blood_group]
          required: false
          schema:
            type: string
            enum: [A, B, AB, O]
        - in: query
          name: filter[rh_factor]
          required: false
          schema:
            type: string
            enum: [positive, negative]
        - in: query
          name: filter[sex]
          required: false
          schema:
            type: string
            enum: [male, female]
        - in: query
          name: filter[city]
          required: false
          schema:
            type: string
        - in: query
          name: filter[deferral_status]
          required: false
          schema:
            type: string
            enum: [none, temporary, permanent]
      responses:
        '200':
          description: Daftar donor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DonorListItem'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /deferral-reasons:
    get:
      summary: Master data alasan deferral yang aktif
      description: Read-only, tanpa paginasi. Dipakai form penempatan deferral.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Alasan deferral yang aktif.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeferralReason'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /donors/{donor}/deferrals:
    get:
      summary: Riwayat deferral seorang donor
      description: >-
        Butuh izin `donor.view` dan fasilitas yang sama dengan donor. Memuat
        deferral yang sudah dicabut atau berakhir; `filter[active]` menyaring
        ke yang masih menahan (`true`) atau yang tidak lagi (`false`).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: donor
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID donor (`public_id`).
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - in: query
          name: filter[active]
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Riwayat deferral.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deferral'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      summary: Tempatkan deferral (tindakan petugas)
      description: >-
        Butuh izin `donor.update` dan fasilitas yang sama dengan donor. Jenis,
        durasi, dan `ends_at` diturunkan dari alasan (master data), tidak
        dikirim klien; sumbernya tercatat `manual`. Kode alasan yang tidak ada
        ditolak 422; kode yang dinonaktifkan ditolak 409
        `DONOR_DEFERRAL_CONFLICT`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: donor
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID donor (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code:
                  type: string
                anchor_at:
                  type: string
                  format: date-time
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
              required: [reason_code, anchor_at]
      responses:
        '201':
          description: Deferral tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Deferral'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /donors/{donor}/flags:
    parameters:
      - in: path
        name: donor
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID donor.
    get:
      summary: Daftar flag administratif donor
      description: >-
        Sanksi ADMINISTRATIF -- kanal terpisah dari deferral medis. `filter[active]`
        memakai definisi "aktif" yang sama dengan mesin kelayakan. Butuh
        `donor.update` dan operator global atau fasilitas tempat donor terdaftar.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: filter[active]
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Flag donor (cursor pagination).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DonorFlag'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      summary: Tempatkan flag administratif
      description: >-
        Memblokir kelayakan dengan kode temuan `ACTIVE_ADMIN_FLAG` (bukan
        `ACTIVE_DEFERRAL`) dan tidak pernah menulis ke deferral. Donor SELALU
        dari path: `donor_id` di body ditolak 422. Satu flag aktif per donor;
        yang kedua 409 `DONOR_FLAG_REJECTED`. `ends_at` kosong = tanpa batas
        waktu (tetap bisa dicabut). Hanya operator global.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [identity_fraud, repeated_no_show, staff_safety, other]
                note:
                  type: string
                  maxLength: 2000
                ends_at:
                  type: string
                  format: date-time
                  nullable: true
              required: [reason, note]
      responses:
        '201':
          description: Flag ditempatkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DonorFlag'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /donor-flags/{donorFlag}/lift:
    parameters:
      - in: path
        name: donorFlag
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID flag.
    post:
      summary: Cabut flag administratif
      description: >-
        Sekali jalan: pencabutan kedua 409 `DONOR_FLAG_REJECTED` tanpa mengubah
        baris. Hanya operator global.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
              required: [reason]
      responses:
        '200':
          description: Flag dicabut.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DonorFlag'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /deferrals/{deferral}/lift:
    patch:
      summary: Cabut deferral
      description: >-
        Butuh izin `donor.update` dan fasilitas yang sama dengan donor.
        Deferral permanen tidak bisa dicabut (409
        `DONOR_PERMANENT_DEFERRAL_NOT_LIFTABLE`); deferral yang sudah dicabut
        ditolak 409 `DONOR_DEFERRAL_ALREADY_LIFTED`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: deferral
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID deferral (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
              required: [reason]
      responses:
        '200':
          description: Deferral dicabut.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Deferral'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Token Sanctum, dikirim lewat header `Authorization: Bearer <token>`.'
  parameters:
    ReportFrom:
      in: query
      name: from
      required: true
      schema:
        type: string
        format: date
      description: Hari pertama (UTC, inklusif). Diratakan mundur ke awal bucket-nya.
    ReportTo:
      in: query
      name: to
      required: true
      schema:
        type: string
        format: date
      description: >-
        Hari terakhir (UTC, inklusif), >= `from`. Bucket-nya ikut dihitung
        penuh. Jumlah bucket dibatasi (`security.report_max_buckets`, default
        366); lebih dari itu 422 dengan aturan `too_many_buckets` di `to`.
    ReportGranularity:
      in: query
      name: granularity
      required: true
      schema:
        type: string
        enum: [day, week, month]
      description: Lebar bucket. Minggu dimulai Senin (ISO). Nilai lain 422.
    Cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: Cursor buram dari `meta.next_cursor` atau `meta.prev_cursor` halaman sebelumnya.
    PerPage:
      in: query
      name: per_page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Jumlah item per halaman. Nilai di luar rentang di-clamp, bukan ditolak.
    Sort:
      in: query
      name: sort
      required: false
      schema:
        type: string
      description: >-
        Nama kolom untuk mengurutkan hasil. Awali dengan `-` untuk urutan
        descending, mis. `-created_at`. Hanya kolom di allowlist endpoint yang
        diterima; kolom lain menghasilkan `VALIDATION_FAILED`.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        format: uuid
      description: >-
        Wajib untuk setiap POST/PUT/PATCH. Request dengan key yang sama dan
        body yang sama akan me-replay respons pertama; key yang sama dengan
        body berbeda ditolak dengan `IDEMPOTENCY_KEY_REUSED`.
    FacilityId:
      in: path
      name: facility
      required: true
      schema:
        type: string
        format: uuid
      description: 'Public ID fasilitas (`public_id`). ID numerik internal tidak pernah keluar ke API.'
    StaffUser:
      in: path
      name: user
      required: true
      schema:
        type: string
        format: uuid
      description: 'Public ID akun staf (`public_id`). ID numerik internal tidak pernah keluar ke API.'
    RequestId:
      in: header
      name: X-Request-Id
      required: false
      schema:
        type: string
        maxLength: 64
      description: >-
        ID korelasi request pilihan klien. Kalau tidak dikirim, server
        membuatnya sendiri dan mengembalikannya di header respons serta di
        `error.trace_id`.
  schemas:
    ReportMeta:
      type: object
      properties:
        granularity:
          type: string
          enum: [day, week, month]
        from:
          type: string
          format: date
          description: Awal bucket pertama (sesudah perataan).
        to_exclusive:
          type: string
          format: date
          description: Awal bucket SESUDAH bucket terakhir.
        timezone:
          type: string
          enum: [UTC]
        numerator:
          type: string
          description: Definisi pembilang, hanya di laporan berasio.
        denominator:
          type: string
          description: Definisi penyebut, hanya di laporan berasio.
      required: [granularity, from, to_exclusive, timezone]
    WastageBucket:
      type: object
      properties:
        period_start:
          type: string
          format: date
        discarded:
          type: integer
        expired:
          type: integer
        released:
          type: integer
        numerator:
          type: integer
          description: discarded + expired.
        denominator:
          type: integer
          description: Sama dengan released.
        ratio:
          type: number
          nullable: true
          description: numerator / denominator, 4 desimal; null bila penyebut 0.
      required: [period_start, discarded, expired, released, numerator, denominator, ratio]
    CrossmatchTransfusionBucket:
      type: object
      properties:
        period_start:
          type: string
          format: date
        numerator:
          type: integer
          description: Crossmatch yang dikerjakan, semua hasil.
        denominator:
          type: integer
          description: Transfusi yang dimulai.
        ratio:
          type: number
          nullable: true
          description: numerator / denominator, 4 desimal; null bila penyebut 0.
      required: [period_start, numerator, denominator, ratio]
    StockTrendBucket:
      type: object
      properties:
        period_start:
          type: string
          format: date
        transitions_to:
          type: object
          description: Jumlah transisi KE tiap status unit dalam bucket.
          properties:
            quarantined:
              type: integer
            testing:
              type: integer
            released:
              type: integer
            reserved:
              type: integer
            issued:
              type: integer
            discarded:
              type: integer
            expired:
              type: integer
            separated:
              type: integer
          required: [quarantined, testing, released, reserved, issued, discarded, expired, separated]
      required: [period_start, transitions_to]
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - INTERNAL_ERROR
        - METHOD_NOT_ALLOWED
        - TOO_MANY_REQUESTS
        - HTTP_ERROR
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - REQUEST_IN_PROGRESS
        - DONOR_DUPLICATE_NIK
        - DONOR_DUPLICATE_PHONE
        - DONOR_MERGE_CONFLICT
        - DONOR_DEFERRAL_CONFLICT
        - DONOR_DEFERRAL_ALREADY_LIFTED
        - DONOR_ACCOUNT_NOT_LINKED
        - DONOR_PERMANENT_DEFERRAL_NOT_LIFTABLE
        - APPOINTMENT_TRANSITION_REJECTED
        - BLOOD_BATCH_TRANSITION_REJECTED
        - BATCH_EXPIRY_UNDETERMINABLE
        - UNIT_NUMBER_ALLOCATION_FAILED
        - INVENTORY_SEPARATION_REJECTED
        - LAB_TEST_NOT_IN_PANEL
        - LAB_RESULT_DUPLICATE
        - LAB_RESULT_REJECTED
        - INVENTORY_RELEASE_REJECTED
        - BLOOD_REQUEST_NOT_ALLOCATABLE
        - CROSSMATCH_REJECTED
        - TRANSFUSION_REJECTED
        - NOTIFICATION_TEMPLATE_REJECTED
        - NOTIFICATION_CHANNEL_NOT_PERMITTED
        - NOTIFICATION_DELIVERY_FAILED
        - CAMPAIGN_REJECTED
        - DONOR_FLAG_REJECTED
        - PASSWORD_RESET_TOKEN_INVALID
        - APPOINTMENT_SLOT_UNAVAILABLE
    MessageEnvelope:
      type: object
      description: Balasan sukses yang hanya membawa pesan untuk ditampilkan.
      properties:
        data:
          type: object
          properties:
            message:
              type: string
          required: [message]
        meta:
          type: object
      required: [data, meta]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: object
              description: >
                Per field, daftar aturan yang gagal. Kosong ({}) untuk error non-validasi.
                Klien memetakan `rule` + `params` ke kalimat lokalnya sendiri; backend
                tidak pernah mengirim kalimat siap tampil.
              additionalProperties:
                type: array
                items:
                  type: object
                  required: [rule, params]
                  properties:
                    rule:
                      type: string
                      description: Nama aturan Laravel dalam snake_case, atau kunci khusus aplikasi (not_allowed, invalid_sort, unsupported_filter).
                      example: min
                    params:
                      description: >
                        Objek bernama untuk aturan yang dipetakan, larik posisional untuk sisanya.
                        Nilai leaf selalu string; `values` (in, not_in, mimes) dan `keys` (unsupported_filter) berupa list string.
                      example: { min: "8" }
            trace_id:
              type: string
              format: uuid
          required: [code, message, details, trace_id]
      required: [error]
    PaginationMeta:
      type: object
      properties:
        per_page:
          type: integer
        next_cursor:
          type: string
          nullable: true
        prev_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
      required: [per_page, next_cursor, prev_cursor, has_more]
    PaginationLinks:
      type: object
      properties:
        next:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
      required: [next, prev]
    AuthToken:
      type: object
      properties:
        token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
            role:
              type: string
            facility_id:
              type: string
              format: uuid
              nullable: true
              description: >-
                public_id fasilitas pengguna. null berarti tidak terikat fasilitas --
                donor atau operator global -- dan itu bukan kesalahan.
          required: [id, name, email, role, facility_id]
      required: [token, token_type, user]
    AppointmentScheduleWindow:
      type: object
      description: Satu jendela pada satu hari, jam dinding LOKAL fasilitas.
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO-8601, 1 = Senin ... 7 = Minggu.
        opens_at:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        closes_at:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$|^24:00$'
        slot_minutes:
          type: integer
          minimum: 5
          maximum: 480
        capacity:
          type: integer
          minimum: 1
          maximum: 500
          description: Donor per slot.
      required: [weekday, opens_at, closes_at, slot_minutes, capacity]
    AppointmentClosure:
      type: object
      properties:
        date:
          type: string
          format: date
        reason:
          type: string
      required: [date, reason]
    AppointmentSchedule:
      type: object
      properties:
        timezone:
          type: string
          enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
        windows:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentScheduleWindow'
        closures:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentClosure'
      required: [timezone, windows, closures]
    AppointmentSlot:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
          description: Dengan offset zona fasilitas, mis. 2026-11-02T08:00:00+07:00.
        ends_at:
          type: string
          format: date-time
        capacity:
          type: integer
        booked:
          type: integer
        available:
          type: integer
      required: [starts_at, ends_at, capacity, booked, available]
    StaffAssignment:
      type: object
      properties:
        facility_id:
          type: string
          format: uuid
          description: Public ID fasilitas aktif.
        role:
          type: string
          enum: [hospital_staff, admin]
      required: [facility_id, role]
    StaffAccount:
      type: object
      description: >-
        Tanpa password, hash, token, maupun id numerik. `role` adalah peran akun
        di fasilitasnya sendiri.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        facility_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [hospital_staff, admin]
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
      required: [id, name, email, facility_id, role, is_active, created_at]
    Facility:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [hospital, blood_bank, donation_unit, mobile_unit]
        address:
          type: string
        city:
          type: string
        province:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        is_active:
          type: boolean
          description: Sedang beroperasi. TERPISAH dari verifikasi.
        is_verified:
          type: boolean
        verified_at:
          type: string
          format: date-time
          nullable: true
      required: [id, code, name, type, address, city, province, phone, email, is_active, is_verified, verified_at]
    DonorFlag:
      type: object
      description: >-
        Sanksi ADMINISTRATIF satu donor, bukan deferral medis. Penempat dan
        pencabutnya tidak keluar ke API.
      properties:
        id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [identity_fraud, repeated_no_show, staff_safety, other]
        note:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
        lifted_at:
          type: string
          format: date-time
          nullable: true
        lift_note:
          type: string
          nullable: true
      required: [id, donor_id, reason, note, starts_at, ends_at, is_active, lifted_at, lift_note]
    FacilityWithCoordinates:
      allOf:
        - $ref: '#/components/schemas/Facility'
        - type: object
          properties:
            latitude:
              type: number
              format: double
              nullable: true
            longitude:
              type: number
              format: double
              nullable: true
          required: [latitude, longitude]
    FacilityWrite:
      type: object
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9-]{3,32}$'
          description: Otomatis di-uppercase sebelum divalidasi.
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [hospital, blood_bank, donation_unit, mobile_unit]
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        province:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Wajib untuk tipe `hospital` dan `blood_bank`.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Wajib untuk tipe `hospital` dan `blood_bank`.
      required: [code, name, type, address, city, province, phone]
    AuditLogEntry:
      type: object
      description: >-
        `changes` sudah ter-redaksi saat ditulis ([REDACTED] untuk kunci
        sensitif); kolom terenkripsi (mis. phone/email/address donor) tidak
        pernah muncul di sini sama sekali. Pembaca non-global hanya menerima
        barisnya sendiri (`actor_facility_id` miliknya).
      properties:
        id:
          type: string
          description: ID numerik internal, diekspos sebagai string opaque (audit_logs tidak punya public_id).
        auditable_type:
          type: string
        auditable_id:
          type: integer
        action:
          type: string
          enum: [created, updated, deleted]
        actor_id:
          type: integer
          nullable: true
        actor_facility_id:
          type: integer
          nullable: true
        changes:
          type: object
          properties:
            before:
              type: object
            after:
              type: object
        trace_id:
          type: string
          format: uuid
          nullable: true
        ip:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
      required: [id, auditable_type, auditable_id, action, actor_id, actor_facility_id, changes, trace_id, ip, occurred_at]
    DonorProfile:
      type: object
      description: >-
        `id` numerik internal, `nik`, `nik_hash`, dan `phone_hash` tidak
        pernah keluar ke API. NIK yang sudah terisi dilaporkan lewat
        `has_nik`, bukan nilainya sendiri.
      properties:
        id:
          type: string
          format: uuid
          description: Public ID donor (`public_id`).
        donor_number:
          type: string
        full_name:
          type: string
        date_of_birth:
          type: string
          format: date
        sex:
          type: string
          enum: [male, female]
        blood_group:
          type: string
          enum: [A, B, AB, O]
          nullable: true
        rh_factor:
          type: string
          enum: [positive, negative]
          nullable: true
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        address:
          type: string
        city:
          type: string
        weight_kg:
          type: number
          format: double
          nullable: true
        last_donation_date:
          type: string
          format: date
          nullable: true
        donation_count:
          type: integer
        has_nik:
          type: boolean
      required:
        - id
        - donor_number
        - full_name
        - date_of_birth
        - sex
        - blood_group
        - rh_factor
        - phone
        - email
        - address
        - city
        - weight_kg
        - last_donation_date
        - donation_count
        - has_nik
    EligibilitySelfCheck:
      type: object
      description: >-
        `outcome` bertiga-nilai, jangan diperas jadi boolean.
        `is_provisional` selalu true karena pemanggil anonim tidak punya
        deferral tersimpan untuk dipertimbangkan.
      properties:
        outcome:
          type: string
          enum: [eligible, not_eligible, undetermined]
        is_provisional:
          type: boolean
          enum: [true]
        retry_after_date:
          type: string
          format: date
          nullable: true
        findings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                  - AGE_BELOW_MINIMUM
                  - AGE_ABOVE_MAXIMUM
                  - DONATION_INTERVAL_NOT_MET
                  - BODY_WEIGHT_BELOW_MINIMUM
                  - ACTIVE_DEFERRAL
                  - DATA_MISSING
              outcome:
                type: string
                enum: [eligible, not_eligible, undetermined]
              retry_after_date:
                type: string
                format: date
                nullable: true
              detail:
                type: string
                nullable: true
            required: [code, outcome, retry_after_date, detail]
      required: [outcome, is_provisional, retry_after_date, findings]
    DonorEligibility:
      type: object
      description: >-
        Bentuk sama dengan EligibilitySelfCheck, tapi berbasis riwayat donor:
        `is_provisional` selalu false, dan `ACTIVE_DEFERRAL` maupun
        `ACTIVE_ADMIN_FLAG` dapat muncul. `outcome` bertiga-nilai, jangan
        diperas jadi boolean.
      properties:
        outcome:
          type: string
          enum: [eligible, not_eligible, undetermined]
        is_provisional:
          type: boolean
          enum: [false]
        retry_after_date:
          type: string
          format: date
          nullable: true
        findings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                  - AGE_BELOW_MINIMUM
                  - AGE_ABOVE_MAXIMUM
                  - DONATION_INTERVAL_NOT_MET
                  - BODY_WEIGHT_BELOW_MINIMUM
                  - ACTIVE_DEFERRAL
                  - DATA_MISSING
                  - ACTIVE_ADMIN_FLAG
              outcome:
                type: string
                enum: [eligible, not_eligible, undetermined]
              retry_after_date:
                type: string
                format: date
                nullable: true
              detail:
                type: string
                nullable: true
            required: [code, outcome, retry_after_date, detail]
      required: [outcome, is_provisional, retry_after_date, findings]
    DonorScreening:
      type: object
      description: >-
        `id` numerik internal tidak pernah keluar ke API. `haemoglobin_g_dl`
        dan `temperature_c` selalu desimal (mis. 12.5, 37.6) -- penyimpanan
        internalnya integer dalam sepersepuluh satuan, tapi itu detail
        implementasi yang tidak pernah bocor ke kontrak ini.
      properties:
        id:
          type: string
          format: uuid
        haemoglobin_g_dl:
          type: number
          format: double
        systolic_mmhg:
          type: integer
        diastolic_mmhg:
          type: integer
        pulse_bpm:
          type: integer
        temperature_c:
          type: number
          format: double
        weight_kg:
          type: number
          format: double
        planned_volume_ml:
          type: integer
        passed:
          type: boolean
        findings:
          type: array
          items:
            type: string
            enum:
              - HAEMOGLOBIN_BELOW_MINIMUM
              - PULSE_OUT_OF_RANGE
              - TEMPERATURE_TOO_HIGH
              - BLOOD_PRESSURE_OUT_OF_RANGE
              - BODY_WEIGHT_BELOW_MINIMUM
        screened_at:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
      required:
        - id
        - haemoglobin_g_dl
        - systolic_mmhg
        - diastolic_mmhg
        - pulse_bpm
        - temperature_c
        - weight_kg
        - planned_volume_ml
        - passed
        - findings
        - screened_at
        - note
    Appointment:
      type: object
      description: >-
        `id` numerik internal tidak pernah keluar ke API. `scheduled_for`
        `null` berarti walk-in. Kolom waktu transisi (`arrived_at` dst.)
        hanya terisi begitu status itu benar-benar tercapai.
      properties:
        id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
