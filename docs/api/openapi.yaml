        Transisi dijaga oleh `AppointmentStatus::canTransitionTo()`: hanya
        `booked -> arrived|no_show|cancelled`, `arrived -> screened|cancelled`,
        dan `screened -> completed|cancelled` yang sah. `no_show` hanya sah
        dari `booked` dan hanya setelah `scheduled_for` lewat. Transisi yang
        tidak sah ditolak 409 tanpa mengubah baris.
      security:
        - bearerAuth: []
