deptrac:
  paths:
    - ./app/Modules
    - ./app/Shared
    - ./app/Models

  layers:
    - name: Framework
      collectors:
        - type: classNameRegex
          value: /^Illuminate\\.*/
        - type: classNameRegex
          value: /^Symfony\\.*/
        - type: classNameRegex
          value: /^Spatie\\.*/
        - type: classNameRegex
          value: /^Laravel\\Sanctum\\.*/
        - type: classNameRegex
          value: /^Tests\\.*/
        - type: classNameRegex
          value: /^PHPUnit\\.*/
        - type: classNameRegex
          value: /^Database\\Seeders\\.*/

    # Library barcode (Kartu 210): hanya ModInventory yang boleh menyentuhnya.
    - name: Barcode
      collectors:
        - type: classNameRegex
          value: /^Picqer\\Barcode\\.*/

    - name: Shared
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Shared/.*
          must_not:
            - type: directory
              value: app/Shared/Blood/.*

    # Kosakata darah bersama (Kartu 310): BloodGroup, RhFactor, BloodComponent.
    # Enum murni tanpa dependensi, jadi boleh dipakai semua modul DAN semua
    # domain -- berbeda dengan Shared, yang berisi Http/Auth dan tertutup bagi domain.
    - name: BloodKernel
      collectors:
        - type: directory
          value: app/Shared/Blood/.*

    - name: Models
      collectors:
        - type: directory
          value: app/Models/.*

    - name: EvtIdentity
      collectors:
        - type: directory
          value: app/Modules/Identity/Domain/Events/.*
    - name: DomIdentity
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Identity/Domain/.*
          must_not:
            - type: directory
              value: app/Modules/Identity/Domain/Events/.*
    - name: ModIdentity
      collectors:
        - type: directory
          value: app/Modules/Identity/(Application|Http|Infrastructure|Database|Tests)/.*

    - name: EvtDonor
      collectors:
        - type: directory
          value: app/Modules/Donor/Domain/Events/.*
    - name: DomDonor
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Donor/Domain/.*
          must_not:
            - type: directory
              value: app/Modules/Donor/Domain/Events/.*
    - name: ModDonor
      collectors:
        - type: directory
          value: app/Modules/Donor/(Application|Http|Infrastructure|Database|Tests)/.*

    - name: EvtInventory
      collectors:
        - type: directory
          value: app/Modules/Inventory/Domain/Events/.*
    - name: DomInventory
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Inventory/Domain/.*
          must_not:
            - type: directory
              value: app/Modules/Inventory/Domain/Events/.*
    - name: ModInventory
      collectors:
        - type: directory
          value: app/Modules/Inventory/(Application|Http|Infrastructure|Database|Tests)/.*

    - name: EvtRequest
      collectors:
        - type: directory
          value: app/Modules/Request/Domain/Events/.*
    - name: DomRequest
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Request/Domain/.*
          must_not:
            - type: directory
              value: app/Modules/Request/Domain/Events/.*
    - name: ModRequest
      collectors:
        - type: directory
          value: app/Modules/Request/(Application|Http|Infrastructure|Database|Tests)/.*

    - name: EvtNotification
      collectors:
        - type: directory
          value: app/Modules/Notification/Domain/Events/.*
    - name: DomNotification
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Notification/Domain/.*
          must_not:
            - type: directory
              value: app/Modules/Notification/Domain/Events/.*
    - name: ModNotification
      collectors:
        - type: directory
          value: app/Modules/Notification/(Application|Http|Infrastructure|Database|Tests)/.*

  ruleset:
    BloodKernel: ~
    Shared: [Framework, BloodKernel]
    Models: [Framework, Shared, BloodKernel, DomIdentity, DomDonor, DomInventory, DomRequest, DomNotification]

    ModIdentity:     [Framework, Shared, BloodKernel, Models, DomIdentity, EvtIdentity, EvtDonor, EvtInventory, EvtRequest, EvtNotification]
    ModDonor:        [Framework, Shared, BloodKernel, Models, DomDonor, EvtIdentity, EvtDonor, EvtInventory, EvtRequest, EvtNotification]
    ModInventory:    [Framework, Shared, BloodKernel, Models, DomInventory, Barcode, EvtIdentity, EvtDonor, EvtInventory, EvtRequest, EvtNotification]
    ModRequest:      [Framework, Shared, BloodKernel, Models, DomRequest, EvtIdentity, EvtDonor, EvtInventory, EvtRequest, EvtNotification]
    ModNotification: [Framework, Shared, BloodKernel, Models, DomNotification, EvtIdentity, EvtDonor, EvtInventory, EvtRequest, EvtNotification]

    DomIdentity: [BloodKernel]
    DomDonor: [BloodKernel]
    DomInventory: [BloodKernel]
    DomRequest: [BloodKernel]
    DomNotification: [BloodKernel]

    EvtIdentity: ~
    EvtDonor: ~
    EvtInventory: ~
    EvtRequest: ~
    EvtNotification: ~
