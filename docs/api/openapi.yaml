        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduled_for:
                  type: string
                  format: date-time
                  nullable: true
                  description: Kosongkan untuk walk-in.
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
