  /appointments/{appointment}/donation:
    post:
      summary: Catat sesi donasi dari janji temu yang sudah diskrining
      description: >-
        Admin global, admin fasilitas donor tersebut, atau staf fasilitas
        donor tersebut. Hanya sah dari janji temu berstatus `screened`
        (skrining dulu, baru pengambilan); status lain ditolak 409
        `APPOINTMENT_TRANSITION_REJECTED`. Satu janji temu paling banyak
        satu donasi, ditegakkan unique index di database -- request kedua
        dengan Idempotency-Key berbeda untuk janji temu yang sama juga
        ditolak 409. Dalam satu transaksi: baris donasi tersimpan, janji
        temu berpindah ke `completed`, `last_donation_date` dan
        `donation_count` donor diperbarui, dan event `DonationCompleted`
        diterbitkan; kalau salah satunya gagal, semuanya batal.
        `volume_ml` 100-600 hanya kewarasan alat, bukan aturan medis.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: appointment
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID janji temu (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                volume_ml:
                  type: integer
                  minimum: 100
                  maximum: 600
                started_at:
                  type: string
                  format: date-time
                completed_at:
                  type: string
                  format: date-time
                  description: Tidak boleh sebelum `started_at`.
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
              required:
                - volume_ml
                - started_at
                - completed_at
      responses:
        '201':
          description: Donasi tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Donation'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-batches:
    get:
      summary: Daftar unit darah
      description: >-
        Butuh izin `inventory.view` (peran donor ditolak 403). Tersaring
        otomatis ke fasilitas pemegang token; operator global melihat seluruhnya.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - in: query
          name: filter[status]
          required: false
          schema:
            type: string
            enum: [quarantined, testing, released, reserved, issued, discarded, expired, separated]
        - in: query
          name: filter[component]
          required: false
          schema:
            type: string
            enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
        - in: query
          name: filter[blood_group]
          required: false
          schema:
            type: string
            enum: [A, B, AB, O]
        - in: query
          name: filter[rh_factor]
          required: false
          schema:
            type: string
            enum: [positive, negative]
      responses:
        '200':
          description: Daftar unit darah.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BloodBatch'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      summary: Daftarkan unit darah
      description: >-
        Staf/admin berfasilitas dengan izin `inventory.create`; unit menjadi
        milik fasilitas pemegang token. Unit selalu lahir `quarantined`.
        `expires_at` TIDAK dikirim klien: profil penyimpanan dipilih dari
        `storage_temperature_c`, lalu kedaluwarsa dihitung dari masa simpan
        profil itu (bulan kalender, bukan hari). Suhu yang tidak dicakup
        profil mana pun ditolak 422 `BATCH_EXPIRY_UNDETERMINABLE` tanpa
        fallback. `expires_at`, `status`, dan kunci lain di luar skema
        ditolak 422 `not_allowed`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                component:
                  type: string
                  enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
                blood_group:
                  type: string
                  enum: [A, B, AB, O]
                  nullable: true
                rh_factor:
                  type: string
                  enum: [positive, negative]
                  nullable: true
                volume_ml:
                  type: integer
                  minimum: 1
                hemoglobin_g_dl:
                  type: number
                  nullable: true
                collected_at:
                  type: string
                  format: date-time
                storage_temperature_c:
                  type: number
                  description: Suhu tempat unit benar-benar disimpan, dalam °C.
                donor_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Public ID donor (`public_id`).
              required: [component, volume_ml, collected_at, storage_temperature_c]
      responses:
        '201':
          description: Unit tercatat berstatus quarantined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodBatch'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-batches/{bloodBatch}:
    get:
      summary: Detail unit darah
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
      responses:
        '200':
          description: Unit darah.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodBatch'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /blood-batches/{bloodBatch}/status:
    patch:
      summary: Pindahkan status unit darah
      description: >-
        Transisi dijaga oleh `BatchStatus::canTransitionTo()`. Status
        `released` TIDAK PERNAH bisa dicapai lewat endpoint ini -- rilis hanya
        lewat gerbang rilis -- dan ditolak 409 `BLOOD_BATCH_TRANSITION_REJECTED`
        tanpa mengubah baris. Hal yang sama untuk `separated`: status itu
        hanya lahir lewat `POST /blood-batches/{bloodBatch}/components`.
        `discarded` wajib disertai `discard_reason`; `issued`, `discarded`,
        `expired`, dan `separated` bersifat final.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [quarantined, testing, released, reserved, issued, discarded, expired, separated]
                discard_reason:
                  type: string
                  maxLength: 255
                  description: Wajib jika dan hanya jika `status` = `discarded`.
              required: [status]
      responses:
        '200':
          description: Status unit berpindah.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodBatch'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-batches/{publicId}/barcode:
    get:
      summary: Barcode nomor unit (SVG)
      description: >-
        Barcode **Code 128** dari `batch_number`, dirender sebagai SVG di
        dalam proses (picqer/php-barcode-generator, LGPL-3.0-or-later) tanpa
        panggilan jaringan. Ini **BUKAN ISBT 128** -- standar label perbankan
        darah internasional itu berlisensi dan di luar cakupan MVP, jadi
        barcode ini tidak bisa dibaca sistem yang mengharapkan ISBT 128.

        `batch_number` berformat `BL-{FAC}-{YYMMDD}-{SEQ}{RND}{CHK}` (22
        karakter, mis. `BL-JKT1-260925-0007A9L`): `{FAC}` 4 karakter dari kode
        fasilitas (alfabet Crockford), `{SEQ}` pencacah harian per prefix,
        `{RND}` 2 karakter acak Crockford, `{CHK}` cek digit ISO 7064 MOD
        37,36. Nomor unit adalah label fisik, bukan identitas rute: unit
        dicari lewat `public_id`. Butuh izin `inventory.view` (tanpanya 403);
        unit milik fasilitas lain dijawab 404, bukan 403.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicId
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
      responses:
        '200':
          description: SVG barcode Code 128; `<desc>` memuat nomor unitnya.
          content:
            image/svg+xml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /blood-batches/{bloodBatch}/components:
    post:
      summary: Pisahkan whole blood menjadi komponen turunan
      description: >-
        Satu kantong whole blood (status `quarantined` atau `testing`, belum
        pernah dipisah, bukan turunan) menjadi N unit turunan, masing-masing
        baris sendiri yang menunjuk induknya lewat `parent_id`. Setiap turunan
        lahir `quarantined`, dengan nomor unit sendiri, dan dengan masa simpan
        dari profil suhu simpannya sendiri -- dihitung dari `collected_at`
        ASLI induk, bukan dari waktu pemisahan, sehingga turunan tidak pernah
        lebih segar dari darah asalnya (trombosit +22 °C: 5 hari; PRC +4 °C:
        35 hari; FFP -22 °C: 3 bulan). Induk menjadi `separated` dan tidak
        bisa dipisah lagi (409 `INVENTORY_SEPARATION_REJECTED`); total volume
        turunan tidak boleh melebihi volume induk. Turunan dan perubahan induk
        tersimpan bersama atau tidak sama sekali.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit induk (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                components:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      component:
                        type: string
                        enum: [packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
                      volume_ml:
                        type: integer
                        minimum: 1
                      storage_temperature_c:
                        type: number
                        description: Suhu simpan turunan ini, dalam °C.
                    required: [component, volume_ml, storage_temperature_c]
              required: [components]
      responses:
        '201':
          description: Induk ditandai separated; turunan tercatat berstatus quarantined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      parent:
                        $ref: '#/components/schemas/BloodBatch'
                      components:
                        type: array
                        items:
                          $ref: '#/components/schemas/BloodBatch'
                    required: [parent, components]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-batches/{bloodBatch}/lab-results:
    get:
      summary: Panel, hasil lab, dan vonis skrining sebuah unit
      description: >-
        Panel IMLTD fasilitas unit = seluruh uji wajib (§6.1: HIV-1/2, HBsAg,
        HCV, sifilis) ditambah uji regional (§6.2: malaria, Chagas, HTLV) yang
        di-opt-in fasilitas. `screening_verdict` hanya membaca hasil SKRINING:
        satu hasil reaktif membuat vonis `reactive` apa pun hasil konfirmasinya.
        Vonis ini hanya bacaan -- tidak merilis apa pun. Untuk komponen
        turunan, semua data dibaca dari unit asal donasinya (`source_unit_id`).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
      responses:
        '200':
          description: Data lab unit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unit_id:
                        type: string
                        format: uuid
                      source_unit_id:
                        type: string
                        format: uuid
                      panel:
                        type: array
                        items:
                          type: object
                          properties:
                            test_code:
                              type: string
                              enum: [hiv_1_2, hbsag, hcv, syphilis, malaria, chagas, htlv]
                            label:
                              type: string
                            requirement:
                              type: string
                              enum: [mandatory, regional]
                      tti_results:
                        type: array
                        items:
                          $ref: '#/components/schemas/TtiTestResult'
                      abo_rh:
                        allOf:
                          - $ref: '#/components/schemas/AboRhDetermination'
                        nullable: true
                      screening_verdict:
                        type: string
                        enum: [incomplete, all_non_reactive, reactive, indeterminate]
                    required: [unit_id, source_unit_id, panel, tti_results, abo_rh, screening_verdict]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /blood-batches/{bloodBatch}/tti-results:
    post:
      summary: Catat satu hasil uji IMLTD
      description: >-
        Dicatat di unit asal donasi (bukan komponen turunan) yang berstatus
        `quarantined`, `testing`, `separated`, atau `discarded` (uji konfirmasi
        dan uji panel lain tetap dicatat setelah skrining reaktif memusnahkan
        unit). Uji di luar panel fasilitas
        ditolak 409 `LAB_TEST_NOT_IN_PANEL`; hasil kedua untuk unit, uji, dan
        tahap yang sama ditolak 409 `LAB_RESULT_DUPLICATE`. Uji konfirmasi
        (`is_confirmatory`, §6.3) hanya sah setelah hasil skrining reaktif atau
        indeterminate untuk uji yang sama. Hasil non-reaktif tidak merilis
        unit (rilis hanya lewat `/release`). Hasil skrining reaktif memusnahkan
        unit beserta seluruh komponen turunannya (`discarded`, `discard_reason`
        menyebut kode uji); hasil konfirmasi reaktif men-deferral donor secara
        permanen. Indeterminate tidak mengubah apa pun.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                test_code:
                  type: string
                  enum: [hiv_1_2, hbsag, hcv, syphilis, malaria, chagas, htlv]
                result:
                  type: string
                  enum: [non_reactive, reactive, indeterminate]
                is_confirmatory:
                  type: boolean
                  default: false
                tested_at:
                  type: string
                  format: date-time
              required: [test_code, result, tested_at]
      responses:
        '201':
          description: Hasil tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TtiTestResult'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-batches/{bloodBatch}/abo-rh:
    post:
      summary: Tetapkan golongan ABO/Rh unit
      description: >-
        Satu penetapan per unit asal donasi; penetapan kedua ditolak 409
        `LAB_RESULT_DUPLICATE`. `blood_group` dan `rh_factor` disalin ke unit
        itu dan ke semua komponen turunannya. Status unit tidak berubah.
        Kompatibilitas golongan bukan bagian endpoint ini.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                blood_group:
                  type: string
                  enum: [A, B, AB, O]
                rh_factor:
                  type: string
                  enum: [positive, negative]
                determined_at:
                  type: string
                  format: date-time
              required: [blood_group, rh_factor, determined_at]
      responses:
        '201':
          description: Golongan tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AboRhDetermination'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-batches/{bloodBatch}/release:
    post:
      summary: Rilis unit dari karantina
      description: >-
        Gerbang rilis: satu-satunya jalan ke status `released`. Butuh izin
        `inventory.release` dan fasilitas yang sama dengan unit. Lolos hanya
        kalau seluruh uji panel skrining IMLTD fasilitas unit asal donasi
        (uji wajib + regional yang di-opt-in) punya hasil skrining dan
        semuanya non-reaktif; hasil konfirmasi tidak ikut dihitung. Komponen
        turunan membaca hasil dari unit induknya. Panel yang belum lengkap,
        reaktif, atau indeterminate, serta unit yang tidak bisa dirilis dari
        statusnya (mis. `separated`, `released`), ditolak 409
        `INVENTORY_RELEASE_REJECTED` dan statusnya tidak berubah. Badan
        permintaan kosong.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Unit dirilis; `status` = `released` dan `released_at` terisi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodBatch'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /donors:
    get:
      summary: Daftar donor (staf)
      description: >-
        Butuh izin `donor.view` (peran donor ditolak 403). Tersaring otomatis
        ke fasilitas registrasi donor pemegang token; operator global melihat
        seluruhnya. Baris nisan hasil merge tidak ikut. Baris berbentuk ringkas
        (`DonorListItem`) tanpa kontak maupun data kesehatan. `search` mencari
        nama yang mirip lewat pg_trgm dengan ambang yang sama dengan deduplikasi
        identitas. `deferral_status` dihitung dari deferral yang belum dicabut
        dan belum berakhir; permanen mengalahkan temporer.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - in: query
          name: search
          required: false
          schema:
            type: string
            maxLength: 255
          description: Nama donor (pencocokan kemiripan, bukan awalan).
        - in: query
          name: filter[blood_group]
          required: false
          schema:
            type: string
            enum: [A, B, AB, O]
        - in: query
          name: filter[rh_factor]
          required: false
          schema:
            type: string
            enum: [positive, negative]
        - in: query
          name: filter[sex]
          required: false
          schema:
            type: string
            enum: [male, female]
        - in: query
          name: filter[city]
          required: false
          schema:
            type: string
        - in: query
          name: filter[deferral_status]
          required: false
          schema:
            type: string
            enum: [none, temporary, permanent]
      responses:
        '200':
          description: Daftar donor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DonorListItem'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /deferral-reasons:
    get:
      summary: Master data alasan deferral yang aktif
      description: Read-only, tanpa paginasi. Dipakai form penempatan deferral.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Alasan deferral yang aktif.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeferralReason'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /donors/{donor}/deferrals:
    get:
      summary: Riwayat deferral seorang donor
      description: >-
        Butuh izin `donor.view` dan fasilitas yang sama dengan donor. Memuat
        deferral yang sudah dicabut atau berakhir; `filter[active]` menyaring
        ke yang masih menahan (`true`) atau yang tidak lagi (`false`).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: donor
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID donor (`public_id`).
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - in: query
          name: filter[active]
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Riwayat deferral.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deferral'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      summary: Tempatkan deferral (tindakan petugas)
      description: >-
        Butuh izin `donor.update` dan fasilitas yang sama dengan donor. Jenis,
        durasi, dan `ends_at` diturunkan dari alasan (master data), tidak
        dikirim klien; sumbernya tercatat `manual`. Kode alasan yang tidak ada
        ditolak 422; kode yang dinonaktifkan ditolak 409
        `DONOR_DEFERRAL_CONFLICT`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: donor
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID donor (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code:
                  type: string
                anchor_at:
                  type: string
                  format: date-time
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
              required: [reason_code, anchor_at]
      responses:
        '201':
          description: Deferral tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Deferral'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /deferrals/{deferral}/lift:
    patch:
      summary: Cabut deferral
      description: >-
        Butuh izin `donor.update` dan fasilitas yang sama dengan donor.
        Deferral permanen tidak bisa dicabut (409
        `DONOR_PERMANENT_DEFERRAL_NOT_LIFTABLE`); deferral yang sudah dicabut
        ditolak 409 `DONOR_DEFERRAL_ALREADY_LIFTED`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: deferral
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID deferral (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
              required: [reason]
      responses:
        '200':
          description: Deferral dicabut.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Deferral'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Token Sanctum, dikirim lewat header `Authorization: Bearer <token>`.'
  parameters:
    Cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: Cursor buram dari `meta.next_cursor` atau `meta.prev_cursor` halaman sebelumnya.
    PerPage:
      in: query
      name: per_page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Jumlah item per halaman. Nilai di luar rentang di-clamp, bukan ditolak.
    Sort:
      in: query
      name: sort
      required: false
      schema:
        type: string
      description: >-
        Nama kolom untuk mengurutkan hasil. Awali dengan `-` untuk urutan
        descending, mis. `-created_at`. Hanya kolom di allowlist endpoint yang
        diterima; kolom lain menghasilkan `VALIDATION_FAILED`.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        format: uuid
      description: >-
        Wajib untuk setiap POST/PUT/PATCH. Request dengan key yang sama dan
        body yang sama akan me-replay respons pertama; key yang sama dengan
        body berbeda ditolak dengan `IDEMPOTENCY_KEY_REUSED`.
    FacilityId:
      in: path
      name: facility
      required: true
      schema:
        type: string
        format: uuid
      description: 'Public ID fasilitas (`public_id`). ID numerik internal tidak pernah keluar ke API.'
    RequestId:
      in: header
      name: X-Request-Id
      required: false
      schema:
        type: string
        maxLength: 64
      description: >-
        ID korelasi request pilihan klien. Kalau tidak dikirim, server
        membuatnya sendiri dan mengembalikannya di header respons serta di
        `error.trace_id`.
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - INTERNAL_ERROR
        - METHOD_NOT_ALLOWED
        - TOO_MANY_REQUESTS
        - HTTP_ERROR
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - REQUEST_IN_PROGRESS
        - DONOR_DUPLICATE_NIK
        - DONOR_DUPLICATE_PHONE
        - DONOR_MERGE_CONFLICT
        - DONOR_DEFERRAL_CONFLICT
        - DONOR_DEFERRAL_ALREADY_LIFTED
        - DONOR_ACCOUNT_NOT_LINKED
        - DONOR_PERMANENT_DEFERRAL_NOT_LIFTABLE
        - APPOINTMENT_TRANSITION_REJECTED
        - BLOOD_BATCH_TRANSITION_REJECTED
        - BATCH_EXPIRY_UNDETERMINABLE
        - UNIT_NUMBER_ALLOCATION_FAILED
        - INVENTORY_SEPARATION_REJECTED
        - LAB_TEST_NOT_IN_PANEL
        - LAB_RESULT_DUPLICATE
        - LAB_RESULT_REJECTED
        - INVENTORY_RELEASE_REJECTED
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: object
              description: >
                Per field, daftar aturan yang gagal. Kosong ({}) untuk error non-validasi.
                Klien memetakan `rule` + `params` ke kalimat lokalnya sendiri; backend
                tidak pernah mengirim kalimat siap tampil.
              additionalProperties:
                type: array
                items:
                  type: object
                  required: [rule, params]
                  properties:
                    rule:
                      type: string
                      description: Nama aturan Laravel dalam snake_case, atau kunci khusus aplikasi (not_allowed, invalid_sort, unsupported_filter).
                      example: min
                    params:
                      description: >
                        Objek bernama untuk aturan yang dipetakan, larik posisional untuk sisanya.
                        Nilai leaf selalu string; `values` (in, not_in, mimes) dan `keys` (unsupported_filter) berupa list string.
                      example: { min: "8" }
            trace_id:
              type: string
              format: uuid
          required: [code, message, details, trace_id]
      required: [error]
    PaginationMeta:
      type: object
      properties:
        per_page:
          type: integer
        next_cursor:
          type: string
          nullable: true
        prev_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
      required: [per_page, next_cursor, prev_cursor, has_more]
    PaginationLinks:
      type: object
      properties:
        next:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
      required: [next, prev]
    AuthToken:
      type: object
      properties:
        token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
            role:
              type: string
          required: [id, name, email, role]
      required: [token, token_type, user]
    Facility:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [hospital, blood_bank, donation_unit, mobile_unit]
        address:
          type: string
        city:
          type: string
        province:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        is_active:
          type: boolean
      required: [id, code, name, type, address, city, province, phone, email, is_active]
    FacilityWithCoordinates:
      allOf:
        - $ref: '#/components/schemas/Facility'
        - type: object
          properties:
            latitude:
              type: number
              format: double
              nullable: true
            longitude:
              type: number
              format: double
              nullable: true
    FacilityWrite:
      type: object
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9-]{3,32}$'
          description: Otomatis di-uppercase sebelum divalidasi.
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [hospital, blood_bank, donation_unit, mobile_unit]
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        province:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Wajib untuk tipe `hospital` dan `blood_bank`.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Wajib untuk tipe `hospital` dan `blood_bank`.
      required: [code, name, type, address, city, province, phone]
    AuditLogEntry:
      type: object
      description: >-
        `changes` sudah ter-redaksi saat ditulis ([REDACTED] untuk kunci
        sensitif); kolom terenkripsi (mis. phone/email/address donor) tidak
        pernah muncul di sini sama sekali. Pembaca non-global hanya menerima
        barisnya sendiri (`actor_facility_id` miliknya).
      properties:
        id:
          type: string
          description: ID numerik internal, diekspos sebagai string opaque (audit_logs tidak punya public_id).
        auditable_type:
          type: string
        auditable_id:
          type: integer
        action:
          type: string
          enum: [created, updated, deleted]
        actor_id:
          type: integer
          nullable: true
        actor_facility_id:
          type: integer
          nullable: true
        changes:
          type: object
          properties:
            before:
              type: object
            after:
              type: object
        trace_id:
          type: string
          format: uuid
          nullable: true
        ip:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
      required: [id, auditable_type, auditable_id, action, actor_id, actor_facility_id, changes, trace_id, ip, occurred_at]
    DonorProfile:
      type: object
      description: >-
        `id` numerik internal, `nik`, `nik_hash`, dan `phone_hash` tidak
        pernah keluar ke API. NIK yang sudah terisi dilaporkan lewat
        `has_nik`, bukan nilainya sendiri.
      properties:
        id:
          type: string
          format: uuid
          description: Public ID donor (`public_id`).
        donor_number:
          type: string
        full_name:
          type: string
        date_of_birth:
          type: string
          format: date
        sex:
          type: string
          enum: [male, female]
        blood_group:
          type: string
          enum: [A, B, AB, O]
          nullable: true
        rh_factor:
          type: string
          enum: [positive, negative]
          nullable: true
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        address:
          type: string
        city:
          type: string
        weight_kg:
          type: number
          format: double
          nullable: true
        last_donation_date:
          type: string
          format: date
          nullable: true
        donation_count:
          type: integer
        has_nik:
          type: boolean
      required:
        - id
        - donor_number
        - full_name
        - date_of_birth
        - sex
        - blood_group
        - rh_factor
        - phone
        - email
        - address
        - city
        - weight_kg
        - last_donation_date
        - donation_count
        - has_nik
    EligibilitySelfCheck:
      type: object
      description: >-
        `outcome` bertiga-nilai, jangan diperas jadi boolean.
        `is_provisional` selalu true karena pemanggil anonim tidak punya
        deferral tersimpan untuk dipertimbangkan.
      properties:
        outcome:
          type: string
          enum: [eligible, not_eligible, undetermined]
        is_provisional:
          type: boolean
          enum: [true]
        retry_after_date:
          type: string
          format: date
          nullable: true
        findings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                  - AGE_BELOW_MINIMUM
                  - AGE_ABOVE_MAXIMUM
                  - DONATION_INTERVAL_NOT_MET
                  - BODY_WEIGHT_BELOW_MINIMUM
                  - ACTIVE_DEFERRAL
                  - DATA_MISSING
              outcome:
                type: string
                enum: [eligible, not_eligible, undetermined]
              retry_after_date:
                type: string
                format: date
                nullable: true
              detail:
                type: string
                nullable: true
            required: [code, outcome, retry_after_date, detail]
      required: [outcome, is_provisional, retry_after_date, findings]
    DonorScreening:
      type: object
      description: >-
        `id` numerik internal tidak pernah keluar ke API. `haemoglobin_g_dl`
        dan `temperature_c` selalu desimal (mis. 12.5, 37.6) -- penyimpanan
        internalnya integer dalam sepersepuluh satuan, tapi itu detail
        implementasi yang tidak pernah bocor ke kontrak ini.
      properties:
        id:
          type: string
          format: uuid
        haemoglobin_g_dl:
          type: number
          format: double
        systolic_mmhg:
          type: integer
        diastolic_mmhg:
          type: integer
        pulse_bpm:
          type: integer
        temperature_c:
          type: number
          format: double
        weight_kg:
          type: number
          format: double
        planned_volume_ml:
          type: integer
        passed:
          type: boolean
        findings:
          type: array
          items:
            type: string
            enum:
              - HAEMOGLOBIN_BELOW_MINIMUM
              - PULSE_OUT_OF_RANGE
              - TEMPERATURE_TOO_HIGH
              - BLOOD_PRESSURE_OUT_OF_RANGE
              - BODY_WEIGHT_BELOW_MINIMUM
        screened_at:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
      required:
        - id
        - haemoglobin_g_dl
        - systolic_mmhg
        - diastolic_mmhg
        - pulse_bpm
        - temperature_c
        - weight_kg
        - planned_volume_ml
        - passed
        - findings
        - screened_at
        - note
    Appointment:
      type: object
      description: >-
        `id` numerik internal tidak pernah keluar ke API. `scheduled_for`
        `null` berarti walk-in. Kolom waktu transisi (`arrived_at` dst.)
        hanya terisi begitu status itu benar-benar tercapai.
      properties:
        id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
          description: Public ID donor (`public_id`).
        scheduled_for:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [booked, arrived, screened, completed, no_show, cancelled]
        arrived_at:
          type: string
          format: date-time
          nullable: true
        screened_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        no_show_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
      required:
        - id
        - donor_id
        - scheduled_for
        - status
        - arrived_at
        - screened_at
        - completed_at
        - no_show_at
        - cancelled_at
        - note
    Donation:
      type: object
      description: >-
        `id` numerik internal tidak pernah keluar ke API. `screening_id`
        `null` kalau janji temu tidak punya skrining yang tertaut.
      properties:
        id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
          description: Public ID donor (`public_id`).
        appointment_id:
          type: string
          format: uuid
          description: Public ID janji temu (`public_id`).
        screening_id:
          type: string
          format: uuid
          nullable: true
          description: Public ID skrining (`public_id`).
        volume_ml:
          type: integer
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
      required:
        - id
        - donor_id
        - appointment_id
        - screening_id
        - volume_ml
        - started_at
        - completed_at
        - note
    BloodBatch:
      type: object
      description: >-
        `id` numerik internal tidak pernah keluar ke API. `expires_at` selalu
        berasal dari `storage_profile`; keduanya `null` untuk unit yang belum
        punya profil (mis. unit dari donasi yang baru dikarantina).
      properties:
        id:
          type: string
          format: uuid
        batch_number:
          type: string
        facility_id:
          type: string
          format: uuid
          description: Public ID fasilitas pemilik.
        donor_id:
          type: string
          format: uuid
          nullable: true
        component:
          type: string
          enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
        blood_group:
          type: string
          enum: [A, B, AB, O]
          nullable: true
        rh_factor:
          type: string
          enum: [positive, negative]
          nullable: true
        volume_ml:
          type: integer
        status:
          type: string
          enum: [quarantined, testing, released, reserved, issued, discarded, expired, separated]
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Public ID unit induk untuk komponen turunan (look-back); null untuk unit asal.
        collected_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Kapan unit dilepas dari karantina lewat gerbang rilis. `null` sampai
            unit dirilis; tetap terisi setelah unit pindah ke `reserved`/`issued`.
        expires_at:
          type: string
          format: date-time
          nullable: true
        storage_profile:
          type: object
          nullable: true
          properties:
            storage_temp_min_celsius:
              type: number
            storage_temp_max_celsius:
              type: number
            shelf_life_value:
              type: integer
            shelf_life_unit:
              type: string
              enum: [hours, days, months]
        discard_reason:
          type: string
          nullable: true
      required:
        - id
        - batch_number
        - facility_id
        - component
        - volume_ml
        - status
        - collected_at
    TtiTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        test_code:
          type: string
          enum: [hiv_1_2, hbsag, hcv, syphilis, malaria, chagas, htlv]
        is_confirmatory:
          type: boolean
        result:
          type: string
          enum: [non_reactive, reactive, indeterminate]
        tested_at:
          type: string
          format: date-time
      required: [id, test_code, is_confirmatory, result, tested_at]
    AboRhDetermination:
      type: object
      properties:
        id:
          type: string
          format: uuid
        blood_group:
          type: string
          enum: [A, B, AB, O]
        rh_factor:
          type: string
          enum: [positive, negative]
        determined_at:
          type: string
          format: date-time
      required: [id, blood_group, rh_factor, determined_at]
    DonorListItem:
      type: object
      description: >-
        Bentuk ringkas untuk tabel daftar donor. Sengaja tanpa phone, email,
        address, weight_kg, nik, maupun id numerik.
      properties:
        id:
          type: string
          format: uuid
        donor_number:
          type: string
        full_name:
          type: string
        sex:
          type: string
          enum: [male, female]
        blood_group:
          type: string
          enum: [A, B, AB, O]
          nullable: true
        rh_factor:
          type: string
          enum: [positive, negative]
          nullable: true
        city:
          type: string
        last_donation_date:
          type: string
          format: date
          nullable: true
        donation_count:
          type: integer
        deferral_status:
          type: string
          enum: [none, temporary, permanent]
      required: [id, donor_number, full_name, sex, city, donation_count, deferral_status]
    Deferral:
      type: object
      properties:
        id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
        reason_code:
          type: string
        reason_label:
          type: string
        type:
          type: string
          enum: [temporary, permanent]
        source:
          type: string
          enum: [manual, screening, tti_result]
        anchor_at:
          type: string
          format: date-time
        duration_value:
          type: integer
          nullable: true
        duration_unit:
          type: string
          enum: [hours, days, months, years]
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
        is_active:
          type: boolean
        lifted_at:
          type: string
          format: date-time
          nullable: true
        lift_note:
          type: string
          nullable: true
      required: [id, donor_id, reason_code, type, source, anchor_at, is_active]
    DeferralReason:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [temporary, permanent]
        default_duration_value:
          type: integer
          nullable: true
        default_duration_unit:
          type: string
          enum: [hours, days, months, years]
          nullable: true
        source_reference:
          type: string
      required: [code, label, type, source_reference]
    ReadinessReport:
      type: object
      properties:
        status:
          type: string
          enum: [ready, degraded]
        checks:
          type: object
          properties:
            database:
              type: boolean
            redis:
              type: boolean
            worker:
              type: boolean
          required: [database, redis, worker]
      required: [status, checks]
  responses:
    ValidationFailed:
      description: Validasi input gagal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Token tidak ada atau tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Token valid tapi tidak berhak atas resource ini.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request bertabrakan dengan state yang sedang berjalan (mis. Idempotency-Key yang sama masih diproses).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit terlampaui.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Kesalahan tak terduga di server. `details` selalu kosong di sini agar tidak membocorkan internal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
