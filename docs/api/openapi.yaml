        scheduled_for:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [booked, arrived, screened, completed, no_show, cancelled]
        arrived_at:
          type: string
          format: date-time
          nullable: true
        screened_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        no_show_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
      required:
        - id
        - donor_id
        - scheduled_for
        - status
        - arrived_at
        - screened_at
        - completed_at
        - no_show_at
        - cancelled_at
        - note
    Donation:
      type: object
      description: >-
        `id` numerik internal tidak pernah keluar ke API. `screening_id`
        `null` kalau janji temu tidak punya skrining yang tertaut.
      properties:
