        id:
          type: string
          format: uuid
        batch_number:
          type: string
        facility_id:
          type: string
          format: uuid
          description: Public ID fasilitas pemilik.
        donor_id:
          type: string
          format: uuid
          nullable: true
        component:
          type: string
          enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
        blood_group:
          type: string
          enum: [A, B, AB, O]
          nullable: true
        rh_factor:
          type: string
          enum: [positive, negative]
          nullable: true
        volume_ml:
          type: integer
        status:
          type: string
          enum: [quarantined, testing, released, reserved, issued, discarded, expired, separated]
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Public ID unit induk untuk komponen turunan (look-back); null untuk unit asal.
        collected_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Kapan unit dilepas dari karantina lewat gerbang rilis. `null` sampai
            unit dirilis; tetap terisi setelah unit pindah ke `reserved`/`issued`.
        expires_at:
          type: string
          format: date-time
          nullable: true
        storage_profile:
          type: object
          nullable: true
          properties:
            storage_temp_min_celsius:
              type: number
            storage_temp_max_celsius:
              type: number
            shelf_life_value:
              type: integer
            shelf_life_unit:
              type: string
              enum: [hours, days, months]
        discard_reason:
          type: string
          nullable: true
      required:
        - id
        - batch_number
        - facility_id
        - component
        - volume_ml
        - status
        - collected_at
    TtiTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        test_code:
          type: string
          enum: [hiv_1_2, hbsag, hcv, syphilis, malaria, chagas, htlv]
        is_confirmatory:
          type: boolean
        result:
          type: string
          enum: [non_reactive, reactive, indeterminate]
        tested_at:
          type: string
          format: date-time
      required: [id, test_code, is_confirmatory, result, tested_at]
    AboRhDetermination:
      type: object
      properties:
        id:
          type: string
          format: uuid
        blood_group:
          type: string
          enum: [A, B, AB, O]
        rh_factor:
          type: string
          enum: [positive, negative]
        determined_at:
          type: string
          format: date-time
      required: [id, blood_group, rh_factor, determined_at]
    DonorListItem:
      type: object
      description: >-
        Bentuk ringkas untuk tabel daftar donor. Sengaja tanpa phone, email,
        address, weight_kg, nik, maupun id numerik.
      properties:
        id:
          type: string
          format: uuid
        donor_number:
          type: string
        full_name:
          type: string
        sex:
          type: string
          enum: [male, female]
        blood_group:
          type: string
          enum: [A, B, AB, O]
          nullable: true
        rh_factor:
          type: string
          enum: [positive, negative]
          nullable: true
        city:
          type: string
        last_donation_date:
          type: string
          format: date
          nullable: true
        donation_count:
          type: integer
        deferral_status:
          type: string
          enum: [none, temporary, permanent]
      required: [id, donor_number, full_name, sex, city, donation_count, deferral_status]
    Deferral:
      type: object
      properties:
        id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
        reason_code:
          type: string
        reason_label:
          type: string
        type:
          type: string
          enum: [temporary, permanent]
        source:
          type: string
          enum: [manual, screening, tti_result]
        anchor_at:
          type: string
          format: date-time
        duration_value:
          type: integer
          nullable: true
        duration_unit:
          type: string
          enum: [hours, days, months, years]
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
        is_active:
          type: boolean
        lifted_at:
          type: string
          format: date-time
          nullable: true
        lift_note:
          type: string
          nullable: true
      required: [id, donor_id, reason_code, type, source, anchor_at, is_active]
    DeferralReason:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [temporary, permanent]
        default_duration_value:
          type: integer
          nullable: true
        default_duration_unit:
          type: string
          enum: [hours, days, months, years]
          nullable: true
        source_reference:
          type: string
      required: [code, label, type, source_reference]
    ReadinessReport:
      type: object
      properties:
        status:
          type: string
          enum: [ready, degraded]
        checks:
          type: object
          properties:
            database:
              type: boolean
            redis:
              type: boolean
            worker:
              type: boolean
          required: [database, redis, worker]
      required: [status, checks]
  responses:
    ValidationFailed:
      description: Validasi input gagal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Token tidak ada atau tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Token valid tapi tidak berhak atas resource ini.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request bertabrakan dengan state yang sedang berjalan (mis. Idempotency-Key yang sama masih diproses).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit terlampaui.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Kesalahan tak terduga di server. `details` selalu kosong di sini agar tidak membocorkan internal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
