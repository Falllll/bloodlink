                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      summary: Daftarkan unit darah
      description: >-
        Staf/admin berfasilitas dengan izin `inventory.create`; unit menjadi
        milik fasilitas pemegang token. Unit selalu lahir `quarantined`.
        `expires_at` TIDAK dikirim klien: profil penyimpanan dipilih dari
        `storage_temperature_c`, lalu kedaluwarsa dihitung dari masa simpan
        profil itu (bulan kalender, bukan hari). Suhu yang tidak dicakup
        profil mana pun ditolak 422 `BATCH_EXPIRY_UNDETERMINABLE` tanpa
        fallback. `expires_at`, `status`, dan kunci lain di luar skema
        ditolak 422 `not_allowed`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                component:
                  type: string
                  enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
                blood_group:
                  type: string
                  enum: [A, B, AB, O]
                  nullable: true
                rh_factor:
                  type: string
                  enum: [positive, negative]
                  nullable: true
                volume_ml:
                  type: integer
                  minimum: 1
                hemoglobin_g_dl:
                  type: number
                  nullable: true
                collected_at:
                  type: string
                  format: date-time
                storage_temperature_c:
                  type: number
                  description: Suhu tempat unit benar-benar disimpan, dalam °C.
                donor_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Public ID donor (`public_id`).
              required: [component, volume_ml, collected_at, storage_temperature_c]
      responses:
        '201':
          description: Unit tercatat berstatus quarantined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodBatch'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-batches/{bloodBatch}:
    get:
      summary: Detail unit darah
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
      responses:
        '200':
          description: Unit darah.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodBatch'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /blood-batches/{bloodBatch}/status:
    patch:
      summary: Pindahkan status unit darah
      description: >-
        Transisi dijaga oleh `BatchStatus::canTransitionTo()`. Status
        `released` TIDAK PERNAH bisa dicapai lewat endpoint ini -- rilis hanya
        lewat gerbang rilis -- dan ditolak 409 `BLOOD_BATCH_TRANSITION_REJECTED`
        tanpa mengubah baris. Hal yang sama untuk `separated`: status itu
        hanya lahir lewat `POST /blood-batches/{bloodBatch}/components`.
        `discarded` wajib disertai `discard_reason`; `issued`, `discarded`,
        `expired`, dan `separated` bersifat final.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [quarantined, testing, released, reserved, issued, discarded, expired, separated]
                discard_reason:
                  type: string
                  maxLength: 255
                  description: Wajib jika dan hanya jika `status` = `discarded`.
              required: [status]
      responses:
        '200':
          description: Status unit berpindah.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodBatch'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-batches/{publicId}/barcode:
    get:
      summary: Barcode nomor unit (SVG)
      description: >-
        Barcode **Code 128** dari `batch_number`, dirender sebagai SVG di
        dalam proses (picqer/php-barcode-generator, LGPL-3.0-or-later) tanpa
        panggilan jaringan. Ini **BUKAN ISBT 128** -- standar label perbankan
        darah internasional itu berlisensi dan di luar cakupan MVP, jadi
        barcode ini tidak bisa dibaca sistem yang mengharapkan ISBT 128.

        `batch_number` berformat `BL-{FAC}-{YYMMDD}-{SEQ}{RND}{CHK}` (22
        karakter, mis. `BL-JKT1-260925-0007A9L`): `{FAC}` 4 karakter dari kode
        fasilitas (alfabet Crockford), `{SEQ}` pencacah harian per prefix,
        `{RND}` 2 karakter acak Crockford, `{CHK}` cek digit ISO 7064 MOD
        37,36. Nomor unit adalah label fisik, bukan identitas rute: unit
        dicari lewat `public_id`. Butuh izin `inventory.view` (tanpanya 403);
        unit milik fasilitas lain dijawab 404, bukan 403.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicId
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
      responses:
        '200':
          description: SVG barcode Code 128; `<desc>` memuat nomor unitnya.
          content:
            image/svg+xml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /blood-batches/{bloodBatch}/components:
    post:
      summary: Pisahkan whole blood menjadi komponen turunan
      description: >-
        Satu kantong whole blood (status `quarantined` atau `testing`, belum
        pernah dipisah, bukan turunan) menjadi N unit turunan, masing-masing
        baris sendiri yang menunjuk induknya lewat `parent_id`. Setiap turunan
        lahir `quarantined`, dengan nomor unit sendiri, dan dengan masa simpan
        dari profil suhu simpannya sendiri -- dihitung dari `collected_at`
        ASLI induk, bukan dari waktu pemisahan, sehingga turunan tidak pernah
        lebih segar dari darah asalnya (trombosit +22 °C: 5 hari; PRC +4 °C:
        35 hari; FFP -22 °C: 3 bulan). Induk menjadi `separated` dan tidak
        bisa dipisah lagi (409 `INVENTORY_SEPARATION_REJECTED`); total volume
        turunan tidak boleh melebihi volume induk. Turunan dan perubahan induk
        tersimpan bersama atau tidak sama sekali.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit induk (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                components:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      component:
                        type: string
                        enum: [packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
                      volume_ml:
                        type: integer
                        minimum: 1
                      storage_temperature_c:
                        type: number
                        description: Suhu simpan turunan ini, dalam °C.
                    required: [component, volume_ml, storage_temperature_c]
              required: [components]
      responses:
        '201':
          description: Induk ditandai separated; turunan tercatat berstatus quarantined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      parent:
                        $ref: '#/components/schemas/BloodBatch'
                      components:
                        type: array
                        items:
                          $ref: '#/components/schemas/BloodBatch'
                    required: [parent, components]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-batches/{bloodBatch}/lab-results:
    get:
      summary: Panel, hasil lab, dan vonis skrining sebuah unit
      description: >-
        Panel IMLTD fasilitas unit = seluruh uji wajib (§6.1: HIV-1/2, HBsAg,
        HCV, sifilis) ditambah uji regional (§6.2: malaria, Chagas, HTLV) yang
        di-opt-in fasilitas. `screening_verdict` hanya membaca hasil SKRINING:
        satu hasil reaktif membuat vonis `reactive` apa pun hasil konfirmasinya.
        Vonis ini hanya bacaan -- tidak merilis apa pun. Untuk komponen
        turunan, semua data dibaca dari unit asal donasinya (`source_unit_id`).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
      responses:
        '200':
          description: Data lab unit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unit_id:
                        type: string
                        format: uuid
                      source_unit_id:
                        type: string
                        format: uuid
                      panel:
                        type: array
                        items:
                          type: object
                          properties:
                            test_code:
                              type: string
                              enum: [hiv_1_2, hbsag, hcv, syphilis, malaria, chagas, htlv]
                            label:
                              type: string
                            requirement:
                              type: string
                              enum: [mandatory, regional]
                      tti_results:
                        type: array
                        items:
                          $ref: '#/components/schemas/TtiTestResult'
                      abo_rh:
                        allOf:
                          - $ref: '#/components/schemas/AboRhDetermination'
                        nullable: true
                      screening_verdict:
                        type: string
                        enum: [incomplete, all_non_reactive, reactive, indeterminate]
                    required: [unit_id, source_unit_id, panel, tti_results, abo_rh, screening_verdict]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /blood-batches/{bloodBatch}/tti-results:
    post:
      summary: Catat satu hasil uji IMLTD
      description: >-
        Dicatat di unit asal donasi (bukan komponen turunan) yang berstatus
        `quarantined`, `testing`, `separated`, atau `discarded` (uji konfirmasi
        dan uji panel lain tetap dicatat setelah skrining reaktif memusnahkan
        unit). Uji di luar panel fasilitas
        ditolak 409 `LAB_TEST_NOT_IN_PANEL`; hasil kedua untuk unit, uji, dan
        tahap yang sama ditolak 409 `LAB_RESULT_DUPLICATE`. Uji konfirmasi
        (`is_confirmatory`, §6.3) hanya sah setelah hasil skrining reaktif atau
        indeterminate untuk uji yang sama. Hasil non-reaktif tidak merilis
        unit (rilis hanya lewat `/release`). Hasil skrining reaktif memusnahkan
        unit beserta seluruh komponen turunannya (`discarded`, `discard_reason`
        menyebut kode uji); hasil konfirmasi reaktif men-deferral donor secara
        permanen. Indeterminate tidak mengubah apa pun.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                test_code:
                  type: string
                  enum: [hiv_1_2, hbsag, hcv, syphilis, malaria, chagas, htlv]
                result:
                  type: string
                  enum: [non_reactive, reactive, indeterminate]
                is_confirmatory:
                  type: boolean
                  default: false
                tested_at:
                  type: string
                  format: date-time
              required: [test_code, result, tested_at]
      responses:
        '201':
          description: Hasil tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TtiTestResult'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-batches/{bloodBatch}/abo-rh:
    post:
      summary: Tetapkan golongan ABO/Rh unit
      description: >-
        Satu penetapan per unit asal donasi; penetapan kedua ditolak 409
        `LAB_RESULT_DUPLICATE`. `blood_group` dan `rh_factor` disalin ke unit
        itu dan ke semua komponen turunannya. Status unit tidak berubah.
        Kompatibilitas golongan bukan bagian endpoint ini.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                blood_group:
                  type: string
                  enum: [A, B, AB, O]
                rh_factor:
                  type: string
                  enum: [positive, negative]
                determined_at:
                  type: string
                  format: date-time
              required: [blood_group, rh_factor, determined_at]
      responses:
        '201':
          description: Golongan tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AboRhDetermination'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /blood-batches/{bloodBatch}/release:
    post:
      summary: Rilis unit dari karantina
      description: >-
        Gerbang rilis: satu-satunya jalan ke status `released`. Butuh izin
        `inventory.release` dan fasilitas yang sama dengan unit. Lolos hanya
        kalau seluruh uji panel skrining IMLTD fasilitas unit asal donasi
        (uji wajib + regional yang di-opt-in) punya hasil skrining dan
        semuanya non-reaktif; hasil konfirmasi tidak ikut dihitung. Komponen
        turunan membaca hasil dari unit induknya. Panel yang belum lengkap,
        reaktif, atau indeterminate, serta unit yang tidak bisa dirilis dari
        statusnya (mis. `separated`, `released`), ditolak 409
        `INVENTORY_RELEASE_REJECTED` dan statusnya tidak berubah. Badan
        permintaan kosong.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bloodBatch
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID unit (`public_id`).
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Unit dirilis; `status` = `released` dan `released_at` terisi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BloodBatch'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /storage-locations:
    get:
      summary: Daftar lokasi penyimpanan
      description: >-
        Lemari pendingin, freezer, dan agitator yang nyata. Tersaring otomatis
        ke fasilitas pemegang token; operator global melihat seluruhnya.
        Butuh `inventory.view`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [code, -code, created_at, -created_at]
        - in: query
          name: filter[kind]
          required: false
          schema:
            type: string
            enum: [refrigerator, freezer, deep_freezer, platelet_agitator, ambient_shelf]
        - in: query
          name: filter[purpose]
          required: false
          schema:
            type: string
            enum: [untested, reactive, indeterminate, release_ready, general]
        - in: query
          name: filter[is_active]
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar lokasi penyimpanan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StorageLocation'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Daftarkan lokasi penyimpanan
      description: >-
        Lokasi selalu milik fasilitas pemegang token (`facility_id` di body
        ditolak 422 `not_allowed`); operator global tanpa fasilitas ditolak 403.
        Band suhu adalah milik alat ini, terpisah dari band referensi per
        komponen. Rentang `-80..40` hanya kewarasan instrumen, bukan ambang
        medis. `code` unik per fasilitas. Butuh `inventory.create`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  maxLength: 32
                label:
                  type: string
                  maxLength: 255
                kind:
                  type: string
                  enum: [refrigerator, freezer, deep_freezer, platelet_agitator, ambient_shelf]
                purpose:
                  type: string
                  enum: [untested, reactive, indeterminate, release_ready, general]
                temp_min_celsius:
                  type: number
                  minimum: -80
                  maximum: 40
                temp_max_celsius:
                  type: number
                  minimum: -80
                  maximum: 40
                  description: Harus `>= temp_min_celsius`.
              required: [code, label, kind, purpose, temp_min_celsius, temp_max_celsius]
      responses:
        '201':
          description: Lokasi tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StorageLocation'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /storage-locations/{storageLocation}/temperature-readings:
    parameters:
      - in: path
        name: storageLocation
        required: true
        schema:
          type: string
          format: uuid
        description: Public ID lokasi (`public_id`).
    get:
      summary: Riwayat pembacaan suhu satu lokasi
      description: >-
        `is_out_of_range` adalah penilaian yang DISIMPAN saat pembacaan
        dicatat, terhadap band yang berlaku saat itu; merevisi band kemudian
        tidak mengubahnya. Lokasi fasilitas lain dibalas 403. Butuh
        `inventory.view`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [recorded_at, -recorded_at]
        - in: query
          name: filter[is_out_of_range]
          required: false
          schema:
            type: boolean
        - in: query
          name: filter[source]
          required: false
          schema:
            type: string
            enum: [manual, device]
      responses:
        '200':
          description: Riwayat pembacaan suhu.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StorageTemperatureReading'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Catat satu pembacaan suhu
      description: >-
        Pembacaan di luar band lokasi TETAP dibalas 201 -- ia sah dan wajib
        tersimpan -- dengan `is_out_of_range: true`, dan memancarkan event
        domain `StorageTemperatureOutOfRange` (pengiriman alert belum ada).
        Band inklusif di kedua ujung: tepat di `temp_min_celsius` atau
        `temp_max_celsius` masih di dalam rentang. Nilai disimpan dengan satu
        desimal dan dinilai sebagai nilai yang tersimpan. Rentang `-80..40`
        hanya kewarasan instrumen. Lokasi fasilitas lain dibalas 403 tanpa
        baris tersimpan. Butuh `inventory.create`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reading_celsius:
                  type: number
                  minimum: -80
                  maximum: 40
                source:
                  type: string
                  enum: [manual, device]
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
              required: [reading_celsius, source]
      responses:
        '201':
          description: Pembacaan tercatat, di dalam maupun di luar rentang.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StorageTemperatureReading'
                  meta:
                    type: object
