name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Id job `check` ADALAH nama required status check di ruleset branch (lihat
  # bloodlink/docs/branch-protection.md). Jangan tambahkan kunci `name:` di sini:
  # check-nya akan dilaporkan dengan nama itu dan setiap PR menggantung selamanya.
  check:
    runs-on: ubuntu-latest

    # Termurah dan terfatal dulu, urutan yang sama dengan CI backend.
    steps:
      # Setiap action dipin ke SHA commit, versi di komentar: tag bisa dipindah
      # pemiliknya, SHA tidak. Dependabot (github-actions) yang menaikkan keduanya.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Secret scan
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          detect --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact --exit-code 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Ambang yang DISENGAJA (kartu 698): hanya advisory CRITICAL di dependensi
      # RUNTIME yang memblokir merge. Advisory high kebanyakan ada di tooling build
      # (eslint, rantai CLI shadcn) yang tidak pernah dikirim ke pengguna dan sering
      # tanpa fix non-mayor; gerbang yang merah terus akan dimatikan orang dalam dua
      # minggu. Semua di bawah critical datang sebagai PR Dependabot mingguan.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical

      # Next membangkitkan LayoutProps/PageProps dan tipe rute ke .next/ saat build.
      # Di checkout bersih tipe itu belum ada, jadi tsc wajib didahului typegen --
      # tanpanya tsc merah di setiap PR (dan hijau di lokal hanya karena sisa .next/).
      - name: Route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: i18n messages
        run: npm run i18n:check

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
