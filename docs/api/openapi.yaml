        - bearerAuth: []
      parameters:
        - in: path
          name: donor
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID donor (`public_id`). ID numerik internal tidak pernah keluar ke API.
        - $ref: '#/components/parameters/IdempotencyKey'
