        started_at:
          type: string
          format: date-time
        stage_entered_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        end_reason:
          type: string
          nullable: true
          enum: [request_fulfilled, request_cancelled, request_expired, stages_exhausted, stopped_manually, null]
        stages:
          type: array
          items:
            type: object
            properties:
              radius_meters:
                type: integer
              contacted:
                type: integer
              accepted:
                type: integer
              declined:
                type: integer
