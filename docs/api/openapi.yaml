          description: Penilaian tersimpan terhadap band yang berlaku saat dicatat.
        source:
          type: string
          enum: [manual, device]
        note:
          type: string
          nullable: true
        recorded_at:
          type: string
          format: date-time
      required: [storage_location_id, reading_celsius, is_out_of_range, source, note, recorded_at]
    StockTransfer:
      type: object
      description: >-
        Perpindahan satu unit antar fasilitas. Selama transfer terbuka unit
        tetap `released` dan tetap milik fasilitas asal; baris transfer inilah
        yang menahannya dari alokasi ganda. `id` numerik internal dan pengguna
        yang meminta/memutuskan tidak pernah keluar ke API.
      properties:
        id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
          description: Public ID unit (`public_id`).
        from_facility_id:
          type: string
          format: uuid
          description: Fasilitas asal (pemilik unit).
        to_facility_id:
          type: string
          format: uuid
          description: Fasilitas tujuan (peminta).
        status:
          type: string
          enum: [requested, approved, rejected, shipped, received, cancelled]
        reason:
          type: string
          nullable: true
        decision_note:
          type: string
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        rejected_at:
          type: string
          format: date-time
          nullable: true
        shipped_at:
          type: string
          format: date-time
          nullable: true
        received_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
      required: [id, unit_id, from_facility_id, to_facility_id, status, reason, decision_note, approved_at, rejected_at, shipped_at, received_at, cancelled_at]
    BloodRequest:
      type: object
      description: >-
        Apa yang DIMINTA satu fasilitas, bukan apa yang dialokasikan untuknya.
        `id` numerik internal dan pengguna peminta tidak pernah keluar ke API.
      properties:
        id:
          type: string
          format: uuid
        facility_id:
          type: string
          format: uuid
          description: Fasilitas peminta (`public_id`).
        patient_reference:
          type: string
          description: Rujukan internal rumah sakit, bukan identitas pasien.
        component:
          type: string
          enum: [whole_blood, packed_red_cells, fresh_frozen_plasma, platelet_concentrate, cryoprecipitate]
        blood_group:
          type: string
          enum: [A, B, AB, O]
        rh_factor:
          type: string
          enum: [positive, negative]
        quantity:
          type: integer
        urgency:
          type: string
          enum: [routine, urgent, emergency]
        status:
          type: string
          enum: [open, partially_fulfilled, fulfilled, cancelled, expired]
          description: >-
            `partially_fulfilled`/`fulfilled` mengikuti jumlah alokasi aktif;
            `cancelled` dan `expired` terminal.
        needed_by:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        cancel_reason:
          type: string
          nullable: true
          description: Terisi bersama `cancelled_at`, atau keduanya null.
      required: [id, facility_id, patient_reference, component, blood_group, rh_factor, quantity, urgency, status, needed_by, note, cancelled_at, cancel_reason]
    BloodRequestAllocation:
      type: object
      description: >-
        Satu unit yang dialokasikan untuk satu permintaan. Aktif selama
        `released_at` null. `id` numerik internal dan pengguna yang
        mengalokasikan tidak pernah keluar ke API.
      properties:
        id:
          type: string
          format: uuid
        blood_request_id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        allocated_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
          nullable: true
        release_reason:
          type: string
          nullable: true
        reserved_at:
          type: string
          format: date-time
          nullable: true
          description: Terisi selama unitnya dipesan untuk permintaan ini.
        reservation_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Selalu terisi bersama `reserved_at`, dan kosong bersamanya.
        reservation_release_reason:
          type: string
          nullable: true
          description: Alasan reservasi terakhir dilepas (mis. `reservation timeout`).
      required: [id, blood_request_id, unit_id, allocated_at, released_at, release_reason, reserved_at, reservation_expires_at, reservation_release_reason]
    Crossmatch:
      type: object
      description: >-
        Satu hasil uji silang antara sampel pasien dan satu kantong. Append-only.
        `inconclusive` berarti periksa ulang, bukan tarik unit. `id` numerik
        internal dan petugas pemeriksa tidak pernah keluar ke API.
      properties:
        id:
          type: string
          format: uuid
        allocation_id:
          type: string
          format: uuid
        result:
          type: string
          enum: [compatible, incompatible, inconclusive]
        method:
          type: string
          nullable: true
          description: Teks bebas untuk jejak audit; tidak dipakai memutuskan.
        note:
          type: string
          nullable: true
        performed_at:
          type: string
          format: date-time
      required: [id, allocation_id, result, method, note, performed_at]
    DonorCampaign:
      type: object
      description: Ringkasan agregat satu kampanye. SENGAJA tanpa identitas donor.
