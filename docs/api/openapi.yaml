          description: Kampanye dimulai.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DonorCampaign'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      summary: Ringkasan kampanye terbaru untuk permintaan ini
      description: >-
        AGREGAT saja -- tahap sekarang dan jumlah dihubungi/menerima/menolak
        per tahap. Tidak pernah memuat identitas donor.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ringkasan kampanye.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DonorCampaign'
