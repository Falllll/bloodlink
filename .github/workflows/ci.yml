name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: bloodlink
          POSTGRES_USER: bloodlink
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bloodlink -d bloodlink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v7

      - name: Secret scan
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          detect --source=/repo --no-banner --redact --exit-code 1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, pcntl, bcmath
          coverage: none

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: No duplicate env keys
        run: |
          dupes=$(grep -oE '^[A-Z_][A-Z0-9_]*=' .env.example | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Keys yang duplikat di .env.example:"; echo "$dupes"; exit 1
          fi

      - name: Format check
        run: ./vendor/bin/pint --test

      - name: Module boundaries
        run: ./vendor/bin/deptrac analyse --fail-on-uncovered

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse

      - name: Tests
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          REDIS_HOST: 127.0.0.1