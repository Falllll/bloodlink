openapi: 3.0.3
info:
  title: BloodLink API
  version: 1.0.0
  description: |
    API headless untuk sistem manajemen bank darah BloodLink. Setiap respons
    error mengikuti amplop `Error` di bawah, dengan `error.code` sebagai
    satu-satunya nilai yang boleh dipakai klien untuk bercabang logika.
    `error.message` hanya untuk keperluan baca manusia (log, debugging) dan
    isinya bisa berubah kapan saja tanpa dianggap breaking change.
    Setiap endpoint daftar tersaring otomatis ke fasilitas pemegang token, dan
    akses lintas fasilitas dibalas `FORBIDDEN` 403 — kecuali endpoint master
    data `/facilities`, yang menampilkan seluruh fasilitas ke semua pengguna
    terautentikasi dan membatasi hanya operasi tulis lewat role `admin`.
servers:
  - url: http://localhost:8000/api/v1
    description: Local
  - url: http://localhost:8000
    description: Local (health check, di luar prefix /api/v1)
paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Endpoint di luar prefix /api/v1. Menandakan proses aplikasi hidup.
      servers:
        - url: http://localhost:8000
          description: Local (health check, di luar prefix /api/v1)
      responses:
        '200':
          description: Aplikasi hidup.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                required: [status]
  /health/ready:
    get:
      summary: Readiness probe
      description: >-
        Endpoint di luar prefix /api/v1. Memeriksa database, redis, dan
        heartbeat worker. Mengembalikan 503 saat salah satu pemeriksaan gagal
        (degraded), bukan hanya saat semuanya gagal.
      servers:
        - url: http://localhost:8000
          description: Local (health check, di luar prefix /api/v1)
      responses:
        '200':
          description: Semua pemeriksaan lolos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
        '503':
          description: Satu atau lebih pemeriksaan gagal (degraded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
  /auth/register:
    post:
      summary: Registrasi donor baru
      description: Membuat user baru dengan role `donor` dan langsung menerbitkan token akses.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
              required: [name, email, password, password_confirmation]
      responses:
        '200':
          description: Registrasi berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthToken'
                  meta:
                    type: object
                required: [data, meta]
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/login:
    post:
      summary: Login
      description: Menukar email dan password dengan token akses. Dibatasi 5 percobaan per menit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Login berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthToken'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      summary: Logout
      description: Mencabut hanya token yang dipakai request ini, bukan seluruh token milik user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Logout berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /audit-logs:
    get:
      summary: Daftar audit log
      description: >-
        Read-only. Pembaca tanpa fasilitas (operator global) melihat seluruh
        baris; pembaca ber-fasilitas hanya melihat baris dengan
        `actor_facility_id` miliknya sendiri. Hanya method `GET` yang ada
        untuk path ini.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - in: query
          name: occurred_from
          required: false
          schema:
            type: string
            format: date-time
          description: Batas bawah `occurred_at`, inklusif.
        - in: query
          name: occurred_to
          required: false
          schema:
            type: string
            format: date-time
          description: Batas atas `occurred_at`, inklusif. Harus >= `occurred_from`.
        - in: query
          name: filter[auditable_type]
          required: false
          schema:
            type: string
          description: Filter persamaan pada `auditable_type`.
        - in: query
          name: filter[auditable_id]
          required: false
          schema:
            type: integer
          description: Filter persamaan pada `auditable_id`.
        - in: query
          name: filter[action]
          required: false
          schema:
            type: string
            enum: [created, updated, deleted]
          description: Filter persamaan pada `action`.
        - in: query
          name: filter[actor_id]
          required: false
          schema:
            type: integer
          description: Filter persamaan pada `actor_id`.
        - in: query
          name: filter[actor_facility_id]
          required: false
          schema:
            type: integer
          description: Filter persamaan pada `actor_facility_id`.
        - in: query
          name: filter[trace_id]
          required: false
          schema:
            type: string
            format: uuid
          description: Filter persamaan pada `trace_id`.
      responses:
        '200':
          description: Daftar baris audit log yang boleh dilihat pemegang token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /eligibility/self-check:
    post:
      summary: Cek kelayakan donor mandiri (anonim)
      description: >-
        Endpoint publik, tanpa token dan tanpa Idempotency-Key. Tidak
        menerima identitas (nik/phone ditolak) dan tidak menulis baris
        apa pun -- stateless. Deferral donor terdaftar tidak ikut
        dipertimbangkan (pemanggil anonim), jadi respons selalu memuat
        `is_provisional: true`. Dibatasi 20 permintaan per menit per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date_of_birth:
                  type: string
                  format: date
                sex:
                  type: string
                  enum: [male, female]
                weight_kg:
                  type: number
                  format: double
                  minimum: 20
                  maximum: 300
                  nullable: true
                last_donation_date:
                  type: string
                  format: date
                  nullable: true
                planned_volume_ml:
                  type: integer
                  enum: [350, 450]
                  nullable: true
              required: [date_of_birth, sex]
      responses:
        '200':
          description: Hasil pemeriksaan kelayakan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EligibilitySelfCheck'
                  meta:
                    type: object
                required: [data, meta]
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /facilities:
    get:
      summary: Daftar fasilitas
      description: Master data seluruh fasilitas, tidak tersaring ke fasilitas pemegang token.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Daftar fasilitas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Facility'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, links, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      summary: Daftarkan fasilitas baru
      description: Hanya role `admin`. `code` di-uppercase otomatis dan wajib unik.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityWrite'
      responses:
        '201':
          description: Fasilitas dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Facility'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /facilities/{facility}:
    get:
      summary: Detail fasilitas
      description: >-
        Admin bisa melihat fasilitas mana pun; peran lain hanya fasilitas
        aktif atau fasilitas miliknya sendiri.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: Detail fasilitas berikut koordinat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FacilityWithCoordinates'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Perbarui fasilitas
      description: Hanya role `admin`. Semua field opsional; hanya yang dikirim yang diperbarui.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityWrite'
      responses:
        '200':
          description: Fasilitas diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Facility'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /facilities/{facility}/deactivate:
    patch:
      summary: Nonaktifkan fasilitas
      description: Mengubah `is_active` menjadi `false`. Baris tidak dihapus.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Fasilitas dinonaktifkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Facility'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /donors/merge:
    post:
      summary: Gabungkan dua baris donor duplikat
      description: >-
        Hanya role `admin`. Baris `source_id` ditandai `merged_into_id` ke
        `target_id` dan tetap ada; `target_id` mewarisi `last_donation_date`
        terbaru, `donation_count` gabungan, seluruh baris `deferrals` milik
        sumber dipindahkan ke target, serta NIK/email dari sumber kalau
        miliknya masih kosong.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_id:
                  type: string
                  format: uuid
                  description: Public ID baris donor yang akan ditandai sebagai duplikat.
                target_id:
                  type: string
                  format: uuid
                  description: Public ID baris donor kanonik yang akan mewarisi data sumber.
              required: [source_id, target_id]
      responses:
        '200':
          description: Kedua donor berhasil digabungkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Public ID donor kanonik (target).
                      merged_id:
                        type: string
                        format: uuid
                        description: Public ID donor sumber, sekarang menunjuk ke id lewat merged_into_id.
                    required: [id, merged_id]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /donors/{donor}/consents:
    post:
      summary: Rekam consent donor
      description: >-
        Admin global, admin fasilitas donor tersebut, atau staf fasilitas
        donor tersebut. Consent aktif sebelumnya (kalau ada) otomatis
        dicabut sebelum baris baru dibuat.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: donor
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID donor (`public_id`). ID numerik internal tidak pernah keluar ke API.
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purposes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [donation, health_screening, contact_for_urgent_request, data_retention]
              required: [purposes]
      responses:
        '201':
          description: Consent tercatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Public ID baris consent.
                      purposes:
                        type: array
                        items:
                          type: string
                          enum: [donation, health_screening, contact_for_urgent_request, data_retention]
                      granted_at:
                        type: string
                        format: date-time
                    required: [id, purposes, granted_at]
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /donors/{donor}:
    get:
      summary: Detail profil donor
      description: Admin global, admin fasilitas donor tersebut, atau staf fasilitas donor tersebut.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: donor
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID donor (`public_id`). ID numerik internal tidak pernah keluar ke API.
      responses:
        '200':
          description: Detail profil donor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DonorProfile'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Perbarui profil donor
      description: >-
        Admin global, admin fasilitas donor tersebut, atau staf fasilitas
        donor tersebut. Semua field opsional; hanya yang dikirim yang
        diperbarui. NIK hanya boleh diisi sekali saat masih kosong --
        mengubah NIK yang sudah terisi ditolak 422 (`nik_not_changeable`).
        `date_of_birth` dan `sex` sengaja tidak bisa diubah lewat endpoint
        ini.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: donor
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID donor (`public_id`). ID numerik internal tidak pernah keluar ke API.
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  maxLength: 255
                nik:
                  type: string
                  description: Tepat 16 digit. Hanya bisa diisi sekali saat masih kosong.
                phone:
                  type: string
                  maxLength: 32
                email:
                  type: string
                  format: email
                  maxLength: 255
                  nullable: true
                address:
                  type: string
                  maxLength: 255
                city:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Profil donor diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DonorProfile'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /donors/{donor}/health-status:
    patch:
      summary: Perbarui status kesehatan donor
      description: >-
        Admin global, admin fasilitas donor tersebut, atau staf fasilitas
        donor tersebut. `weight_kg` hanya divalidasi terhadap kewarasan
        fisik (20-300 kg), bukan terhadap ambang kelayakan donor
        (Rujukan Pedoman Medis §3.2) -- keputusan kelayakan adalah urusan
        mesin eligibility, bukan lapisan request ini.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: donor
          required: true
          schema:
            type: string
            format: uuid
          description: Public ID donor (`public_id`). ID numerik internal tidak pernah keluar ke API.
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weight_kg:
                  type: number
                  format: double
                  minimum: 20
                  maximum: 300
                blood_group:
                  type: string
                  enum: [A, B, AB, O]
                  nullable: true
                rh_factor:
                  type: string
                  enum: [positive, negative]
                  nullable: true
      responses:
        '200':
          description: Status kesehatan donor diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DonorProfile'
                  meta:
                    type: object
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Token Sanctum, dikirim lewat header `Authorization: Bearer <token>`.'
  parameters:
    Cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: Cursor buram dari `meta.next_cursor` atau `meta.prev_cursor` halaman sebelumnya.
    PerPage:
      in: query
      name: per_page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Jumlah item per halaman. Nilai di luar rentang di-clamp, bukan ditolak.
    Sort:
      in: query
      name: sort
      required: false
      schema:
        type: string
      description: >-
        Nama kolom untuk mengurutkan hasil. Awali dengan `-` untuk urutan
        descending, mis. `-created_at`. Hanya kolom di allowlist endpoint yang
        diterima; kolom lain menghasilkan `VALIDATION_FAILED`.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        format: uuid
      description: >-
        Wajib untuk setiap POST/PUT/PATCH. Request dengan key yang sama dan
        body yang sama akan me-replay respons pertama; key yang sama dengan
        body berbeda ditolak dengan `IDEMPOTENCY_KEY_REUSED`.
    FacilityId:
      in: path
      name: facility
      required: true
      schema:
        type: string
        format: uuid
      description: 'Public ID fasilitas (`public_id`). ID numerik internal tidak pernah keluar ke API.'
    RequestId:
      in: header
      name: X-Request-Id
      required: false
      schema:
        type: string
        maxLength: 64
      description: >-
        ID korelasi request pilihan klien. Kalau tidak dikirim, server
        membuatnya sendiri dan mengembalikannya di header respons serta di
        `error.trace_id`.
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - INTERNAL_ERROR
        - METHOD_NOT_ALLOWED
        - TOO_MANY_REQUESTS
        - HTTP_ERROR
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - REQUEST_IN_PROGRESS
        - DONOR_DUPLICATE_NIK
        - DONOR_DUPLICATE_PHONE
        - DONOR_MERGE_CONFLICT
        - DONOR_DEFERRAL_CONFLICT
        - DONOR_DEFERRAL_ALREADY_LIFTED
        - DONOR_PERMANENT_DEFERRAL_NOT_LIFTABLE
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: object
              description: >
                Per field, daftar aturan yang gagal. Kosong ({}) untuk error non-validasi.
                Klien memetakan `rule` + `params` ke kalimat lokalnya sendiri; backend
                tidak pernah mengirim kalimat siap tampil.
              additionalProperties:
                type: array
                items:
                  type: object
                  required: [rule, params]
                  properties:
                    rule:
                      type: string
                      description: Nama aturan Laravel dalam snake_case, atau kunci khusus aplikasi (not_allowed, invalid_sort, unsupported_filter).
                      example: min
                    params:
                      description: >
                        Objek bernama untuk aturan yang dipetakan, larik posisional untuk sisanya.
                        Nilai leaf selalu string; `values` (in, not_in, mimes) dan `keys` (unsupported_filter) berupa list string.
                      example: { min: "8" }
            trace_id:
              type: string
              format: uuid
          required: [code, message, details, trace_id]
      required: [error]
    PaginationMeta:
      type: object
      properties:
        per_page:
          type: integer
        next_cursor:
          type: string
          nullable: true
        prev_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
      required: [per_page, next_cursor, prev_cursor, has_more]
    PaginationLinks:
      type: object
      properties:
        next:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
      required: [next, prev]
    AuthToken:
      type: object
      properties:
        token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
            role:
              type: string
          required: [id, name, email, role]
      required: [token, token_type, user]
    Facility:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [hospital, blood_bank, donation_unit, mobile_unit]
        address:
          type: string
        city:
          type: string
        province:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        is_active:
          type: boolean
      required: [id, code, name, type, address, city, province, phone, email, is_active]
    FacilityWithCoordinates:
      allOf:
        - $ref: '#/components/schemas/Facility'
        - type: object
          properties:
            latitude:
              type: number
              format: double
              nullable: true
            longitude:
              type: number
              format: double
              nullable: true
    FacilityWrite:
      type: object
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9-]{3,32}$'
          description: Otomatis di-uppercase sebelum divalidasi.
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [hospital, blood_bank, donation_unit, mobile_unit]
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        province:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Wajib untuk tipe `hospital` dan `blood_bank`.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Wajib untuk tipe `hospital` dan `blood_bank`.
      required: [code, name, type, address, city, province, phone]
    AuditLogEntry:
      type: object
      description: >-
        `changes` sudah ter-redaksi saat ditulis ([REDACTED] untuk kunci
        sensitif); kolom terenkripsi (mis. phone/email/address donor) tidak
        pernah muncul di sini sama sekali. Pembaca non-global hanya menerima
        barisnya sendiri (`actor_facility_id` miliknya).
      properties:
        id:
          type: string
          description: ID numerik internal, diekspos sebagai string opaque (audit_logs tidak punya public_id).
        auditable_type:
          type: string
        auditable_id:
          type: integer
        action:
          type: string
          enum: [created, updated, deleted]
        actor_id:
          type: integer
          nullable: true
        actor_facility_id:
          type: integer
          nullable: true
        changes:
          type: object
          properties:
            before:
              type: object
            after:
              type: object
        trace_id:
          type: string
          format: uuid
          nullable: true
        ip:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
      required: [id, auditable_type, auditable_id, action, actor_id, actor_facility_id, changes, trace_id, ip, occurred_at]
    DonorProfile:
      type: object
      description: >-
        `id` numerik internal, `nik`, `nik_hash`, dan `phone_hash` tidak
        pernah keluar ke API. NIK yang sudah terisi dilaporkan lewat
        `has_nik`, bukan nilainya sendiri.
      properties:
        id:
          type: string
          format: uuid
          description: Public ID donor (`public_id`).
        donor_number:
          type: string
        full_name:
          type: string
        date_of_birth:
          type: string
          format: date
        sex:
          type: string
          enum: [male, female]
        blood_group:
          type: string
          enum: [A, B, AB, O]
          nullable: true
        rh_factor:
          type: string
          enum: [positive, negative]
          nullable: true
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        address:
          type: string
        city:
          type: string
        weight_kg:
          type: number
          format: double
          nullable: true
        last_donation_date:
          type: string
          format: date
          nullable: true
        donation_count:
          type: integer
        has_nik:
          type: boolean
      required:
        - id
        - donor_number
        - full_name
        - date_of_birth
        - sex
        - blood_group
        - rh_factor
        - phone
        - email
        - address
        - city
        - weight_kg
        - last_donation_date
        - donation_count
        - has_nik
    EligibilitySelfCheck:
      type: object
      description: >-
        `outcome` bertiga-nilai, jangan diperas jadi boolean.
        `is_provisional` selalu true karena pemanggil anonim tidak punya
        deferral tersimpan untuk dipertimbangkan.
      properties:
        outcome:
          type: string
          enum: [eligible, not_eligible, undetermined]
        is_provisional:
          type: boolean
          enum: [true]
        retry_after_date:
          type: string
          format: date
          nullable: true
        findings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                  - AGE_BELOW_MINIMUM
                  - AGE_ABOVE_MAXIMUM
                  - DONATION_INTERVAL_NOT_MET
                  - BODY_WEIGHT_BELOW_MINIMUM
                  - ACTIVE_DEFERRAL
                  - DATA_MISSING
              outcome:
                type: string
                enum: [eligible, not_eligible, undetermined]
              retry_after_date:
                type: string
                format: date
                nullable: true
              detail:
                type: string
                nullable: true
            required: [code, outcome, retry_after_date, detail]
      required: [outcome, is_provisional, retry_after_date, findings]
    ReadinessReport:
      type: object
      properties:
        status:
          type: string
          enum: [ready, degraded]
        checks:
          type: object
          properties:
            database:
              type: boolean
            redis:
              type: boolean
            worker:
              type: boolean
          required: [database, redis, worker]
      required: [status, checks]
  responses:
    ValidationFailed:
      description: Validasi input gagal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Token tidak ada atau tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Token valid tapi tidak berhak atas resource ini.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request bertabrakan dengan state yang sedang berjalan (mis. Idempotency-Key yang sama masih diproses).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit terlampaui.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Kesalahan tak terduga di server. `details` selalu kosong di sini agar tidak membocorkan internal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
